<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Equinox – Background</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@300;400;500;600;700;800&family=Montserrat:wght@300;400;500;600&display=swap');

    *{margin:0;padding:0;box-sizing:border-box}

    body{
      font-family:'Montserrat',sans-serif;
      background:linear-gradient(135deg,#0e0514 0%,#180820 25%,#1e0a10 50%,#160618 75%,#0e0514 100%);
      background-size:400% 400%;
      animation:gradientShift 20s ease infinite;
      color:#f5eedd;
      overflow-x:hidden;
      min-height:100vh;
      padding:2rem;
      position:relative;
    }

    @keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

    .sky-background{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;opacity:.70;pointer-events:none}
    .sky-background::after{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(160,50,230,0.28) 0%,rgba(200,120,30,0.18) 50%,rgba(140,40,210,0.28) 100%);mix-blend-mode:screen;pointer-events:none}
    .sky-canvas{
      width:100%;
      height:100%;
      filter:hue-rotate(50deg) saturate(2.5) brightness(0.30) contrast(1.4);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div class="sky-background">
    <canvas class="sky-canvas" id="skyCanvas"></canvas>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/loaders/GLTFLoader.js";

    let scene, camera, renderer, skyMesh;
    const clock = new THREE.Clock();

    function initSkyScene() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 12);

      const canvas = document.getElementById('skyCanvas');
      renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);

      const ambientLight = new THREE.AmbientLight(0xb870ff, 3.2);
      scene.add(ambientLight);

      const loader = new GLTFLoader();
      loader.load('../models/skyblue.glb', function (gltf) {
        skyMesh = gltf.scene;

        if (skyMesh) {
          skyMesh.scale.set(5, 5, 5);
          skyMesh.position.set(0, 0, 0);

          skyMesh.traverse((child) => {
            if (child.isMesh) {
              if (gltf.parser && gltf.parser.json && gltf.parser.json.textures) {
                const textureIndex = 0;
                if (gltf.parser.json.textures[textureIndex]) {
                  gltf.parser.loadTexture(textureIndex).then((texture) => {
                    child.material.map = texture;
                    child.material.color.setHex(0xffffff);
                    child.material.transparent = false;
                    child.material.opacity = 1;
                    child.material.needsUpdate = true;
                  });
                }
              } else {
                child.material = new THREE.MeshBasicMaterial({
                  color: 0x87CEEB,
                  side: THREE.FrontSide,
                  wireframe: false
                });
              }
            }
          });

          scene.add(skyMesh);
        }
      }, undefined, function () {
        const geometry = new THREE.SphereGeometry(1, 32, 32);
        const colors = [];
        const pos = geometry.attributes.position;
        for (let i = 0; i < pos.count; i++) colors.push(0.53, 0.81, 0.98);
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        const material = new THREE.MeshBasicMaterial({ vertexColors: true, wireframe: false });
        skyMesh = new THREE.Mesh(geometry, material);
        scene.add(skyMesh);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      if (skyMesh) {
        skyMesh.rotation.y = t * 0.02;
        skyMesh.rotation.x = Math.sin(t * 0.03) * 0.1;
      }
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener('load', () => { initSkyScene(); animate(); });
    window.addEventListener('resize', onWindowResize);
  </script>
</body>
</html>
