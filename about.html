<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About – Henriëtta van Niekerk</title>
<link rel="icon" type="image/png" href="HenLogo.png">
<script>
  /* follows the toggle on the main page (same origin, so same storage) */
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
  })();
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

@font-face{
  font-family:'DotempDemo';
  src:url('fonts/DotempDemo.ttf') format('truetype');
  font-weight:normal; font-style:normal;
}
.px{ font-family:'DotempDemo',monospace; font-style:normal; font-size:.9em }

html{ font-size:clamp(1rem,.94rem + .3vw,1.15rem) }

/* ── the room ──────────────────────────────────────────────────
   Henrietta's own page, so it keeps the site's blue-teal family
   the way the playground does, warmed up for a cottage. */
:root{
  --ink:#f1faee; --ink-rgb:241,250,238;
  --muted:#a8dadc; --muted-rgb:168,218,220;
  --accent:#66fcf1; --accent-rgb:102,252,241;
  --paper:#080e13; --paper-2:#0d1720;
  --card:rgba(12,22,29,.92);
  --edge:rgba(168,218,220,.18);
  --shadow:0 22px 60px rgba(0,0,0,.6);
  --sky-1:#18303f; --sky-2:#0b1620;
}
:root[data-theme="light"]{
  --ink:#12181f; --ink-rgb:18,24,31;
  --muted:#2c5f66; --muted-rgb:44,95,102;
  --accent:#135F5A; --accent-rgb:19,95,90;
  --paper:#eef4f6; --paper-2:#dfeaee;
  --card:rgba(255,255,255,.94);
  --edge:rgba(19,95,90,.22);
  --shadow:0 22px 60px rgba(46,70,74,.22);
  --sky-1:#cfe4ec; --sky-2:#eef4f6;
}

*{ margin:0; padding:0; box-sizing:border-box }
html,body{ height:100%; overflow:hidden }
body{
  font-family:'Montserrat',sans-serif; color:var(--ink);
  background:radial-gradient(120% 90% at 50% 0%, var(--paper-2), var(--paper) 72%);
  touch-action:none;
}
a{ color:inherit }

/* ── stage ───────────────────────────────────────────────────── */
#stage{ position:fixed; inset:0 }
#gl{ position:absolute; inset:0; display:block; width:100%; height:100% }

/* ── the plus markers, straight off the reference ─────────────── */
#pins{ position:absolute; inset:0; pointer-events:none }
.pin{
  position:absolute; width:34px; height:34px; margin:-17px 0 0 -17px;
  border-radius:50%; border:1px solid rgba(255,255,255,.7);
  background:rgba(255,255,255,.22); backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  color:#fff; font-size:19px; line-height:32px; text-align:center;
  cursor:pointer; pointer-events:auto;
  box-shadow:0 4px 14px rgba(0,0,0,.35);
  transition:transform .28s cubic-bezier(.22,1,.36,1), background .22s, opacity .3s;
  opacity:0;
}
:root[data-theme="light"] .pin{
  border-color:rgba(19,95,90,.5); background:rgba(255,255,255,.62); color:#0d4b47;
}
.pin.show{ opacity:1 }
.pin:hover{ transform:scale(1.22); background:rgba(255,255,255,.4) }
.pin .ring{
  position:absolute; inset:-7px; border-radius:50%;
  border:1px solid rgba(255,255,255,.45); animation:ping 2.8s ease-out infinite;
}
:root[data-theme="light"] .pin .ring{ border-color:rgba(19,95,90,.35) }
@keyframes ping{ 0%{transform:scale(.8);opacity:.75} 70%{transform:scale(1.5);opacity:0} 100%{opacity:0} }
.pin .lbl{
  position:absolute; left:50%; top:calc(100% + 9px); transform:translateX(-50%);
  white-space:nowrap; font-size:.66rem; letter-spacing:.16em; text-transform:uppercase;
  font-weight:600; color:var(--ink); opacity:.0; transition:opacity .25s;
  text-shadow:0 1px 6px rgba(0,0,0,.55); pointer-events:none;
}
:root[data-theme="light"] .pin .lbl{ text-shadow:0 1px 6px rgba(255,255,255,.8) }
.pin:hover .lbl{ opacity:.9 }

/* ── the panel a zone opens ──────────────────────────────────── */
#panel{
  position:absolute; right:clamp(16px,3vw,44px); top:50%;
  width:min(440px,calc(100vw - 32px)); max-height:78vh; overflow-y:auto;
  transform:translate(24px,-50%); opacity:0; pointer-events:none;
  background:var(--card); border:1px solid var(--edge); border-radius:18px;
  padding:clamp(20px,2.4vw,30px); box-shadow:var(--shadow);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  transition:opacity .4s ease, transform .5s cubic-bezier(.22,1,.36,1);
}
#panel.open{ opacity:1; transform:translate(0,-50%); pointer-events:auto }
#panel h2{
  font-family:'Cormorant Garamond',serif; font-size:clamp(1.5rem,2.6vw,2rem);
  font-weight:600; line-height:1.15; margin:0 0 .2rem;
}
#panel .eyebrow{
  display:block; font-size:.66rem; letter-spacing:.2em; text-transform:uppercase;
  color:var(--accent); font-weight:700; margin-bottom:.5rem;
}
#panel p{ font-size:.92rem; line-height:1.72; opacity:.88; margin:0 0 .85rem }
#panel p:last-child{ margin-bottom:0 }
#panel ul{ list-style:none; margin:.2rem 0 .9rem }
#panel li{ font-size:.88rem; line-height:1.6; opacity:.86; padding-left:1.1rem; position:relative; margin-bottom:.35rem }
#panel li::before{ content:'→'; position:absolute; left:0; color:var(--accent); opacity:.8 }
#panel .row{ display:flex; gap:.5rem; flex-wrap:wrap; margin:.6rem 0 .2rem }
#panel .chip{
  font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; font-weight:600;
  padding:.3rem .6rem; border-radius:999px;
  border:1px solid var(--edge); background:rgba(var(--muted-rgb),.08); opacity:.9;
}
#panel .meta{ font-size:.78rem; opacity:.62; margin-top:.9rem; line-height:1.6 }
#panel a.link{ color:var(--accent); text-decoration:underline; text-underline-offset:3px }
#panel .close{
  position:absolute; top:12px; right:14px; width:30px; height:30px; border:0;
  border-radius:50%; background:rgba(var(--muted-rgb),.12); color:var(--ink);
  font-size:17px; line-height:1; cursor:pointer; opacity:.7;
}
#panel .close:hover{ opacity:1 }

/* ── chrome ──────────────────────────────────────────────────── */
.chrome{
  position:absolute; left:50%; bottom:clamp(14px,2.6vh,28px); transform:translateX(-50%);
  display:flex; align-items:center; gap:.7rem; z-index:6;
}
.chrome #hint{
  font-size:.72rem; letter-spacing:.1em; opacity:.5; white-space:nowrap;
  transition:opacity .4s;
}
.chrome button{
  font-family:inherit; font-size:.72rem; letter-spacing:.12em; text-transform:uppercase;
  font-weight:600; color:var(--ink); cursor:pointer;
  padding:.5rem .9rem; border-radius:999px;
  border:1px solid var(--edge); background:rgba(var(--muted-rgb),.08);
  opacity:0; pointer-events:none; transition:opacity .3s, background .2s;
}
.chrome button.show{ opacity:1; pointer-events:auto }
.chrome button:hover{ background:rgba(var(--accent-rgb),.14) }

/* ── loading ─────────────────────────────────────────────────── */
#boot{
  position:absolute; inset:0; display:grid; place-items:center;
  background:var(--paper); z-index:20; transition:opacity .7s ease;
  font-size:.74rem; letter-spacing:.24em; text-transform:uppercase; opacity:1;
}
#boot.gone{ opacity:0; pointer-events:none }
#boot span{ opacity:.55 }

@media (max-width:820px){
  #panel{ right:auto; left:50%; top:auto; bottom:76px; transform:translate(-50%,16px);
          width:min(440px,calc(100vw - 24px)); max-height:52vh }
  #panel.open{ transform:translate(-50%,0) }
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="pins"></div>

  <aside id="panel" role="dialog" aria-label="About Henrietta">
    <button class="close" id="panelClose" aria-label="Close">&times;</button>
    <div id="panelBody"></div>
  </aside>

  <div class="chrome">
    <span id="hint">drag to look around &middot; click a <b>+</b></span>
    <button type="button" id="back">step ba<span class="px">ck</span></button>
  </div>

  <div id="boot"><span>warming the room&hellip;</span></div>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/environments/RoomEnvironment.js';

/* ═══════════════════════════════════════════════════════════════
   THE DESK

   One corner of a room, in metres, lit through a window on the left.

   The window is on the LEFT of the desk rather than behind it or in
   front of it, which is the actual rule: behind you and the screen
   is backlit, in front of you and it glares. Side light also gives
   every object on the desk a lit face and a shadow side, which is
   the whole difference between a render and a diagram.

   Surfaces are real PBR: oak, limewash plaster, linen, all from
   ambientCG (CC0). Geometry is smooth and high-segment, because the
   brief was no low poly. The laptop is Hen's own macbook.glb.

   Click the desk and you sit down in the chair. From there the
   laptop, the notebook, the mug and the window are each their own
   thing to click.
   ═══════════════════════════════════════════════════════════════ */

const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.02, 60);
const isLight = () => document.documentElement.getAttribute('data-theme') === 'light';

/* an indoor environment map, so metal and glaze have something to reflect
   and nothing reads as flat vertex colour */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ── textures ─────────────────────────────────────────────────── */
const TL = new THREE.TextureLoader();
function surf(name, { repeat=[1,1], color, rough=1, metal=0, normal=0.7 } = {}){
  const grab = (suffix, srgb) => {
    const t = TL.load(`tex/${name}-${suffix}.jpg`);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeat[0], repeat[1]);
    if (srgb) t.colorSpace = THREE.SRGBColorSpace;
    return t;
  };
  const m = new THREE.MeshStandardMaterial({
    map: grab('col', true),
    normalMap: grab('nrm'),
    roughnessMap: grab('rgh'),
    roughness: rough, metalness: metal,
    normalScale: new THREE.Vector2(normal, normal),
  });
  if (color) m.color.setHex(color);
  return m;
}

const MAT = {};
function buildMaterials(){
  MAT.oak     = surf('wood',    { repeat:[1.6, 0.8], color:0xd8b48a, rough:0.58, normal:0.8 });
  MAT.oakLeg  = surf('wood',    { repeat:[0.5, 3.0], color:0xc9a478, rough:0.62, normal:0.7 });
  MAT.floor   = surf('floor',   { repeat:[3, 2.4],  rough:0.7,  normal:0.85 });
  MAT.wall    = surf('plaster', { repeat:[2.2, 1.8], color:0xbdd2cb, rough:0.96, normal:0.45 });
  MAT.linen   = surf('linen',   { repeat:[2, 3],    color:0xf2efe6, rough:0.92, normal:0.6 });
  MAT.linen.side = THREE.DoubleSide;
  MAT.seat    = surf('linen',   { repeat:[1.4, 1.4], color:0x8fbdb2, rough:0.9,  normal:0.7 });
  MAT.rug     = surf('linen',   { repeat:[3, 2.2],  color:0x9dc4bb, rough:0.95, normal:0.8 });
  MAT.trim    = new THREE.MeshStandardMaterial({ color:0xf6f3ea, roughness:0.55 });
  MAT.steel   = new THREE.MeshStandardMaterial({ color:0xb9c2c4, roughness:0.28, metalness:0.92 });
  MAT.brass   = new THREE.MeshStandardMaterial({ color:0xc7a24a, roughness:0.3,  metalness:0.9 });
  MAT.glaze   = new THREE.MeshStandardMaterial({ color:0xeef3f0, roughness:0.12, metalness:0.0 });
  MAT.glazeIn = new THREE.MeshStandardMaterial({ color:0x2f6f68, roughness:0.16 });
  MAT.coffee  = new THREE.MeshStandardMaterial({ color:0x3a2318, roughness:0.22 });
  MAT.terra   = new THREE.MeshStandardMaterial({ color:0xb8705a, roughness:0.72 });
  MAT.leaf    = new THREE.MeshStandardMaterial({ color:0x4c7f5e, roughness:0.68, side:THREE.DoubleSide });
  MAT.paper   = new THREE.MeshStandardMaterial({ color:0xf6f2e7, roughness:0.88 });
  MAT.ink     = new THREE.MeshStandardMaterial({ color:0x1f3b3a, roughness:0.5 });
  MAT.rubber  = new THREE.MeshStandardMaterial({ color:0x23282b, roughness:0.62 });
  MAT.sky     = new THREE.MeshBasicMaterial({ color:0xdcece8 });
}

/* ── helpers ──────────────────────────────────────────────────── */
const ROOM = new THREE.Group(); scene.add(ROOM);
const box = (w,h,d, mat, x,y,z, ry=0) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d, 2,2,2), mat);
  m.position.set(x,y,z); m.rotation.y = ry;
  m.castShadow = true; m.receiveShadow = true; ROOM.add(m); return m;
};
const cyl = (rt,rb,h, mat, x,y,z, seg=48) => {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true;
  ROOM.add(m); return m;
};

/* ── the shell, in metres ─────────────────────────────────────── */
const W = 3.4, D = 2.6, H = 2.55;
function buildShell(){
  const f = new THREE.Mesh(new THREE.BoxGeometry(W, 0.12, D), MAT.floor);
  f.position.set(W/2, -0.06, D/2); f.receiveShadow = true; ROOM.add(f);
  box(W, H, 0.1, MAT.wall, W/2, H/2, -0.05);        /* back wall  */
  box(0.1, H, D, MAT.wall, -0.05, H/2, D/2);        /* left wall  */
  /* skirting: the line that tells you the wall meets a floor */
  box(W, 0.11, 0.022, MAT.trim, W/2, 0.055, 0.011);
  box(0.022, 0.11, D, MAT.trim, 0.011, 0.055, D/2);

  /* a wool rug under the chair, turned a few degrees off square because
     nothing in a real room is square to anything */
  const r = box(1.9, 0.014, 1.35, MAT.rug, 1.62, 0.007, 1.25, 0.05);
  r.castShadow = false;
}

/* ── the window, on the left, beside the desk ─────────────────── */
const SILL_Y = 0.95, WIN_H = 1.26, WIN_Z = 1.30, WIN_W = 1.34;
function buildWindow(){
  /* what is outside: a pale coastal wash, bright enough to read as the
     light source rather than as a picture of one */
  const pane = new THREE.Mesh(new THREE.PlaneGeometry(WIN_W, WIN_H), MAT.sky);
  pane.rotation.y = Math.PI/2; pane.position.set(0.012, SILL_Y + WIN_H/2, WIN_Z);
  ROOM.add(pane);
  /* a soft horizon, so it is not one flat rectangle of colour */
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(WIN_W, WIN_H * 0.38),
    new THREE.MeshBasicMaterial({ color:0x8fb8bd }));
  sea.rotation.y = Math.PI/2; sea.position.set(0.014, SILL_Y + WIN_H * 0.19, WIN_Z);
  ROOM.add(sea);

  /* joinery. A reveal, then the frame, then a mullion and a transom. */
  const jamb = 0.055;
  box(0.1, WIN_H + 0.12, jamb, MAT.trim, 0.05, SILL_Y + WIN_H/2, WIN_Z - WIN_W/2 - jamb/2);
  box(0.1, WIN_H + 0.12, jamb, MAT.trim, 0.05, SILL_Y + WIN_H/2, WIN_Z + WIN_W/2 + jamb/2);
  box(0.1, jamb, WIN_W + jamb*2, MAT.trim, 0.05, SILL_Y + WIN_H + jamb/2, WIN_Z);
  box(0.06, 0.042, WIN_W, MAT.trim, 0.03, SILL_Y + WIN_H * 0.56, WIN_Z);
  box(0.06, WIN_H, 0.042, MAT.trim, 0.03, SILL_Y + WIN_H/2, WIN_Z);
  /* a deep sill you could put a cup on */
  box(0.26, 0.05, WIN_W + 0.2, MAT.trim, 0.14, SILL_Y - 0.02, WIN_Z);
  box(0.3, 0.05, WIN_W + 0.26, MAT.trim, 0.16, SILL_Y - 0.06, WIN_Z);

  /* one linen curtain, drawn to the far side. Asymmetry reads as a room
     somebody lives in; a matched pair reads as a showroom. */
  const g = new THREE.CylinderGeometry(0.012, 0.012, WIN_W + 0.5, 20);
  const rod = new THREE.Mesh(g, MAST_BRASS());
  rod.rotation.x = Math.PI/2; rod.position.set(0.17, SILL_Y + WIN_H + 0.17, WIN_Z);
  rod.castShadow = true; ROOM.add(rod);
  const curtain = new THREE.Mesh(
    new THREE.CylinderGeometry(0.1, 0.13, WIN_H + 0.34, 22, 1, true), MAT.linen);
  curtain.position.set(0.19, SILL_Y + WIN_H/2 + 0.1, WIN_Z + WIN_W/2 + 0.12);
  curtain.castShadow = true; ROOM.add(curtain);
}
const MAST_BRASS = () => MAT.brass;

/* ── the desk ─────────────────────────────────────────────────────
   740mm to the top, which is the standard, and 1550 x 680, which is
   enough for a laptop and a notebook side by side and nothing else.
   Solid oak slab on tapered legs, set 80mm off the wall so the
   skirting has somewhere to go. */
const DESK_Y = 0.74, DESK_X = 1.62, DESK_Z = 0.44;
const DESK_W = 1.55, DESK_D = 0.68;
function buildDesk(){
  const top = box(DESK_W, 0.038, DESK_D, MAT.oak, DESK_X, DESK_Y, DESK_Z);
  top.geometry.computeVertexNormals();
  /* a thin apron under the front edge, so the slab does not read as card */
  box(DESK_W - 0.1, 0.055, 0.03, MAT.oakLeg, DESK_X, DESK_Y - 0.048, DESK_Z + DESK_D/2 - 0.04);
  /* four tapered legs, inset the way furniture actually is */
  const legX = DESK_W/2 - 0.09, legZ = DESK_D/2 - 0.08;
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz]) => {
    const l = new THREE.Mesh(new THREE.CylinderGeometry(0.019, 0.026, DESK_Y - 0.02, 20), MAT.oakLeg);
    l.position.set(DESK_X + sx*legX, (DESK_Y - 0.02)/2, DESK_Z + sz*legZ);
    l.rotation.z = -sx * 0.035; l.rotation.x = sz * 0.035;
    l.castShadow = true; l.receiveShadow = true; ROOM.add(l);
  });
}

/* ── the chair ────────────────────────────────────────────────── */
const CHAIR_Z = DESK_Z + 0.5;
function buildChair(){
  const seat = box(0.44, 0.05, 0.42, MAT.seat, DESK_X, 0.45, CHAIR_Z, -0.06);
  seat.geometry.computeVertexNormals();
  /* two uprights and a shaped back, with air between it and the seat. A
     solid slab from seat to shoulder reads as a partition, not a chair. */
  [-1, 1].forEach(sx => {
    const up = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.016, 0.44, 16), MAT.oakLeg);
    up.position.set(DESK_X + sx * 0.2, 0.63, CHAIR_Z + 0.2);
    up.rotation.x = -0.1; up.castShadow = true; ROOM.add(up);
  });
  const back = box(0.38, 0.23, 0.045, MAT.seat, DESK_X, 0.80, CHAIR_Z + 0.2, -0.06);
  back.rotation.x = -0.1;
  back.geometry.computeVertexNormals();
  /* a cushion, because a hard chair is not cosy */
  const cush = box(0.35, 0.035, 0.33, MAT.linen, DESK_X, 0.49, CHAIR_Z - 0.015, -0.06);
  cush.geometry.computeVertexNormals();
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz]) => {
    const l = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.018, 0.42, 16), MAT.oakLeg);
    l.position.set(DESK_X + sx*0.19, 0.21, CHAIR_Z + sz*0.17);
    l.rotation.z = -sx*0.06; l.rotation.x = sz*0.06;
    l.castShadow = true; ROOM.add(l);
  });
}

/* ── what is on the desk ──────────────────────────────────────────
   Zoned the way a desk that works is zoned. Primary reach is the
   laptop, dead centre at arm's length. Secondary is the mug and the
   notebook to the right, where a right hand lands. The lamp is on
   the LEFT so it does not throw your writing hand's shadow across
   the page. The plant and the headphones are tertiary, pushed to
   the back corner and the wall. Around forty percent of the top is
   left with nothing on it, which is what makes a desk read calm. */
const P = {};
function buildDeskThings(){
  /* the mug: a lathe, so the wall has a thickness and the lip is round */
  const prof = [];
  for (let i = 0; i <= 12; i++){
    const t = i/12;
    prof.push(new THREE.Vector2(0.038 + Math.sin(t*Math.PI)*0.008, t*0.095));
  }
  prof.push(new THREE.Vector2(0.036, 0.095), new THREE.Vector2(0.0, 0.094), new THREE.Vector2(0.0, 0.0));
  const mug = new THREE.Mesh(new THREE.LatheGeometry(prof, 48), MAT.glaze);
  mug.position.set(DESK_X + 0.5, DESK_Y + 0.019, DESK_Z + 0.1);
  mug.castShadow = true; ROOM.add(mug);
  const handle = new THREE.Mesh(new THREE.TorusGeometry(0.031, 0.0085, 14, 30, Math.PI*1.35), MAT.glaze);
  handle.position.set(DESK_X + 0.5 + 0.048, DESK_Y + 0.07, DESK_Z + 0.1);
  handle.rotation.set(0, Math.PI/2, -0.5); handle.castShadow = true; ROOM.add(handle);
  const brew = new THREE.Mesh(new THREE.CircleGeometry(0.036, 40), MAT.coffee);
  brew.rotation.x = -Math.PI/2; brew.position.set(DESK_X + 0.5, DESK_Y + 0.093, DESK_Z + 0.1);
  ROOM.add(brew);
  P.mug = new THREE.Vector3(DESK_X + 0.5, DESK_Y + 0.1, DESK_Z + 0.1);

  /* the notebook and a pen, squared to the desk edge but not to the laptop */

/* ── lighting ─────────────────────────────────────────────────────
   Three layers, which is how a room is actually lit: daylight through
   the window doing the modelling, a bounce to keep the shadows from
   going black, and the desk lamp as a warm accent you can see the
   source of. */
const sun = new THREE.DirectionalLight(0xfff0dc, 3.0);
sun.position.set(-3.4, 2.9, WIN_Z + 0.9);
sun.target.position.set(DESK_X, 0.6, DESK_Z + 0.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.3; sun.shadow.camera.far = 12;
sun.shadow.camera.left = -3; sun.shadow.camera.right = 3;
sun.shadow.camera.top = 3;   sun.shadow.camera.bottom = -2;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.012; sun.shadow.radius = 3;
/* a broad soft fill standing in for the sky through the glass */
const skyFill = new THREE.RectAreaLight ? null : null;
const bounce = new THREE.DirectionalLight(0xd8e8ea, 0.5);
bounce.position.set(2.2, 1.6, 3.0);
const amb = new THREE.HemisphereLight(0xe8f2f0, 0x6a5a48, 0.55);
const bulb = new THREE.PointLight(0xffc98a, 2.2, 1.5, 2.2);
bulb.position.set(DESK_X - 0.46, DESK_Y + 0.3, DESK_Z - 0.05);
const screen = new THREE.PointLight(0xbfe4ff, 0.5, 0.9, 2.0);
screen.position.set(DESK_X, DESK_Y + 0.16, DESK_Z - 0.02);
scene.add(sun, sun.target, bounce, amb, bulb, screen);

function paintTheme(){
  const L = isLight();
  const bg = L ? 0xdfeae8 : 0x0c1518;
  scene.background = new THREE.Color(bg);
  sun.intensity    = L ? 3.2 : 1.05;
  bounce.intensity = L ? 0.55 : 0.2;
  amb.intensity    = L ? 0.6 : 0.3;
  bulb.intensity   = L ? 0.9 : 3.0;
  screen.intensity = L ? 0.35 : 0.9;
  MAT.sky.color.setHex(L ? 0xe6f1ef : 0x9db6bd);
  renderer.toneMappingExposure = L ? 1.0 : 1.12;
}

/* ── the laptop, which is hers ────────────────────────────────── */
function loadLaptop(){
  return new Promise(res => new GLTFLoader().load(MINE_MAC, g => {
    const o = g.scene;
    o.traverse(n => { if (n.isMesh){ n.castShadow = true; n.receiveShadow = true; } });
    o.updateMatrixWorld(true);

    /* The model ships shut. The lid is the group called Bevels_2, so it gets
       a pivot at the hinge and swings open. Which edge is the hinge is not
       documented anywhere, so this tries one, checks whether the lid actually
       went up, and takes the other if it did not. */
    const lid = o.getObjectByName('Bevels_2');
    if (lid){
      const wb = new THREE.Box3().setFromObject(lid);
      const mid = (wb.min.x + wb.max.x) / 2;
      const openIt = (z, sign) => {
        const pivot = new THREE.Group();
        pivot.position.set(mid, wb.min.y, z);
        o.add(pivot); pivot.updateMatrixWorld(true);
        pivot.attach(lid);
        pivot.rotation.x = sign * 1.88;          /* ~108 degrees, a working angle */
        o.updateMatrixWorld(true);
        return { pivot, h: new THREE.Box3().setFromObject(o).getSize(new THREE.Vector3()).y };
      };
      let a = openIt(wb.min.z, -1);
      if (a.h < 0.12){                            /* did not stand up: other hinge */
        a.pivot.rotation.x = 0; o.attach(lid); o.remove(a.pivot);
        openIt(wb.max.z, 1);
      }
    }

    /* it is already modelled at a true 304mm, so no rescaling, just placing */
    o.rotation.y = 0.06;
    o.updateMatrixWorld(true);
    const bb = new THREE.Box3().setFromObject(o);
    const c = bb.getCenter(new THREE.Vector3());
    o.position.set(DESK_X - c.x, DESK_Y + 0.019 - bb.min.y, DESK_Z - 0.04 - c.z);
    ROOM.add(o);
    P.laptop = new THREE.Vector3(DESK_X, DESK_Y + 0.14, DESK_Z - 0.09);
    res(o);
  }, undefined, () => { P.laptop = new THREE.Vector3(DESK_X, DESK_Y + 0.14, DESK_Z - 0.09); res(null); }));
}

const MINE_MAC = './models/macbook.glb';

/* ── the two places the camera stands ─────────────────────────────

const SEATED = { pos:[DESK_X - 0.05, 1.25, CHAIR_Z + 0.16], look:[DESK_X - 0.12, DESK_Y + 0.08, DESK_Z - 0.1], fov:58 };

/* ── state ────────────────────────────────────────────────────── */
const panel     = document.getElementById('panel');
const panelBody = document.getElementById('panelBody');
const hint      = document.getElementById('hint');
const backBtn   = document.getElementById('back');
const pinLayer  = document.getElementById('pins');

let stage = 'wide', openSpot = null;
const camPos = new THREE.Vector3(...WIDE.pos), camLook = new THREE.Vector3(...WIDE.look);
let toPos = camPos.clone(), toLook = camLook.clone(), toFov = WIDE.fov;
let yaw = 0, yawTo = 0, pitch = 0, pitchTo = 0;

function setStage(next){
  stage = next;
  const s = next === 'seated' ? SEATED : WIDE;
  toPos = new THREE.Vector3(...s.pos);
  toLook = new THREE.Vector3(...s.look);
  toFov = s.fov;
  yawTo = 0; pitchTo = 0;
  hint.textContent = next === 'seated'
    ? 'click the laptop, the notebook, the mug · drag to look'
    : 'click to sit down';
  backBtn.classList.toggle('show', next === 'seated');
  closePanel();
}
function openPanel(spot){
  openSpot = spot;
  panelBody.innerHTML = `<span class="eyebrow">${spot.eyebrow}</span><h2>${spot.title}</h2>${spot.html}`;
  panel.classList.add('open');
}
function closePanel(){ openSpot = null; panel.classList.remove('open'); }

/* ── pins ─────────────────────────────────────────────────────── */
const pins = SPOTS.map(spot => {
  const el = document.createElement('button');
  el.className = 'pin'; el.type = 'button';
  el.setAttribute('aria-label', spot.label);
  el.innerHTML = `<i class="ring"></i>+<span class="lbl">${spot.label}</span>`;
  el.addEventListener('click', e => {
    e.stopPropagation();
    if (spot.sit) setStage('seated'); else openPanel(spot);
  });
  pinLayer.appendChild(el);
  return { spot, el };
});
backBtn.addEventListener('click', () => setStage('wide'));
document.getElementById('panelClose').addEventListener('click', closePanel);
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (openSpot) closePanel(); else if (stage === 'seated') setStage('wide');
});

/* ── drag to look ─────────────────────────────────────────────── */
let dragging = false, px = 0, py = 0, moved = 0;
canvas.addEventListener('pointerdown', e => {
  dragging = true; moved = 0; px = e.clientX; py = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - px, dy = e.clientY - py;
  px = e.clientX; py = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
  /* seated you can glance around the desk; standing back you can swing
     round the room a bit further */
  const span = stage === 'seated' ? 0.5 : 0.7;
  yawTo   = THREE.MathUtils.clamp(yawTo   - dx * 0.0035, -span, span);
  pitchTo = THREE.MathUtils.clamp(pitchTo + dy * 0.0022, -0.3, 0.34);
});
const endDrag = e => {
  if (!dragging) return;
  dragging = false;
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  if (moved < 6){
    if (openSpot) closePanel();
    else if (stage === 'wide') setStage('seated');
  }
};
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

/* ── loop ─────────────────────────────────────────────────────── */
function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

const v = new THREE.Vector3();
function step(){
  yaw   += (yawTo   - yaw)   * 0.08;
  pitch += (pitchTo - pitch) * 0.08;
  camPos.lerp(toPos, 0.07);
  camLook.lerp(toLook, 0.08);
  camera.fov += (toFov - camera.fov) * 0.08;
  camera.updateProjectionMatrix();

  v.copy(camPos).sub(camLook);
  const r = v.length();
  const a = Math.atan2(v.x, v.z) + yaw;
  const p = THREE.MathUtils.clamp(Math.asin(v.y / r) + pitch, -0.25, 1.1);
  camera.position.set(
    camLook.x + Math.sin(a) * Math.cos(p) * r,
    camLook.y + Math.sin(p) * r,
    camLook.z + Math.cos(a) * Math.cos(p) * r);
  camera.lookAt(camLook);

  for (const { spot, el } of pins){
    const here = spot.stage === stage && !openSpot;
    const at = here ? spot.at() : null;
    if (!at){ el.style.display = 'none'; continue; }
    v.copy(at).project(camera);
    const on = v.z < 1 && Math.abs(v.x) < 1.02 && Math.abs(v.y) < 1.02;
    el.style.display = on ? '' : 'none';
    if (!on) continue;
    el.classList.add('show');
    el.style.left = ((v.x * 0.5 + 0.5) * innerWidth) + 'px';
    el.style.top  = ((-v.y * 0.5 + 0.5) * innerHeight) + 'px';
  }
  renderer.render(scene, camera);
}
function frame(){ requestAnimationFrame(frame); step(); }

buildMaterials();
buildShell();
buildWindow();
buildDesk();
buildChair();
buildDeskThings();
paintTheme();
new MutationObserver(paintTheme).observe(document.documentElement,
  { attributes:true, attributeFilter:['data-theme'] });
resize();
setStage('wide');
camPos.copy(toPos); camLook.copy(toLook); camera.fov = toFov;
loadLaptop().then(() => {
  document.getElementById('boot').classList.add('gone');
  step();
});
setTimeout(() => document.getElementById('boot').classList.add('gone'), 6000);
frame();
window.__room = { step, scene, camera, renderer, setStage, SPOTS, openPanel };
</script>
<script>
/* ── pane wiring, the same contract the playground uses ───────── */
(function () {
  addEventListener('message', e => {
    const d = e.data;
    if (d && d.type === 'theme')
      document.documentElement.setAttribute('data-theme', d.value === 'light' ? 'light' : 'dark');
  });

  if (window.parent === window) return;
  document.documentElement.setAttribute('data-embedded', '');
  /* the shell draws the one cursor for the whole site, so feed it ours */
  function post(m){ try { window.parent.postMessage(m, '*'); } catch (e) {} }
  let lx = -1, ly = -1;
  addEventListener('mousemove', e => {
    if (e.clientX === lx && e.clientY === ly) return;
    lx = e.clientX; ly = e.clientY;
    post({ type:'iframeMouse', x:lx, y:ly });
  });
  addEventListener('mousedown',  () => post({ type:'iframeDown' }));
  addEventListener('mouseup',    () => post({ type:'iframeUp' }));
  addEventListener('mouseleave', () => post({ type:'iframeLeave' }));
  const HOVER = 'a, button, .pin';
  addEventListener('mouseover', e => { if (e.target.closest(HOVER)) post({ type:'iframeHover', on:true }); });
  addEventListener('mouseout',  e => { if (e.target.closest(HOVER)) post({ type:'iframeHover', on:false }); });
})();
</script>
