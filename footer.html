<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Footer (Universal + Mobile‑fixed)</title>
  <link rel="icon" type="image/png" href="/HenLogo.png" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap');

    :root{
      --fg:#f1faee;
      --outline:rgba(168,218,220,0.18);
      /* Stage tuning (keeps desktop composition everywhere) */
      --stage-w: 980;    /* desktop design width in px */
      --stage-h: 300;    /* taller stage so elements sit closer together */    /* desktop design height in px */
      /* element positions as % of stage (so layout scales as a unit) */
      --hen-left: 40%;
      --hen-bottom: 0%;
      --hen-w: 11.25%;   /* 110px / 980px */

      --bubble-left: 47%;  /* sits between Hen (40%) and fairy (61%), closer to Hen */
      --bubble-bottom: 34%;  /* slightly closer vertically */
      --bubble-w: 17%;  /* smaller bubble */ /* ~180px / 980px */

      --sword-left: 61%;--sword-bottom: 10%;
      --sword-w: 17%;  /* 2× current size */  /* ~1.7x bigger */   /* ~64px / 980px */
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0;color:var(--fg);font-family:'Montserrat',system-ui,-apple-system,Segoe UI,Roboto,Inter,Ubuntu,'Helvetica Neue',Arial,sans-serif}

    /* Footer shell */
    footer.hen-footer{
      width:100%;
      display:grid;
      place-items:center;
      gap:1rem;
      padding:1.25rem 1rem 1.75rem;
      border-top:1px solid var(--outline);
      background:#0f1419; /* same as nav backdrop */
      scroll-margin-top: 80px; /* so #contact anchors nicely below fixed nav */
    }

    /* Fixed-composition stage that scales uniformly */
    .dangerous-stage{
      position:relative;
      width:min(var(--stage-w)*1px, 96vw);
      aspect-ratio: var(--stage-w) / var(--stage-h);
      margin-inline:auto;
      isolation:isolate;
    }

    .dangerous-stage img{image-rendering:pixelated;image-rendering:crisp-edges}

    /* Hen */
    .hen-sprite{
      position:absolute; left:var(--hen-left); bottom:var(--hen-bottom);
      width:var(--hen-w); height:auto;
      filter:drop-shadow(0 2px 0 rgba(0,0,0,.2));
    }

    /* Speech bubble (locked to stage, not the img => no sliding) */
    .bubble-float{
      position:absolute; left:var(--bubble-left); bottom:var(--bubble-bottom);
      width:var(--bubble-w); height:auto; transform:rotate(-2deg);
      pointer-events:none; /* decorative */
      filter:drop-shadow(0 3px 0 rgba(0,0,0,.25)) drop-shadow(0 8px 14px rgba(69,123,157,.35));
    }

    /* Sword button */
    .sword-btn{position:absolute; left:var(--sword-left); bottom:var(--sword-bottom); cursor:pointer; background:transparent; border:0; padding:0}
    .sword-btn img{width:var(--sword-w); height:auto; display:block;
      filter:drop-shadow(0 4px 12px rgba(69,123,157,.45)); transition:transform 160ms ease,filter 160ms ease}
    .sword-btn:hover img,.sword-btn:focus-visible img{transform:translateY(-4px) scale(1.05); filter:drop-shadow(0 6px 16px rgba(42,157,143,.55))}

    /* Socials (hero-style) */
    .social-links{display:flex;gap:1.25rem;align-items:center;justify-content:center;margin-top:.25rem;flex-wrap:wrap}
    .social-icon{
      width:52px;height:52px;border-radius:50%;
      background:rgba(168,218,220,0.1); border:2px solid rgba(168,218,220,0.3);
      display:flex;align-items:center;justify-content:center; position:relative;overflow:hidden;transition:all .3s ease; backdrop-filter:blur(10px)
    }
    .social-icon::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(168,218,220,.2),transparent);transition:left .5s}
    .social-icon:hover{transform:translateY(-3px) scale(1.05);border-color:rgba(168,218,220,.6);background:rgba(168,218,220,.2);box-shadow:0 8px 25px rgba(168,218,220,.3)}
    .social-icon:hover::before{left:100%}
    .social-icon svg{width:22px;height:22px;stroke:#a8dadc;transition:all .3s ease;z-index:1}
    .social-icon:hover svg{stroke:#f1faee;transform:scale(1.1)}
    .social-tooltip{position:absolute;bottom:120%;left:50%;transform:translateX(-50%);background:rgba(15,20,25,.98);color:#f1faee;padding:.5rem 1rem;border-radius:6px;font-size:.8rem;white-space:nowrap;opacity:0;pointer-events:none;transition:all .3s ease;border:1px solid rgba(168,218,220,.4);backdrop-filter:blur(15px);z-index:100;font-weight:500}
    .social-icon:hover .social-tooltip{opacity:1;transform:translateX(-50%) translateY(-5px)}

    /* Credit */
    .credit{text-align:center;opacity:.8;font-size:.95rem;margin:.5rem 0 0}

    /* Mobile niceties */
    @media (max-width:640px){
      .social-links{gap:1rem}
      .social-icon{width:56px;height:56px} /* bigger touch target */
      .credit{font-size:.9rem}
    }
  </style>
</head>
<body>
  <!-- Give the footer the #contact anchor so the nav can always jump here -->
  <footer id="contact" class="hen-footer" role="contentinfo">
    <div class="dangerous-stage" aria-label="It’s dangerous to go alone — take this! (visual only)">
      <img class="hen-sprite" src="/HenSprite.png" alt="Hen, tiny 8‑bit adventurer" />
      <img class="bubble-float" src="/Dangerous_Bubble.png" alt="" aria-hidden="true" />
      <button class="sword-btn" aria-label="Open resume" title="Open resume" onclick="(window.openResumePopup? openResumePopup() : window.location.href='/HenResume.pdf')">
        <img src="https://i.pinimg.com/originals/ef/92/86/ef92866ae3725f7148677928e585c11f.gif" alt="8‑bit sword" />
      </button>
    </div>

    <!-- Socials -->
    <div class="social-links">
      <button class="social-icon" onclick="window.open('https://www.linkedin.com/in/henriettavanniekerk','_blank')" aria-label="LinkedIn">
        <i data-lucide="linkedin"></i><div class="social-tooltip">LinkedIn</div>
      </button>
      <button class="social-icon" onclick="window.open('https://github.com/henliz','_blank')" aria-label="GitHub">
        <i data-lucide="github"></i><div class="social-tooltip">GitHub</div>
      </button>
      <button class="social-icon" onclick="window.open('mailto:henrietta@skrimp.ai','_self')" aria-label="Email">
        <i data-lucide="mail"></i><div class="social-tooltip">Email</div>
      </button>
    </div>

    <p class="credit">built by Hen with lots of ❤ and copious amounts of ☕</p>
  </footer>

  <script>
    // Make Lucide icons render even if the host page didn't init them
    document.addEventListener('DOMContentLoaded', function(){
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    });
  </script>
</body>
</html>
