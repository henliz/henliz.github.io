<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Footer (Universal + Mobile-fixed)</title>
  <link rel="icon" type="image/png" href="/HenLogo.png" />
  <script src="https://unpkg.com/lucide@0.474.0/dist/umd/lucide.js"></script>
  <style>
    /* Satoshi, same as the rest of the site. This file is opened on its
       own as well as injected, so it carries its own @font-face rather
       than relying on the shell's; absolute paths, because the footer is
       pulled into routes several directories deep. */
    @font-face{font-family:'Satoshi';src:url('/fonts/Satoshi-300.woff2') format('woff2');font-weight:300;font-display:swap}
    @font-face{font-family:'Satoshi';src:url('/fonts/Satoshi-400.woff2') format('woff2');font-weight:400;font-display:swap}
    @font-face{font-family:'Satoshi';src:url('/fonts/Satoshi-500.woff2') format('woff2');font-weight:500;font-display:swap}
    @font-face{font-family:'Satoshi';src:url('/fonts/Satoshi-700.woff2') format('woff2');font-weight:700;font-display:swap}

    :root{
      --fg:#f1faee;
      --outline:rgba(168,218,220,0.18);
      /* ft- prefixed on purpose: the shell already owns --accent and sets
         it per scene, and this stylesheet is injected into that page. */
      --ft-accent:#a8dadc;
      --ft-bg:#0f1419;

      /* Tighter scene so the “back to top” sits close */
      /* Scaled up as one piece when the social row came out. Everything
         on the stage is a percentage of these two, so moving both by the
         same factor (980x175 -> 1300x232) makes the art bigger without
         disturbing a single position. */
      --stage-w: 1300;
      --stage-h: 300;

      /* Hen */
      --hen-left: 40%;
      --hen-bottom: 0%;
      --hen-w: 15.5%;

      /* Bubble: tiny nudge LEFT, and a bit higher to eat blank space */
      --bubble-left-base: 49.5%;
      --bubble-w: 12.5%;
      /* previously + (0.6 * width) + ~0.5% ; now slide left ~0.4% */
      --bubble-left: calc(var(--bubble-left-base) + (0.4 * var(--bubble-w)) - 0.4%);
      --bubble-bottom: 52%;

      /* GIF: to the RIGHT of Hen, centered correctly, under the bubble */
      --sword-w: 5%;
      /* center = hen left + hen width + gap + (gif width / 2) */
      /* the gap closed from 7.5% to 3%: with the orb finally sized off the
         stage rather than off its own gif, the old spacing left it
         stranded out on its own, and 1.5% brings it in beside her */
      --sword-left: calc(var(--hen-left) + var(--hen-w) + 1.5% + (var(--sword-w) / 2));
      --sword-bottom: 11.5%;
    }

    /* Colours only. The footer knew one set of them, so in light mode it
       kept painting near-white text and a pale cyan arrow onto the pale
       background the shell swaps underneath it: both were there, just
       invisible. The geometry above stays in plain :root, or the whole
       stage collapses on any page that is not in light mode. */
    :root[data-theme="light"]{
      --fg:#12181f;
      --outline:rgba(18,24,31,0.12);
      --ft-accent:#2b7a82;
      --ft-bg:#eef4f6;
    }

    *{box-sizing:border-box}
    /* Only the reset stays global. The colour and the face belong on the
       footer itself: this stylesheet is injected into the shell's head,
       where an html,body rule lands on the whole site and, arriving last,
       outranks the shell's own body rule. It was quietly setting every
       page's body font to Montserrat. */
    html,body{margin:0;padding:0}

    /* Footer shell (minimal spacing above the scene) */
    footer.hen-footer{
      color:var(--fg);
      font-family:'Satoshi',-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Inter,Ubuntu,'Helvetica Neue',Arial,sans-serif;
      width:100%;
      display:grid;
      place-items:center;
      gap:.02rem;                 /* almost zero gap */
      padding:.25rem 1rem 1.35rem;/* tighter top padding */
      border-top:1px solid var(--outline);
      background:var(--ft-bg);
      scroll-margin-top: 80px;
    }

    .dangerous-stage{
      position:relative;
      /* 100% matters as much as the other two: in the shell this footer
         sits in a column beside the rail, about 1080px wide, and a stage
         asking for 1300 overflowed it to the right and threw the art
         128px off centre. Standalone it had the whole viewport, so it
         looked fine and the fault only showed where it is actually used. */
      width:min(var(--stage-w)*1px, 96vw, 100%);
      aspect-ratio: var(--stage-w) / var(--stage-h);
      margin-inline:auto;
      isolation:isolate;
    }

    .dangerous-stage img{image-rendering:pixelated;image-rendering:crisp-edges}

    /* Hen. She is four animated webps now rather than one still frame:
       an idle that loops, and three flourishes that play over the top of
       it now and then. Two stacked layers, but no cross fade: all four
       were cut to begin and end on the one standing pose the three takes
       share, so the swap has nothing to hide. */
    .hen-sprite{
      position:absolute; left:var(--hen-left); bottom:var(--hen-bottom);
      width:var(--hen-w); line-height:0;
      filter:drop-shadow(0 2px 0 rgba(0,0,0,.2));
      /* on the wrapper, so the idle and all three flourishes mirror
         together and stay registered with each other */
      transform:scaleX(-1);
    }
    .hen-sprite .base{ display:block; width:100%; height:auto }
    .hen-sprite .flourish{
      position:absolute; inset:0; width:100%; height:auto;
      opacity:0; pointer-events:none;
    }
    .hen-sprite .flourish.on{ opacity:1 }
    /* this art is drawn, not pixel art: the stage's blanket pixelated
       rule turns her edges into staircases */
    .hen-sprite img{ image-rendering:auto }

    /* Speech bubble */
    .bubble-float{
      position:absolute; left:var(--bubble-left); bottom:var(--bubble-bottom);
      width:var(--bubble-w); height:auto;
      transform:translate(-50%,0);
      filter:drop-shadow(0 10px 30px rgba(0,0,0,.35));
      pointer-events:none;
    }

    /* GIF (Faerie) */
    .sword-btn{
      position:absolute; left:var(--sword-left); bottom:var(--sword-bottom);
      transform:translate(-50%,0); /* center on computed left */
      cursor:pointer; background:transparent; border:0; padding:0;
      /* The width belongs HERE, on the box whose containing block is the
         stage. It used to sit on the img inside, where a percentage
         resolves against this button instead, and this button is
         shrink-to-fit around that same img: 17% of the gif's own 288px,
         so the orb rendered at 49px no matter what the stage did. It
         never scaled with anything. */
      width:var(--sword-w);
    }
    .sword-btn img{
      width:100%; height:auto; display:block;
      filter:drop-shadow(0 4px 12px rgba(69,123,157,.45));
      transition:transform 160ms ease,filter 160ms ease
    }
    .sword-btn:hover img,.sword-btn:focus-visible img{
      transform:translateY(-2px) scale(1.05);
      filter:drop-shadow(0 6px 16px rgba(42,157,143,.55))
    }

    /* The footer's own social buttons are gone, but this rule stays.
       This file's styles are injected into the shell, and .social-tooltip
       is also the rail's class name there, so deleting it would restyle
       five tooltips that have nothing to do with the footer. The hover
       rule that used to carry the blur went with the buttons: a
       backdrop-filter is a compositing layer whether or not you can see
       through it, and it was landing on all five while they sat at
       opacity 0. */
    .social-tooltip{position:absolute;bottom:120%;left:50%;transform:translateX(-50%);padding:.3rem .5rem;border-radius:.5rem;font-size:.8rem;background:rgba(15,20,25,.8);color:#f1faee;opacity:0;pointer-events:none;transition:all .2s ease;border:1px solid rgba(168,218,220,.4);z-index:100;font-weight:500}

    .credit{text-align:center;opacity:.8;font-size:.95rem;margin:.2rem 0 0}

    @media (max-width:640px){
      .credit{font-size:.9rem}
    }

    /* back to top */
    .back-to-top{ display:grid; place-items:center; margin:.02rem 0 0; }
    .to-top-btn{
      all:unset; cursor:pointer;
      display:grid; place-items:center; gap:.3rem;
      color:var(--fg); font-weight:500; opacity:.9;
    }
    .to-top-btn .arrow-wrap{ width:18px; height:18px; display:grid; place-items:center; }
    /* Lucide swaps <i> for <svg>; spin the svg around its true center */
    .to-top-btn .arrow-wrap svg{
      width:18px; height:18px; stroke:var(--ft-accent);
      transform-origin:center;
      transform-box:fill-box;
      animation: topSpin 8s linear infinite;
      will-change: transform;
    }
    .to-top-btn:hover .arrow-wrap svg{ animation-duration: 3s; }
    @keyframes topSpin{ to{ transform: rotate(360deg) } }
    @media (prefers-reduced-motion: reduce){ .to-top-btn .arrow-wrap svg{ animation:none } }
  </style>
</head>
<body>
  <footer id="contact" class="hen-footer" role="contentinfo">
    <div class="back-to-top">
      <button class="to-top-btn" aria-label="back to top"
              onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">
        <span class="arrow-wrap"><i data-lucide="arrow-up"></i></span>
        <span class="label">back to top</span>
      </button>
    </div>

    <div class="dangerous-stage" aria-label="It’s dangerous to go alone — take this! (visual only)">
      <div class="hen-sprite" id="henSprite">
        <img class="base" src="/hen-idle.webp" alt="Hen, a tiny fairy, shifting her weight"
             onload="if(!window.__henIdleAsked){window.__henIdleAsked=1;var s=document.createElement('script');s.src='/hen-idle.js';document.head.appendChild(s);}" />
      </div>
      <img class="bubble-float" src="/Dangerous_Bubble.png" alt="" aria-hidden="true" />
      <button class="sword-btn" aria-label="Open resume" title="Open resume" onclick="(window.openResumePopup? openResumePopup() : window.location.href='/Henrietta_van_Niekerk_Resume_2026.pdf')">
        <img src="https://i.pinimg.com/originals/ef/92/86/ef92866ae3725f7148677928e585c11f.gif" alt="8-bit sword" />
      </button>
    </div>


    <p class="credit"><br>built by Hen with lots of ❤ and copious amounts of ☕</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function(){
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    });

  </script>
</body>
</html>
