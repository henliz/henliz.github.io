<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Footer (Universal + Mobile-fixed)</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    /* Satoshi, same as the rest of the site. This file is opened on its
       own as well as injected, so it carries its own @font-face rather
       than relying on the shell's; absolute paths, because the footer is
       pulled into routes several directories deep. */
    @font-face{font-family:'Satoshi';src:url('/fonts/Satoshi-400.woff2') format('woff2');font-weight:400;font-display:swap}
    @font-face{font-family:'Satoshi';src:url('/fonts/Satoshi-500.woff2') format('woff2');font-weight:500;font-display:swap}
    @font-face{font-family:'DotempDemo';src:url('/fonts/DotempDemo.woff2') format('woff2'),url('/fonts/DotempDemo.ttf') format('truetype');font-display:swap}

    :root{
      --fg:#f1faee;
      --outline:rgba(168,218,220,0.18);
      /* ft- prefixed on purpose: the shell already owns --accent and sets
         it per scene, and this stylesheet is injected into that page. */
      --ft-accent:#a8dadc;
      --ft-bg:#0f1419;
    }
    :root[data-theme="light"]{
      --fg:#12181f;
      --outline:rgba(18,24,31,0.12);
      --ft-accent:#2b7a82;
      --ft-bg:#eef4f6;
    }

    *{box-sizing:border-box}
    /* Only the reset stays global. The colour and the face belong on the
       footer itself: this stylesheet is injected into the shell's head,
       where an html,body rule lands on the whole site and, arriving last,
       outranks the shell's own body rule. */
    html,body{margin:0;padding:0}

    footer.hen-footer{
      display:block; container-type:inline-size;
      color:var(--fg);
      font-family:'Satoshi',-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Inter,'Helvetica Neue',Arial,sans-serif;
      width:100%;
      padding:3rem clamp(1rem,4cqi,2.5rem) 1.4rem;
      border-top:1px solid var(--outline);
      background:var(--ft-bg);
      scroll-margin-top:80px;
    }

    /* hen's cafe. a tiny counter in the footer where you make yourself a
       drink for the road. everything on it is a real physics thing
       (matter.js), js/cafe.js runs it. without js you just get the counter */
    :root footer.hen-footer.cafe-foot{
      display:block; position:relative; overflow:hidden;
      padding:2.4rem clamp(1rem,4cqi,2.5rem) 1.1rem;
      background:linear-gradient(180deg, #0f1419 0%, #151b2b 100%) !important;
    }
    /* light mode: the same cyan as the sky behind the glass card, just a
       touch deeper, and still see-through so the sky shows through it */
    :root[data-theme="light"] footer.hen-footer.cafe-foot{
      background:linear-gradient(180deg, rgba(120,198,226,.2) 0%, rgba(86,174,212,.34) 100%) !important;
      border-top-color:rgba(255,255,255,.55);
    }
    .cafe-title{
      position:relative; z-index:1; margin:0 auto; text-align:center; max-width:30ch;
      font:400 clamp(1rem,2.4cqi,1.25rem)/1.25 'DotempDemo', monospace; color:var(--fg);
    }
    /* the stall itself is drawn on the canvas, this box just says where it
       goes. the canvas covers the whole footer so you can drag things off
       the counter and leave them anywhere */
    .cafe{ position:relative; width:100%; max-width:860px; height:330px; margin:.8rem auto 0; }
    .cafe-canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; z-index:2; }
    .cafe-canvas.grab{ cursor:grab; }
    .cafe-canvas.grabbing{ cursor:grabbing; }

    /* the drink's name pops up beside the glass, same sticker as mini hen's bubble */
    .cafe-order{
      position:absolute; left:0; top:0; z-index:3; margin:0; pointer-events:none;
      width:max-content; max-width:min(180px, 40vw); text-align:center;
      font:400 .85rem/1.2 'DotempDemo', monospace; color:#14202b;
      padding:.35rem .5rem; background:#fff;
      box-shadow:0 0 0 2px #fff, 0 0 0 4px #14202b, 3px 5px 0 2px rgba(20,32,43,.3);
      opacity:0; transform:translate(-100%, -50%) scale(.6); transform-origin:100% 50%;
      transition:opacity .18s ease, transform .35s cubic-bezier(.34,1.5,.64,1);
    }
    .cafe-order.on{ opacity:1; transform:translate(-100%, -50%) scale(1); }
    .cafe-order::after{
      content:''; position:absolute; left:100%; top:50%; margin:-5px 0 0 2px;
      border:5px solid transparent; border-left-color:#14202b;
    }

    /* keyboard way in: the same steps as buttons, tucked away until you tab in */
    .cafe-keys{ position:absolute; right:0; top:0; z-index:4; display:flex; flex-wrap:wrap; justify-content:flex-end; gap:.35rem; max-width:min(420px, 80%); }
    .cafe-keys:not(:focus-within){ clip-path:inset(50%); width:1px; height:1px; overflow:hidden; }
    .cafe-keys button{
      all:unset; cursor:pointer; font:500 .78rem/1 'Satoshi',sans-serif; color:#14202b; background:#fbefdc;
      padding:.4rem .6rem; border-radius:999px; box-shadow:0 2px 0 #3e241b;
    }
    .cafe-keys button:focus-visible{ outline:2px solid #ffe45c; outline-offset:2px; }

    .ft-base{
      position:relative; z-index:1; display:flex; justify-content:center; text-align:center;
      max-width:980px; margin:.9rem auto 0; font-size:.82rem;
    }
    .ft-base p{ margin:0; opacity:.6; }
    @media (max-width:640px){ .cafe{ height:320px; } }
    @media (prefers-reduced-motion:reduce){ .cafe-order{ transition:opacity .18s ease; } }

    /* The footer's own social buttons are gone, but this rule stays.
       This file's styles are injected into the shell, and .social-tooltip
       is also the rail's class name there, so deleting it would restyle
       five tooltips that have nothing to do with the footer. */
    .social-tooltip{position:absolute;bottom:120%;left:50%;transform:translateX(-50%);padding:.3rem .5rem;border-radius:.5rem;font-size:.8rem;background:rgba(15,20,25,.8);color:#f1faee;opacity:0;pointer-events:none;transition:all .2s ease;border:1px solid rgba(168,218,220,.4);z-index:100;font-weight:500}
  </style>
</head>
<body>
  <footer id="contact" class="hen-footer cafe-foot" role="contentinfo">
    <canvas class="cafe-canvas" aria-hidden="true"></canvas>
    <p class="cafe-title">thank you for visiting! take a beverage for the road?</p>
    <section class="cafe" data-cafe aria-label="a little cafe stall: make yourself a drink">
      <div class="cafe-keys" role="group" aria-label="Make a drink"></div>
    </section>
    <p class="cafe-order" aria-live="polite"></p>
    <div class="ft-base">
      <p>built by Hen with lots of ❤ and copious amounts of ☕</p>
    </div>
  </footer>

  <!-- opened on its own, the footer runs the cafe itself -->
  <script src="/js/cafe.js" defer></script>
</body>
</html>
