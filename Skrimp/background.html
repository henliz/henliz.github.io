<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Skrimp – Background</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@300;400;500;600;700;800&family=Montserrat:wght@300;400;500;600&display=swap');

    *{margin:0;padding:0;box-sizing:border-box}

    body{
      font-family:'Montserrat',sans-serif;
      background:linear-gradient(135deg,#081208 0%,#0a1e0f 25%,#0d2b14 50%,#0a1e0f 75%,#081208 100%);
      background-size:400% 400%;
      animation:gradientShift 20s ease infinite;
      color:#f1faee;
      overflow-x:hidden;
      min-height:100vh;
      padding:2rem;
      position:relative;
    }

    @keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

    /* Sky background stays behind; cannot block input */
    .sky-background{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;opacity:.65;pointer-events:none}
    .sky-background::after{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(60,200,215,0.22) 0%,rgba(40,180,200,0.14) 50%,rgba(30,165,190,0.22) 100%);mix-blend-mode:screen;pointer-events:none}
    .sky-canvas{width:100%;height:100%;filter:hue-rotate(-20deg) saturate(1.3) brightness(0.94)}
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div class="sky-background">
    <canvas class="sky-canvas" id="skyCanvas"></canvas>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      const slots = document.querySelectorAll('[data-include]');
      for (const slot of slots) {
        const url = slot.getAttribute('data-include');
        if (!url) continue;
        try {
          const res = await fetch(url, { credentials: 'same-origin' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const html = await res.text();
          const baseURL = new URL(url, location.href);
          const tpl = document.createElement('template');
          tpl.innerHTML = html;
          tpl.content.querySelectorAll('[src],[href]').forEach(el => {
            if (el.hasAttribute('src')) {
              const v = el.getAttribute('src');
              if (v && !/^(?:[a-z]+:\/|#)/i.test(v)) el.setAttribute('src', new URL(v, baseURL).href);
            }
            if (el.hasAttribute('href')) {
              const v = el.getAttribute('href');
              if (v && !/^(?:[a-z]+:\/|#)/i.test(v)) el.setAttribute('href', new URL(v, baseURL).href);
            }
          });
          const scriptNodes = Array.from(tpl.content.querySelectorAll('script'));
          const frag = document.createDocumentFragment();
          Array.from(tpl.content.childNodes).forEach(n => frag.appendChild(n));
          slot.replaceWith(frag);
          for (const old of scriptNodes) {
            const s = document.createElement('script');
            for (const { name, value } of Array.from(old.attributes)) s.setAttribute(name, value);
            if (!old.src) s.textContent = old.textContent || '';
            (document.body || document.documentElement).appendChild(s);
          }
        } catch (err) {
          console.error('Include failed for', url, err);
          const fallback = document.createElement('div');
          fallback.textContent = `Failed to load ${url}`;
          slot.replaceWith(fallback);
        }
      }
    });
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/loaders/GLTFLoader.js";

    let scene, camera, renderer, skyMesh;
    const clock = new THREE.Clock();

    function initSkyScene() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 12);

      const canvas = document.getElementById('skyCanvas');
      renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);

      const ambientLight = new THREE.AmbientLight(0x00d4e8, 3.2);
      scene.add(ambientLight);

      const loader = new GLTFLoader();
      loader.load('../models/skyblue.glb', function (gltf) {
        skyMesh = gltf.scene;
        if (skyMesh) {
          skyMesh.scale.set(5, 5, 5);
          skyMesh.position.set(0, 0, 0);
          skyMesh.traverse((child) => {
            if (child.isMesh) {
              if (gltf.parser && gltf.parser.json && gltf.parser.json.textures) {
                const textureIndex = 0;
                if (gltf.parser.json.textures[textureIndex]) {
                  gltf.parser.loadTexture(textureIndex).then((texture) => {
                    child.material.map = texture;
                    child.material.color.setHex(0xffffff);
                    child.material.transparent = false;
                    child.material.opacity = 1;
                    child.material.needsUpdate = true;
                  });
                }
              } else {
                child.material = new THREE.MeshBasicMaterial({
                  color: 0x87CEEB, side: THREE.FrontSide, wireframe: false
                });
              }
            }
          });
          scene.add(skyMesh);
        }
      }, undefined, function () {
        const geometry = new THREE.SphereGeometry(1, 32, 32);
        const colors = [];
        const pos = geometry.attributes.position;
        for (let i = 0; i < pos.count; i++) colors.push(0.0, 0.78, 0.85);
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        const material = new THREE.MeshBasicMaterial({ vertexColors: true, wireframe: false });
        skyMesh = new THREE.Mesh(geometry, material);
        scene.add(skyMesh);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      if (skyMesh) {
        skyMesh.rotation.y = t * 0.02;
        skyMesh.rotation.x = Math.sin(t * 0.03) * 0.1;
      }
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener('load', () => { initSkyScene(); animate(); });
    window.addEventListener('resize', onWindowResize);
  </script>
</body>
</html>
