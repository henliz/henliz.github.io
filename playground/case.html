<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="description" content="Experiments, sketches and unfinished things by Henriëtta van Niekerk: shaders, generative art, interaction tests and the offcuts that never became a case study.">
  <link rel="canonical" href="https://henliz.github.io/playground/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Playground — Henriëtta van Niekerk">
  <meta property="og:description" content="Experiments, sketches and unfinished things by Henriëtta van Niekerk: shaders, generative art, interaction tests and the offcuts that never became a case study.">
  <meta property="og:url" content="https://henliz.github.io/playground/">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playground – Henriëtta van Niekerk</title>
    <link rel="icon" type="image/png" href="/HenLogo.png">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,700&display=swap" rel="stylesheet">
    <script>
      // follows the toggle on the main page (same origin, so same storage)
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
      })();
    </script>
    <style>
/* Satoshi, self-hosted — see index.html for why it replaced Montserrat. */
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-500.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-700.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}

    /* ── type scale ────────────────────────────────────────────────
       One fluid root so every rem on the page grows with the screen
       instead of sitting at a fixed 16px. The floor and ceiling are
       in rem, not px, so a reader who has raised their browser's
       default font size keeps that increase (WCAG 1.4.4). */
    html { font-size: clamp(1rem, 0.94rem + 0.3vw, 1.15rem); }

    @font-face {
      font-family: 'DotempDemo';
      src: url('../fonts/DotempDemo.ttf') format('truetype');
      font-weight: normal; font-style: normal;
    }
    /* The two halves of the blend. Titles alternate between them a few
       characters at a time, the same way the case studies do, which is
       the house treatment and was missing here entirely. */
    .px { font-family: 'DotempDemo', monospace; font-style: normal; font-weight: 400; font-size: 0.88em; }
    .di { font-family: 'Didot', 'Cormorant Garamond', serif; font-style: italic; font-weight: 700; }

    /* ── the desk ─────────────────────────────────────────────────
       This is Henrietta's own page, so it keeps the site's blue-teal
       family rather than taking a project's colour the way the case
       studies do. */
    :root {
      --ink:        #f1faee;
      --ink-rgb:    241, 250, 238;
      --muted-rgb:  168, 218, 220;
      --accent:     #66fcf1;
      --accent-rgb: 102, 252, 241;
      --paper:      #070d13;
      --paper-2:    #0b141c;
      --grid:       rgba(168, 218, 220, 0.085);
      --grid-major: rgba(168, 218, 220, 0.16);
      --card:       #0f1a22;
      --edge:       rgba(168, 218, 220, 0.16);
      --shadow:     0 18px 42px rgba(0, 0, 0, 0.55);
      --tape:       rgba(102, 252, 241, 0.22);
    }
    :root[data-theme="light"] {
      --ink:        #12181f;
      --ink-rgb:    18, 24, 31;
      --muted-rgb:  18, 24, 31;
      --accent:     #135F5A;
      --accent-rgb: 19, 95, 90;
      --paper:      #eef4f6;
      --paper-2:    #e3edf1;
      --grid:       rgba(19, 95, 90, 0.13);
      --grid-major: rgba(19, 95, 90, 0.22);
      --card:       #ffffff;
      --edge:       rgba(18, 24, 31, 0.12);
      --shadow:     0 16px 38px rgba(30, 60, 70, 0.20);
      --tape:       rgba(19, 95, 90, 0.20);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; overflow: hidden; }
    body {
      font-family:'Satoshi', sans-serif;
      color: var(--ink);
      /* graph paper, two grids deep — the fine one is the draftsman's
         squares, the heavy one every fifth line */
      background:
        linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 28px 28px,
        linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 28px 28px,
        linear-gradient(var(--grid-major) 1px, transparent 1px) 0 0 / 140px 140px,
        linear-gradient(90deg, var(--grid-major) 1px, transparent 1px) 0 0 / 140px 140px,
        radial-gradient(120% 90% at 30% 0%, var(--paper-2), var(--paper) 70%);
      background-attachment: local, local, local, local, fixed;
      touch-action: none;
    }
    /* Unlike the case studies, this one keeps painting its own paper when
       embedded: it is a desk, and a desk is a surface, not a window onto
       the shell's sky. */

    /* ── viewport + world ─────────────────────────────────────── */
    #desk {
      position: fixed; inset: 0;
      cursor: grab;
      overscroll-behavior: contain;
    }
    #desk.dragging { cursor: grabbing; }
    #world {
      position: absolute; top: 0; left: 0;
      width: 0; height: 0;
      will-change: transform;
    }
    /* keyboard users get a real focus ring on anything clickable */
    a:focus-visible, button:focus-visible, .item:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: 4px;
    }

    /* ── the things on the desk ───────────────────────────────── */
    .item {
      position: absolute;
      transform-origin: 50% 50%;
      /* the page pans; nothing here should also be draggable as an image */
      -webkit-user-drag: none; user-select: none;
      /* everything drifts in once, staggered, so the desk assembles
         itself rather than appearing all at once */
      opacity: 0;
      animation: settle 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes settle {
      from { opacity: 0; transform: translateY(16px) scale(0.97); }
      to   { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .item { animation: none; opacity: 1; }
    }

    .frame {
      display: block;
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 10px;
      box-shadow: var(--shadow);
      overflow: hidden;
      line-height: 0;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.3s ease, border-color 0.3s ease;
    }
    .frame img, .frame video { width: 100%; height: auto; display: block; }
    .frame.plain { background: none; border: none; box-shadow: none; border-radius: 0; }

    /* YouTube paints its own furniture over a video the moment it is
       hovered: title bar, share, watch later. The iframe never receives
       the pointer, so it never believes it is hovered and never draws
       any of it. The desk can also be dragged straight across a clip
       now, which it could not be before. */
    .ytframe iframe { pointer-events: none; }
    /* a clip is postage-stamp sized on a desk this wide, so hovering one
       brings it up to something you can actually watch */
    .item:has(.ytframe):hover { z-index: 70 !important; }
    .item:has(.ytframe):hover .ytframe {
      transform: scale(1.55);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6);
      border-color: rgba(var(--accent-rgb), 0.45);
    }
    :root[data-theme="light"] .item:has(.ytframe):hover .ytframe {
      box-shadow: 0 26px 60px rgba(30, 60, 70, 0.3);
    }

    /* a tile you can actually open */
    a.frame { cursor: pointer; }
    a.frame:hover, a.frame:focus-visible {
      transform: translateY(-4px) scale(1.015);
      border-color: rgba(var(--accent-rgb), 0.55);
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.6),
                  0 0 0 1px rgba(var(--accent-rgb), 0.25);
    }
    :root[data-theme="light"] a.frame:hover,
    :root[data-theme="light"] a.frame:focus-visible {
      box-shadow: 0 20px 44px rgba(30, 60, 70, 0.26),
                  0 0 0 1px rgba(var(--accent-rgb), 0.3);
    }

    /* washi tape, for the pinned-up look */
    .taped::before {
      content: '';
      position: absolute;
      top: -12px; left: 50%;
      width: 86px; height: 24px;
      transform: translateX(-50%) rotate(-3deg);
      background: var(--tape);
      border-radius: 2px;
      z-index: 2;
      pointer-events: none;
    }
    .taped.tape-left::before  { left: 18%; transform: rotate(-8deg); }
    .taped.tape-right::before { left: auto; right: 12%; transform: rotate(7deg); }

    /* ── captions ─────────────────────────────────────────────── */
    .cap {
      position: absolute;
      width: max-content;
      max-width: 390px;
    }
    .cap h2 {
      font-weight: 600;
      font-size: 1.95rem;
      line-height: 1.16;
      letter-spacing: 0.01em;
      color: var(--ink);
      margin-bottom: 0.45rem;
    }
    .cap p {
      font-size: 1.04rem;
      font-weight: 400;
      line-height: 1.5;
      color: rgba(var(--muted-rgb), 0.74);
      max-width: 34ch;
    }
    .cap .year {
      display: inline-block;
      font-family: 'DotempDemo', monospace;
      font-size: 1rem;
      color: rgba(var(--accent-rgb), 0.9);
      margin-bottom: 0.45rem;
      letter-spacing: 0.06em;
    }
    /* a handwritten aside with a little arrow, like a margin note */
    /* An aside is words plus an arrow, and the arrow has a job: its stem
       starts at the words and its head lands on the thing being talked
       about. So the direction decides which side of the text it sits on,
       not just which way the path curves. */
    .scribble {
      position: absolute;
      display: flex;
      gap: 4px;
      font-family: 'Satoshi', sans-serif;
      font-style: normal;
      font-size: 1.05rem;
      font-weight: 500;
      color: rgba(var(--muted-rgb), 0.8);
      line-height: 1.45;
      width: max-content;
    }
    .scribble span { max-width: 290px; }
    .scribble.a-right { flex-direction: row;            align-items: center }
    .scribble.a-left  { flex-direction: row-reverse;    align-items: center }
    .scribble.a-down  { flex-direction: column;         align-items: center }
    .scribble.a-up    { flex-direction: column-reverse; align-items: center }
    .scribble svg { display: block; overflow: visible; flex: none }
    /* two passes of the same line at partial strength, the way a pencil
       gone over twice reads, rather than one clean vector curve */
    .scribble path { stroke: rgba(var(--muted-rgb), 0.72); fill: none;
                     stroke-width: 4; stroke-linecap: round;
                     stroke-linejoin: round; }

    /* ── the welcome note ─────────────────────────────────────── */
    /* the rhythm here is in px on purpose: the ruled lines have to land
       under the text, and a rem padding would drift with the type scale */
    .note {
      position: absolute;
      width: 560px;
      padding: 44px 46px 52px;
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 4px 4px 10px 10px;
      box-shadow: var(--shadow);
      background-image: repeating-linear-gradient(
        to bottom, transparent 0 43px, rgba(var(--muted-rgb), 0.12) 43px 44px);
      background-position: 0 44px;
      background-repeat: repeat;
    }
    .note::before {
      content: '';
      position: absolute;
      top: -14px; left: 34px;
      width: 108px; height: 30px;
      background: var(--tape);
      transform: rotate(-4deg);
      border-radius: 2px;
    }
    /* Title and portrait share the top of the note as one band. Floating
       her into the body split the paragraph into two ragged columns,
       which is exactly what a sticky note should not look like. */
    .note .head {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      /* Head plus this margin is 132px, three ruled lines, so the body
         below lands back on the rules. The 104 is measured, not derived:
         the blend mixes two font sizes on one baseline, so a two-line
         title at line-height 44 makes line boxes of 52, not 44. */
      margin-bottom: 28px;
    }
    .note h1 {
      flex: 1;
      font-weight: 600;
      font-size: 2.5rem;
      line-height: 44px;
      color: var(--ink);
    }
    .note .mug {
      flex: none;
      width: 134px;
      /* she is taller than a two-line title, and the overhang top and
         bottom is what stops her opening a hole under the heading */
      margin: -22px -12px -20px 0;
    }
    .note p {
      font-family: 'Satoshi', sans-serif;
      font-size: 1.16rem;
      line-height: 44px;        /* stays on the ruled lines */
      color: rgba(var(--muted-rgb), 0.82);
    }
    .note .sign {
      display: block;
      text-align: right;
      font-family: 'Satoshi', sans-serif;
      font-style: italic;
      margin-top: 34px;
      color: rgba(var(--accent-rgb), 0.9);
    }

    /* ── a labelled way in ────────────────────────────────────── */
    .pill {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-family:'Satoshi', sans-serif;
      font-size: 1.06rem; font-weight: 600;
      color: var(--accent);
      background: rgba(var(--accent-rgb), 0.12);
      border: 1px solid rgba(var(--accent-rgb), 0.45);
      border-radius: 999px;
      padding: 0.8rem 1.6rem;
      text-decoration: none; white-space: nowrap;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }
    .pill:hover, .pill:focus-visible {
      background: rgba(var(--accent-rgb), 0.22);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    /* A write-up lands as a few small cards scattered through the work
       rather than one tall column of text — easier to read, and it lets
       the photos sit on top of them. */
    .brief {
      padding: 1.35rem 1.5rem 1.45rem;
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 10px;
      box-shadow: var(--shadow);
      font-size: 1rem;
      line-height: 1.6;
      color: rgba(var(--muted-rgb), 0.74);
    }
    .brief b {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 1.42rem;
      letter-spacing: 0.01em;
      color: var(--ink);
      margin-bottom: 0.3rem;
    }
    .cap .built {
      margin-top: 0.7rem;
      font-family: 'DotempDemo', monospace;
      font-size: 0.82rem;
      color: rgba(var(--muted-rgb), 0.5);
    }

    /* ── a slot waiting for a file ────────────────────────────── */
    .slot {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      border: 1.5px dashed rgba(var(--muted-rgb), 0.34);
      border-radius: 10px;
      background: rgba(var(--muted-rgb), 0.04);
      color: rgba(var(--muted-rgb), 0.55);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      line-height: 1.4;
      padding: 0.9rem;
      font-family:'Satoshi', sans-serif;
    }
    .slot code {
      display: block;
      font-family: 'DotempDemo', monospace;
      font-size: 0.92rem;
      letter-spacing: 0;
      text-transform: none;
      color: rgba(var(--accent-rgb), 0.85);
      margin-top: 0.4rem;
      overflow-wrap: anywhere;
    }

    /* ── fixed chrome: hint + recentre ────────────────────────── */
    .chrome {
      position: fixed;
      left: 50%; bottom: 20px;
      transform: translateX(-50%);
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.5rem 0.5rem 0.5rem 1rem;
      background: rgba(var(--ink-rgb), 0.055);
      border: 1px solid var(--edge);
      border-radius: 999px;
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      z-index: 50;
      font-size: 0.86rem;
      color: rgba(var(--muted-rgb), 0.78);
      white-space: nowrap;
      transition: opacity 0.4s ease;
    }
    .chrome.faded { opacity: 0.28; }
    .chrome.faded:hover { opacity: 1; }
    .chrome button {
      font-family:'Satoshi', sans-serif;
      font-size: 0.82rem; font-weight: 600;
      color: var(--accent);
      background: rgba(var(--accent-rgb), 0.12);
      border: 1px solid rgba(var(--accent-rgb), 0.4);
      border-radius: 999px;
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .chrome button:hover { background: rgba(var(--accent-rgb), 0.22); border-color: var(--accent); }

    /* Not a compass any more: the map is how you get around. Click it to
       jump, drag the lit rectangle to pan, and the buttons change how much
       desk fits in the window. */
    .mapwrap {
      position: fixed;
      right: 18px; bottom: 18px;
      z-index: 50;
      display: grid;
      gap: 6px;
      justify-items: end;
    }
    .minimap {
      position: relative;
      width: 186px;          /* height is set from the desk's aspect in JS */
      height: 250px;
      border: 1px solid var(--edge);
      border-radius: 10px;
      /* opaque. Through a blur the desk showed through the map and the
         two layouts read as one muddy one */
      background: var(--card);
      box-shadow: var(--shadow);
      overflow: hidden;
      cursor: pointer;
      touch-action: none;
    }
    .minimap i {
      position: absolute;
      display: block;
      border: 1.5px solid var(--accent);
      background: rgba(var(--accent-rgb), 0.16);
      border-radius: 3px;
      cursor: grab;
    }
    .minimap.dragging, .minimap.dragging i { cursor: grabbing; }
    .minimap b {
      position: absolute;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: rgba(var(--muted-rgb), 0.5);
    }
    /* a dot per thing is a blur at this size; the ones with a picture in
       them get a little more weight so the map reads as the real layout */
    .minimap b.big { width: 7px; height: 7px; background: rgba(var(--muted-rgb), 0.72); }
    /* one pill, so it reads as a zoom control and not three loose chips */
    .mapzoom {
      display: flex; align-items: center; gap: 2px;
      padding: 4px;
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 999px;
      box-shadow: var(--shadow);
    }
    .mapzoom button {
      width: 32px; height: 32px;
      font: 600 17px/1 'Satoshi', sans-serif;
      color: var(--ink);
      background: none;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      display: grid; place-items: center;
    }
    .mapzoom button:hover:not(:disabled) { background: rgba(var(--accent-rgb), 0.14); color: var(--accent); }
    .mapzoom button:disabled { opacity: 0.3; cursor: default; }
    .mapzoom span {
      font: 600 12px/1 'Satoshi', sans-serif;
      color: rgba(var(--muted-rgb), 0.8);
      font-variant-numeric: tabular-nums;
      min-width: 46px; text-align: center;
    }
    .mapzoom .fit {
      width: auto; padding: 0 11px;
      font: 600 11px/1 'Satoshi', sans-serif;
      letter-spacing: 0.04em;
      border-left: 1px solid var(--edge);
      border-radius: 0 999px 999px 0;
      margin-left: 2px;
    }

    /* the map says what it is, and the rectangle says it can be moved */
    .maplabel {
      font: 600 10px/1 'Satoshi', sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(var(--muted-rgb), 0.55);
      padding-right: 3px;
    }
    /* every item as a real block at its real size, so the map is the
       layout in miniature rather than a scatter of identical dots */
    .minimap b.blk {
      width: auto; height: auto; border-radius: 1.5px;
      background: rgba(var(--muted-rgb), 0.3);
    }
    .minimap b.pic { background: rgba(var(--muted-rgb), 0.5); }
    .minimap u {
      position: absolute;
      font: 600 7px/1 'Satoshi', sans-serif;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: rgba(var(--muted-rgb), 0.75);
      text-decoration: none;
      white-space: nowrap;
      /* sits just inside its own block. Lifting it above put the topmost
         project's name outside the map, where overflow clipped it */
      transform: translate(1px, 1px);
      pointer-events: none;
    }

    @media (max-width: 720px) {
      .note { width: min(320px, 82vw); }
      .chrome { font-size: 0.8rem; padding-left: 0.85rem; left: 12px; right: 12px; bottom: 12px;
                transform: none; justify-content: space-between; }
      .mapwrap { display: none; }
    }
    </style>
</head>
<body>


<div id="desk">
  <div id="world" aria-label="A draggable desk of side projects and experiments"></div>
</div>

<div class="chrome" id="chrome">
  <span id="hint">scroll to move around, or drag</span>
  <button type="button" id="recentre">re<span class="px">ce</span>ntre</button>
</div>

<div class="mapwrap">
    <div class="mapzoom">
      <button type="button" id="mmOut" aria-label="zoom out">&minus;</button>
      <span id="mmPct">100%</span>
      <button type="button" id="mmIn" aria-label="zoom in">+</button>
      <button type="button" id="mmFit" class="fit">fit all</button>
    </div>
    <span class="maplabel">map &middot; drag to move</span>
    <div class="minimap" id="minimap" role="application" aria-label="map of the desk, drag to move around"><i id="mmView"></i></div>
  </div>

<script>
/* ═══════════════════════════════════════════════════════════════
   THE DESK

   One big world, absolutely positioned, translated under a fixed
   viewport. Everything on it is declared in ITEMS below: give a
   thing an x/y in world coordinates and a kind, and it lands there.

   To add something of your own: drop the file in playground/media/
   and add a line to ITEMS. Nothing else needs to change.
   ═══════════════════════════════════════════════════════════════ */

/* Everything local is addressed from the site root. This document is
   served at /playground/case.html, so a path like playground/media/x.webp
   resolved to /playground/playground/media/x.webp and 404d, which had
   quietly taken out every local image on the page. */

/* kinds
   note     the ruled welcome note
   photo    an image in a frame            {src, w, rot, tape}
   clip     a muted looping video          {src, poster, w, rot}
   yt       an autoplaying muted YouTube   {id, w, rot}
   cap      a title + blurb                {title, year, body}
   note2    an aside and an arrow          {text, arrow: up|down|left|right}
   link     any of the above, clickable    add {href}
*/
const ITEMS = [

  /* Two rules fight each other here and both matter. WITHIN a project,
     things overlap and interlock: a scrapbook page, not a gallery wall.
     BETWEEN projects there is real air, so the eye knows where one thing
     stops. Asides live on the OUTSIDE edge of a cluster and point back
     in, because an arrow through the middle of a collage cuts it in half. */

/* ── build ─────────────────────────────────────────────────── */
const world = document.getElementById('world');
const desk  = document.getElementById('desk');

/* Nothing here scrolls — the world is translated under a fixed
   viewport — so loading="lazy" has no viewport to measure against and
   either loads everything at once or nothing at all. So the pan does
   it: anything within a screen of the edge gets its real src, and the
   three YouTube players only boot when you actually pan to them. */
const lazies = [];
const LOAD_MARGIN = 700;
function hydrate() {
  for (let i = lazies.length - 1; i >= 0; i--) {
    const wrap = lazies[i];
    const r = wrap.getBoundingClientRect();
    if (r.right < -LOAD_MARGIN || r.left > innerWidth + LOAD_MARGIN ||
        r.bottom < -LOAD_MARGIN || r.top > innerHeight + LOAD_MARGIN) continue;
    wrap.querySelectorAll('[data-src]').forEach(n => {
      n.src = n.dataset.src;
      delete n.dataset.src;
      if (n.tagName === 'VIDEO') { n.preload = 'metadata'; n.play().catch(() => {}); }
    });
    lazies.splice(i, 1);
  }
}

/* Five different arrows, not one gesture reused. A loop, a swoosh, an
   arc over the top, a wave and a dip, so two asides near each other
   never look like the same stamp twice.

   Every stem starts at the LEFT EDGE ON THE MID-LINE of its box, and the
   aside centres the arrow against its text, so the line joins the middle
   of the paragraph rather than trailing off the last line.

   Only the right-facing five are drawn by hand; left is those mirrored
   and up/down are them turned a quarter turn, computed rather than
   redrawn, so the same stem rule holds in every direction. */
const ARROW_S = 0.62;   /* how big an arrow is painted, relative to its drawing */
const ARROWS = {
  right: { w:110, h:64, v:[
    /* loop */ { d:'M3 32 C 14 34, 24 33, 33 28 C 21 21, 23 7, 37 9 C 49 11, 45 25, 31 29 C 49 23, 74 14, 96 7', hd:'M83 3 L100 6 L87 19' },

    /* wave */ { d:'M3 32 C 13 21, 23 40, 35 30 C 46 21, 53 38, 65 29 C 75 22, 85 25, 96 21', hd:'M84 14 L100 20 L86 31' },
    /* dip */ { d:'M3 28 C 15 38, 28 45, 42 40 C 56 35, 60 21, 73 14 C 81 10, 89 8, 97 6', hd:'M85 2 L101 5 L89 18' },
  ]},
  left: { w:110, h:64, v:[
    /* loop */ { d:'M107 32 C 96 34, 86 33, 77 28 C 89 21, 87 7, 73 9 C 61 11, 65 25, 79 29 C 61 23, 36 14, 14 7', hd:'M27 3 L10 6 L23 19' },
    /* swoosh */ { d:'M107 32 C 88 36, 66 34, 48 26 C 34 20, 22 13, 12 7', hd:'M25 3 L8 6 L20 19' },
    /* overarc */ { d:'M107 32 C 102 12, 82 2, 60 7 C 40 12, 25 21, 14 33', hd:'M26 23 L11 35 L28 41' },
    /* wave */ { d:'M107 32 C 97 21, 87 40, 75 30 C 64 21, 57 38, 45 29 C 35 22, 25 25, 14 21', hd:'M26 14 L10 20 L24 31' },
    /* dip */ { d:'M107 28 C 95 38, 82 45, 68 40 C 54 35, 50 21, 37 14 C 29 10, 21 8, 13 6', hd:'M25 2 L9 5 L21 18' },

    /* loop */ { d:'M32 3 C 30 14, 31 24, 36 33 C 43 21, 57 23, 55 37 C 53 49, 39 45, 35 31 C 41 49, 50 74, 57 96', hd:'M61 83 L58 100 L45 87' },
    /* swoosh */ { d:'M32 3 C 28 22, 30 44, 38 62 C 44 76, 51 88, 57 98', hd:'M61 85 L58 102 L45 90' },
    /* overarc */ { d:'M32 3 C 52 8, 62 28, 57 50 C 52 70, 43 85, 31 96', hd:'M41 84 L29 99 L23 82' },
    /* wave */ { d:'M32 3 C 43 13, 24 23, 34 35 C 43 46, 26 53, 35 65 C 42 75, 39 85, 43 96', hd:'M50 84 L44 100 L33 86' },
    /* dip */ { d:'M36 3 C 26 15, 19 28, 24 42 C 29 56, 43 60, 50 73 C 54 81, 56 89, 58 97', hd:'M62 85 L59 101 L46 89' },

  up: { w:64, h:110, v:[
    /* loop */ { d:'M32 107 C 34 96, 33 86, 28 77 C 21 89, 7 87, 9 73 C 11 61, 25 65, 29 79 C 23 61, 14 36, 7 14', hd:'M3 27 L6 10 L19 23' },
    /* swoosh */ { d:'M32 107 C 36 88, 34 66, 26 48 C 20 34, 13 22, 7 12', hd:'M3 25 L6 8 L19 20' },
    /* overarc */ { d:'M32 107 C 12 102, 2 82, 7 60 C 12 40, 21 25, 33 14', hd:'M23 26 L35 11 L41 28' },

function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// a frame is an <a> when it goes somewhere, a <div> when it is just nice to look at
function frame(it, inner, extraCls) {
  const external = it.href && /^https?:/i.test(it.href);
  const n = it.href ? el('a') : el('div');
  n.className = 'frame' + (it.plain ? ' plain' : '') + (it.tape ? ' taped' : '') + (extraCls ? ' ' + extraCls : '');
  if (it.href) {
    n.href = it.href;
    // case studies open in the portfolio shell, not inside this pane
    n.target = external ? '_blank' : '_top';
    if (external) n.rel = 'noopener';
  }
  n.style.width = it.w + 'px';
  n.innerHTML = inner;
  return n;
}

function build(it, i) {
  const wrap = el('div', 'item');
  wrap.style.left = it.x + 'px';
  wrap.style.top  = it.y + 'px';
  if (it.rot) wrap.style.rotate = it.rot + 'deg';
  /* Things on a desk sit on top of each other; z says which is on top.
     But the overlap is decoration, and decoration does not get to cover
     something a reader needs: a title, a tech stack, a link to go and
     play the thing. Those sit above every photo no matter what the
     item table says, so a later nudge to a collage cannot bury them. */
  const ABOVE_THE_COLLAGE = { cap:40, pill:40, note:40, brief:30 };
  wrap.style.zIndex = ABOVE_THE_COLLAGE[it.kind] || it.z || '';
  // staggered so the desk assembles rather than flashing in
  wrap.style.animationDelay = Math.min(i * 28, 900) + 'ms';

  if (it.kind === 'note') {
    const n = el('div', 'note');
    n.innerHTML = `<div class="head"><h1>${esc(it.title)}</h1>` +
      (it.mug ? `<img class="mug" src="${it.mug}" alt="" draggable="false">` : '') +
      `</div>
       <p>${esc(it.body)}</p>
       <p>Scroll to move around, or click and drag.</p>
       <span class="sign">${esc(it.sign)}</span>`;
    wrap.appendChild(n);
  }

  else if (it.kind === 'cap') {
    const n = el('div', 'cap');
    n.innerHTML = (it.year ? `<span class="year">${esc(it.year)}</span>` : '') +
                  `<h2>${esc(it.title)}</h2><p>${esc(it.body)}</p>` +
                  (it.built ? `<p class="built">${esc(it.built)}</p>` : '');
    wrap.appendChild(n);
  }

  else if (it.kind === 'brief') {
    const n = el('div', 'brief', `<b>${esc(it.lead)}</b>${esc(it.body)}`);
    n.style.width = it.w + 'px';
    wrap.appendChild(n);
  }

  else if (it.kind === 'pill') {
    const a = el('a', 'pill', `${esc(it.text)} <span aria-hidden="true">\u2197</span>`);
    a.href = it.href;
    a.target = '_blank';
    a.rel = 'noopener';
    wrap.appendChild(a);
  }

  else if (it.kind === 'figma') {
    // a real prototype you can click through, not a screenshot of one
    wrap.appendChild(frame(it,
      `<div style="height:${it.h}px">
         <iframe data-src="${it.src}" title="Figma prototype" allowfullscreen
                 style="width:100%;height:100%;border:0;display:block"></iframe>
       </div>`));
    lazies.push(wrap);
  }

  else if (it.kind === 'note2') {
    const dir = ARROWS[it.arrow] ? it.arrow : 'right';
    const a = ARROWS[dir];
    /* v picks which of the five; without one, walk them by position so
       neighbouring asides still differ */
    const v = a.v[(it.v != null ? it.v : i) % a.v.length];
    const n = el('div', 'scribble a-' + dir);
    /* ARROW_S shrinks the painted box while the viewBox stays, so one
       number moves every arrow closer to what it points at */
    n.innerHTML = `<span>${esc(it.text)}</span>
      <svg width="${Math.round(a.w * ARROW_S)}" height="${Math.round(a.h * ARROW_S)}"
           viewBox="0 0 ${a.w} ${a.h}" aria-hidden="true">
        <path d="${v.d}"/><path d="${v.hd}"/></svg>`;
    wrap.appendChild(n);
  }

  else if (it.kind === 'photo') {
    wrap.appendChild(frame(it,
      `<img data-src="${it.src}" alt="" decoding="async" draggable="false">`));
    lazies.push(wrap);
  }

  else if (it.kind === 'clip') {
    // muted + playsinline is what lets these autoplay at all
    wrap.appendChild(frame(it,
      `<video data-src="${it.src}"${it.poster ? ` poster="${it.poster}"` : ''}
              autoplay muted loop playsinline preload="none"
              disablepictureinpicture></video>`));
    lazies.push(wrap);
  }

  else if (it.kind === 'yt') {
    const src = `https://www.youtube-nocookie.com/embed/${it.id}` +
                `?autoplay=1&mute=1&loop=1&playlist=${it.id}` +
                `&controls=0&modestbranding=1&rel=0&playsinline=1`;
    wrap.appendChild(frame(it,
      `<div style="aspect-ratio:16/9">
         <iframe data-src="${src}" title="clip" allow="autoplay; encrypted-media"
                 referrerpolicy="strict-origin-when-cross-origin"
                 style="width:100%;height:100%;border:0;display:block"></iframe>
       </div>`, 'ytframe'));
    lazies.push(wrap);
  }

  world.appendChild(wrap);
}

ITEMS.forEach(build);

/* ── the pixel blend ───────────────────────────────────────────
   The house title treatment: runs of three characters in the pixel face,
   then two in the italic, alternating. Same RUNS as the case studies, so
   a title here reads as the same voice as a title there. Non-ASCII is
   left alone; the pixel face has no glyph for it. */
const RUNS = [3, 2];
function fontMix(el) {
  const text = el.textContent;
  let html = '', runIdx = 0, runCount = 0, usePx = true;
  for (let i = 0; i < text.length; i++) {
    const cp = text.codePointAt(i);
    if (cp > 127) { html += String.fromCodePoint(cp); if (cp > 0xFFFF) i++; continue; }
    const c = text[i];
    if (c === ' ') { html += ' '; continue; }
    html += `<span class="${usePx ? 'px' : 'di'}">${esc(c)}</span>`;
    if (++runCount >= RUNS[runIdx % 2]) { usePx = !usePx; runIdx++; runCount = 0; }
  }
  el.innerHTML = html;
}
document.querySelectorAll('.note h1, .cap h2').forEach(fontMix);

/* ── panning and zoom ──────────────────────────────────────────
   The world is translated AND scaled, so every conversion between the
   window and the desk has to divide by the zoom. Miss one and the map,
   the drag and the lazy loader all disagree about where things are. */
/* ZBASE is the scale the desk opens at, and it is what the readout calls
   100%. The internal number is a raw CSS scale; nobody sees it. Zooming
   in goes to three times the opening view, which is enough to read a
   wireframe label. */
const ZBASE = 0.8, ZMIN = ZBASE * 0.3, ZMAX = ZBASE * 3;
let tx = 0, ty = 0, zoom = ZBASE, dragged = false;

/* The desk is a curated thing, not an infinite void — keep the window
   inside it so you can never drift off into blank graph paper and lose
   your way back. */
function clamp() {
  if (!bounds) return;
  const lo = innerWidth  - bounds.x2 * zoom, hi = -bounds.x1 * zoom;
  const lo2 = innerHeight - bounds.y2 * zoom, hi2 = -bounds.y1 * zoom;
  // if the desk is smaller than the window in an axis, centre it instead
  tx = lo > hi ? (lo + hi) / 2 : Math.min(hi, Math.max(lo, tx));
  ty = lo2 > hi2 ? (lo2 + hi2) / 2 : Math.min(hi2, Math.max(lo2, ty));
}
function apply() {
  clamp();
  world.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${zoom})`;
  hydrate();
  drawMap();
}
function toWorld(clientX, clientY) {
  return { x: (clientX - tx) / zoom, y: (clientY - ty) / zoom };
}
/* zoom about a fixed point on the screen, so the thing under the cursor
   (or the middle of the window) stays where it is */
function setZoom(z, ax, ay) {
  const next = Math.min(ZMAX, Math.max(ZMIN, z));
  if (next === zoom) return;
  const cx = ax == null ? innerWidth / 2 : ax;
  const cy = ay == null ? innerHeight / 2 : ay;
  const before = toWorld(cx, cy);
  zoom = next;
  tx = cx - before.x * zoom;
  ty = cy - before.y * zoom;
  apply();
  showZoom();
}
function showZoom() {
  mmPct.textContent = Math.round(zoom / ZBASE * 100) + '%';
  mmIn.disabled  = zoom >= ZMAX - 1e-6;
  mmOut.disabled = zoom <= ZMIN + 1e-6;
}
function centre() {
  // put the welcome note near the top left of the window, with a margin
  const home = ITEMS.find(i => i.kind === 'note') || { x: 0, y: 0 };
  tx = -home.x * zoom + Math.min(90, innerWidth * 0.06);
  ty = -home.y * zoom + Math.min(70, innerHeight * 0.08);
  apply();
}

let px = 0, py = 0, pid = null;
desk.addEventListener('pointerdown', e => {
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  // let a link or a button take its own click
  if (e.target.closest('a, button, iframe')) return;
  pid = e.pointerId; px = e.clientX; py = e.clientY; dragged = false;
  desk.classList.add('dragging');
  desk.setPointerCapture(pid);
});
desk.addEventListener('pointermove', e => {
  if (e.pointerId !== pid) return;
  const dx = e.clientX - px, dy = e.clientY - py;
  if (!dragged && Math.hypot(dx, dy) < 4) return;   // tolerate a shaky click
  dragged = true;
  tx += dx; ty += dy;
  px = e.clientX; py = e.clientY;
  apply();
  fadeChrome();
});
function endDrag(e) {
  if (pid === null || (e && e.pointerId !== pid)) return;
  desk.classList.remove('dragging');
  try { desk.releasePointerCapture(pid); } catch (err) {}
  pid = null;
  // `dragged` stays true until the next pointerdown, so the click that
  // follows this drag can see it and ignore it
}
desk.addEventListener('pointerup', endDrag);
desk.addEventListener('pointercancel', endDrag);

// the wheel pans rather than scrolls — shift swaps the axis, as usual,
// and ctrl or cmd zooms about the cursor the way a map does
desk.addEventListener('wheel', e => {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    setZoom(zoom * (e.deltaY < 0 ? 1.12 : 1 / 1.12), e.clientX, e.clientY);
    return;
  }
  e.preventDefault();
  if (e.shiftKey) { tx -= e.deltaY + e.deltaX; }
  else { tx -= e.deltaX; ty -= e.deltaY; }
  apply();
  fadeChrome();
}, { passive: false });

// arrows and page keys, so this is reachable without a pointer at all
addEventListener('keydown', e => {
  const step = e.shiftKey ? 320 : 90;
  const moves = { ArrowLeft:[step,0], ArrowRight:[-step,0], ArrowUp:[0,step], ArrowDown:[0,-step] };
  if (moves[e.key] && !e.target.closest('input, textarea')) {
    e.preventDefault();
    tx += moves[e.key][0]; ty += moves[e.key][1];
    apply(); fadeChrome();
  }
  if (e.key === 'Home') { e.preventDefault(); centre(); }
});

document.getElementById('recentre').addEventListener('click', centre);

/* the hint retires once you have clearly got the idea */
const chrome = document.getElementById('chrome');
const hint = document.getElementById('hint');
let moved = 0, hintDone = false;
function fadeChrome() {
  if (hintDone) return;
  moved += 1;
  if (moved > 12) {
    hintDone = true;
    hint.textContent = 'arrow keys work too';
    chrome.classList.add('faded');
  }
}

/* ── the little map ────────────────────────────────────────── */
const mm = document.getElementById('minimap');
const mmView = document.getElementById('mmView');
let bounds = null;
function measure() {
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  ITEMS.forEach(it => {
    const w = it.w || (it.kind === 'note' ? 380 : 260);
    const h = it.h || w * 0.75;
    x1 = Math.min(x1, it.x); y1 = Math.min(y1, it.y);
    x2 = Math.max(x2, it.x + w); y2 = Math.max(y2, it.y + h);
  });
  const pad = 190;
  bounds = { x1: x1 - pad, y1: y1 - pad, x2: x2 + pad, y2: y2 + pad };
  bounds.w = bounds.x2 - bounds.x1;
  bounds.h = bounds.y2 - bounds.y1;

  // one dot per thing, so the map reads as a real layout
  mm.querySelectorAll('b').forEach(b => b.remove());
  /* The map is drawn to the desk's own proportions. It used to be a fixed
     108x72 box over a world twice as tall as it is wide, which squashed
     everything and is most of why it did not read as a map. */
  mm.style.height = Math.round(mm.clientWidth * bounds.h / bounds.w) + 'px';

  const PIC = { photo:1, yt:1, figma:1 };
  mm.querySelectorAll('u').forEach(u => u.remove());
  ITEMS.forEach(it => {
    const w = it.w || (it.kind === 'note' ? 560 : 300);
    const h = it.h || (it.kind === 'note' ? 430 : w * 0.62);
    const b = el('b', 'blk' + (PIC[it.kind] ? ' pic' : ''));
    b.style.left   = ((it.x - bounds.x1) / bounds.w * 100) + '%';
    b.style.top    = ((it.y - bounds.y1) / bounds.h * 100) + '%';
    b.style.width  = (w / bounds.w * 100) + '%';
    b.style.height = (h / bounds.h * 100) + '%';
    mm.insertBefore(b, mmView);
    /* and each project says its own name, which is what turns a diagram
       into something you can navigate by */
    if (it.kind === 'cap') {
      const u = el('u', '', esc(it.title));
      u.style.left = ((it.x - bounds.x1) / bounds.w * 100) + '%';
      u.style.top  = ((it.y - bounds.y1) / bounds.h * 100) + '%';
      mm.insertBefore(u, mmView);
    }
  });
}
function drawMap() {
  if (!bounds) return;
  // the window, expressed in world coordinates, drawn on the map
  const vx = -tx / zoom, vy = -ty / zoom;
  mmView.style.left   = ((vx - bounds.x1) / bounds.w * 100) + '%';
  mmView.style.top    = ((vy - bounds.y1) / bounds.h * 100) + '%';
  mmView.style.width  = (innerWidth  / zoom / bounds.w * 100) + '%';
  mmView.style.height = (innerHeight / zoom / bounds.h * 100) + '%';
}

/* ── the map as a way to get around ────────────────────────────
   Press anywhere on it to jump there, or take hold of the lit rectangle
   and drag. Both end up in the same place: work out the world point the
   pointer is over, and put the middle of the window on it. */
const mmPct = document.getElementById('mmPct');
const mmIn  = document.getElementById('mmIn');
const mmOut = document.getElementById('mmOut');
function mapGoto(e, centreOnPointer) {
  const r = mm.getBoundingClientRect();
  const fx = (e.clientX - r.left) / r.width;
  const fy = (e.clientY - r.top) / r.height;
  const wx = bounds.x1 + fx * bounds.w;
  const wy = bounds.y1 + fy * bounds.h;
  tx = innerWidth / 2 - wx * zoom;
  ty = innerHeight / 2 - wy * zoom;
  apply();
}
let mmDrag = false;
mm.addEventListener('pointerdown', e => {
  mmDrag = true;
  mm.classList.add('dragging');
  /* the jump happens FIRST. setPointerCapture throws on a pointer id the
     browser does not recognise, and when it sat above this line that
     exception took the pan down with it. Capture is a nicety; moving is
     the point. */
  mapGoto(e);
  try { mm.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
  e.stopPropagation();
});
mm.addEventListener('pointermove', e => { if (mmDrag) mapGoto(e); });
const mmEnd = e => {
  if (!mmDrag) return;
  mmDrag = false;
  mm.classList.remove('dragging');
  try { mm.releasePointerCapture(e.pointerId); } catch (err) {}
};
mm.addEventListener('pointerup', mmEnd);
mm.addEventListener('pointercancel', mmEnd);
/* the map sits over the desk, so its own wheel must not also pan it */
mm.addEventListener('wheel', e => e.stopPropagation(), { passive: true });

mmIn.addEventListener('click',  () => setZoom(zoom * 1.25));
mmOut.addEventListener('click', () => setZoom(zoom / 1.25));
document.getElementById('mmFit').addEventListener('click', () => {
  /* the whole desk in the window, which is the one view the map cannot
     show you by dragging */
  setZoom(Math.min(innerWidth / bounds.w, innerHeight / bounds.h) * 0.94);
  tx = innerWidth / 2 - (bounds.x1 + bounds.w / 2) * zoom;
  ty = innerHeight / 2 - (bounds.y1 + bounds.h / 2) * zoom;
  apply();
});
measure();
centre();
showZoom();
addEventListener('resize', () => { apply(); });
// images settle at their real height a moment after they decode, which can
// bring a neighbour into range
addEventListener('load', hydrate);

/* ── living in the portfolio's pane ────────────────────────── */
(function () {
  // theme: the shell posts it in; standalone we already read storage
  addEventListener('message', e => {
    const d = e.data;
    if (d && d.type === 'theme') {
      document.documentElement.setAttribute('data-theme', d.value === 'light' ? 'light' : 'dark');
    }
  });

  if (window.parent === window) return;
  document.documentElement.setAttribute('data-embedded', '');
  // the shell draws the one cursor for the whole site, so feed it ours
  function post(m) { try { window.parent.postMessage(m, '*'); } catch (e) {} }
  let lx = -1, ly = -1;
  addEventListener('mousemove', e => {
    if (e.clientX === lx && e.clientY === ly) return;
    lx = e.clientX; ly = e.clientY;
    post({ type: 'iframeMouse', x: lx, y: ly });
  });
  addEventListener('mousedown',  () => post({ type: 'iframeDown' }));
  addEventListener('mouseup',    () => post({ type: 'iframeUp' }));
  addEventListener('mouseleave', () => post({ type: 'iframeLeave' }));
  const HOVER = 'a, button, .frame, .note';
  addEventListener('mouseover', e => { if (e.target.closest(HOVER)) post({ type: 'iframeHover', on: true }); });
  addEventListener('mouseout',  e => { if (e.target.closest(HOVER)) post({ type: 'iframeHover', on: false }); });
})();
</script>

</body>
</html>
