<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <title>Henrietta's Portfolio</title>
    <link rel="icon" type="image/png" href="HenLogo.png">
    <link rel="shortcut icon" type="image/png" href="HenLogo.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@300;400;500;600;700;800&family=Montserrat:wght@300;400;500;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&display=swap');

        @font-face {
            font-family: 'DotempDemo';
            src: url('fonts/DotempDemo.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        .px {
            font-family: 'DotempDemo', monospace;
            font-style: normal;
            font-weight: 400;
            font-size: 0.88em;
        }
        .di {
            font-family: 'Didot', serif;
            font-style: italic;
            font-weight: 700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #0f1419;
            color: white;
            overflow-x: hidden;
        }

        /* Only hide cursor on desktop */
        @media (hover: hover) and (pointer: fine) {
            body {
                cursor: none !important;
            }

            *, *::before, *::after {
                cursor: none !important;
            }
        }

        /* Custom Cursor - Only show on desktop */
        .custom-cursor {
            position: fixed;
            width: 18px;
            height: 18px;
            background: rgba(102, 252, 241, 0.15);
            border: 1.5px solid rgba(102, 252, 241, 0.65);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            backdrop-filter: blur(6px);
            transition: width 0.15s ease, height 0.15s ease, background 0.15s ease, transform 0.08s ease-out;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.25);
            display: none;
        }

        @media (hover: hover) and (pointer: fine) {
            .custom-cursor {
                display: block;
            }
        }

        .custom-cursor.clicking {
            transform: translate(-50%, -50%) scale(0.72);
            background: rgba(102, 252, 241, 0.5);
        }

        .custom-cursor.hovering {
            width: 30px;
            height: 30px;
            background: rgba(102, 252, 241, 0.1);
            border-color: rgba(102, 252, 241, 0.8);
        }

        #app {
            width: 100%;
            min-height: 100vh;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            /* Fully transparent at rest — just the icons/links floating */
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: 1px solid transparent;
            border-radius: 0;
            box-shadow: none;
            z-index: 1000;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            overflow: hidden;
            transition:
                top           0.55s cubic-bezier(0.34, 1.2, 0.64, 1),
                width         0.55s cubic-bezier(0.34, 1.2, 0.64, 1),
                border-radius 0.55s cubic-bezier(0.34, 1.2, 0.64, 1),
                padding       0.35s ease,
                background    0.40s ease,
                border-color  0.40s ease,
                box-shadow    0.40s ease;
            will-change: top, width, border-radius;
        }

        .navbar .logo {
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }

        .navbar .logo img {
            height: 40px;
            width: auto;
            transition: all 0.3s ease;
        }

        .navbar .logo:hover img {
            transform: scale(1.05);
            filter: brightness(1.2);
        }

        .navbar .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .navbar .nav-links a {
            font-family: 'Didot', serif;
            font-style: italic;
            font-weight: 700;
            font-size: 0.95rem;
            color: #f1faee;
            text-decoration: none;
            transition: all 0.3s;
            position: relative;
        }

        .navbar .nav-links a:hover {
            color: #a8dadc;
        }

        .navbar .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(45deg, #a8dadc, #2a9d8f);
            transition: width 0.3s;
        }

        .navbar .nav-links a:hover::after {
            width: 100%;
        }

        /* Pill state — liquid glass appears + shrinks + rounds on scroll */
        .navbar.pill {
            top: calc(14px + var(--pill-parallax, 0px));
            width: min(1300px, 95%);
            border-radius: 999px;
            padding: 0.65rem 1.7rem;
            background: rgba(15, 20, 25, 0.68);
            backdrop-filter: url(#navbar-lg) blur(2px);
            -webkit-backdrop-filter: blur(14px) saturate(170%);
            border-color: rgba(168, 218, 220, 0.28);
            box-shadow:
                0 10px 36px rgba(0, 0, 0, 0.52),
                0 2px 8px rgba(0, 0, 0, 0.28);
        }

        /* Specular rim — fades in with the pill */
        .navbar::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            box-shadow:
                inset 1.5px 2px 4px rgba(255, 255, 255, 0.48),
                inset -1px -1.5px 3px rgba(255, 255, 255, 0.13);
            background: linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.13) 0%,
                rgba(255, 255, 255, 0.04) 22%,
                transparent 48%
            );
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.40s ease;
        }
        .navbar.pill::before { opacity: 1; }

        /* Keep nav content above the ::before shimmer layer */
        .navbar > * { position: relative; z-index: 1; }

        @media (max-width: 768px) {
            .navbar.pill {
                width: 94%;
                padding: 0.55rem 1.2rem;
            }
        }

        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            background: rgba(168, 218, 220, 0.1);
        }

        .hamburger:hover {
            background: rgba(168, 218, 220, 0.2);
        }

        .hamburger span {
            width: 25px;
            height: 3px;
            background: #a8dadc;
            margin: 3px 0;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(-45deg) translate(-5px, 6px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(45deg) translate(-5px, -6px);
        }

        .mobile-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 80%;
            max-width: 300px;
            height: 100vh;
            background: rgba(15, 20, 25, 0.98);
            backdrop-filter: blur(20px);
            transition: right 0.3s ease;
            padding: 5rem 2rem 2rem;
            z-index: 999;
            border-left: 1px solid rgba(168, 218, 220, 0.2);
        }

        .mobile-menu.active {
            right: 0;
        }

        .mobile-menu ul {
            list-style: none;
            padding: 0;
        }

        .mobile-menu ul li {
            margin: 2rem 0;
        }

        .mobile-menu ul li a {
            font-family: 'Didot', serif;
            font-style: italic;
            font-weight: 700;
            color: #f1faee;
            text-decoration: none;
            font-size: 1.2rem;
            display: block;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(168, 218, 220, 0.1);
            transition: all 0.3s ease;
        }

        .mobile-menu ul li a:hover {
            color: #a8dadc;
            padding-left: 1rem;
            background: rgba(168, 218, 220, 0.05);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 998;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .hero-section {
            height: 100vh;
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .hero-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .section {
            padding: 5rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .section h2 {
            font-family: 'Didot', serif;
            font-style: italic;
            font-size: 3rem;
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(45deg, #a8dadc, #457b9d, #2a9d8f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

       /* Unify behavior: viewport-sized, no internal scroll */
        .bento-section {
          height: 140svh;      /* keep tall on desktop */
          width: 100svw;       /* <-- missing ; was here */
          overflow: hidden;    /* "show" is not valid */
        }

        .bento-iframe {
          height: 100%;
          width: 100%;
          border: 0;
          display: block;
        }



        .models-section {
            height: 100vh;
            position: relative;
            overflow: hidden;
            margin: 0;
            border: none;
            width: 100%;
            box-sizing: border-box;
        }

        .models-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .about-content {
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .about-content p {
            font-size: 1.2rem;
            line-height: 1.6;
            opacity: 0.9;
            margin-bottom: 2rem;
            color: #f1faee;
        }

        .skills {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .skill-tag {
            padding: 0.8rem 1.5rem;
            background: rgba(42, 157, 143, 0.2);
            border-radius: 25px;
            font-size: 0.9rem;
            border: 1px solid rgba(42, 157, 143, 0.3);
            color: #a8dadc;
            font-weight: 500;
            transition: all 0.3s;
        }

        .skill-tag:hover {
            background: rgba(42, 157, 143, 0.3);
            transform: translateY(-2px);
        }

        .contact {
            background: rgba(168, 218, 220, 0.02);
            text-align: center;
        }

        .contact-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .contact-link {
            padding: 1rem 2rem;
            background: rgba(168, 218, 220, 0.1);
            border-radius: 15px;
            color: #f1faee;
            text-decoration: none;
            transition: all 0.3s;
            font-weight: 500;
            border: 1px solid rgba(168, 218, 220, 0.2);
        }

        .contact-link:hover {
            background: rgba(42, 157, 143, 0.2);
            transform: translateY(-3px);
            color: #a8dadc;
            border-color: rgba(42, 157, 143, 0.4);
        }

        @media (max-width: 768px) {
            body {
                overflow-x: hidden;
            }

            .navbar {
                padding: 1rem;
            }

            .navbar .nav-links {
                display: none;
            }

            .hamburger {
                display: flex;
            }

            .hero-section {
                height: 110vh; /* Increased for mobile */
                width: 100vw;
                position: relative;
                left: 50%;
                right: 50%;
                margin-left: -50vw;
                margin-right: -50vw;
            }

            .section {
                padding: 3rem 1rem;
                width: 100%;
                max-width: 100%;
            }

            .section h2 {
                font-size: 2rem;
            }

            .bento-section {
                height: 250vh; /* Auto height on mobile */
                margin: 0;
                width: 100%;
            }


            .models-section {
                height: 100vh; /* Keep full height for mobile */
                margin: 0;
                width: 100%;
            }

            .contact-links {
                flex-direction: column;
                align-items: center;
                gap: 1rem;
            }

            .contact-link {
                width: 100%;
                max-width: 250px;
                text-align: center;
            }

            .skills {
                gap: 0.5rem;
            }

            .skill-tag {
                padding: 0.6rem 1rem;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 0.8rem;
            }

            .section {
                padding: 2rem 0.8rem;
            }

            .hero-section {
                height: 120vh; /* Even more height for very small screens */
            }

            .bento-section {
                height: auto; /* Auto height for small mobile */
                margin: 0;
                width: 100%;
            }

            .models-section {
                height: 100vh; /* Keep full height for small mobile */
                margin: 0;
                width: 100%;
            }
        }

        @media screen and (max-width: 600px) {
          #resume-popup {
            width: 95% !important;
            height: 85vh !important;
            padding: 0.8rem !important;
            border-radius: 10px !important;
          }

          #resume-popup embed {
            height: 75vh !important;
          }

          #resume-popup button {
            padding: 0.3rem 0.7rem !important;
            font-size: 0.9rem !important;
          }

          #resume-popup p {
            font-size: 1rem !important;
          }

          #resume-popup .contact-link {
            display: block;
            margin: 0.5rem 0;
          }
        }
    /* === 3D scene loading overlay === */
    @keyframes overlayGradient {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes gifFloat {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-8px); }
    }
    #scene-overlay {
      position: fixed;
      inset: 0;
      z-index: 5000;
      background: linear-gradient(135deg, #0f1419 0%, #1a2332 25%, #2d3748 50%, #1e3a5f 75%, #0f1419 100%);
      background-size: 400% 400%;
      animation: overlayGradient 20s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #scene-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .scene-overlay-card {
      text-align: center;
      background: rgba(15, 20, 25, 0.15);
      backdrop-filter: blur(35px);
      border-radius: 32px;
      padding: 3rem 2.5rem;
      border: 1px solid rgba(168, 218, 220, 0.2);
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 380px;
      width: 90%;
    }
    .scene-overlay-gif {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid rgba(168, 218, 220, 0.4);
      box-shadow: 0 0 30px rgba(42, 157, 143, 0.3);
      animation: gifFloat 4s ease-in-out infinite;
      object-fit: cover;
      background: rgba(168, 218, 220, 0.1);
    }
    .scene-overlay-title {
      font-family: 'Didot', serif;
      font-style: italic;
      font-size: 1.6rem;
      font-weight: 400;
      background: linear-gradient(45deg, #f1faee, #a8dadc, #66fcf1);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: overlayGradient 6s ease infinite;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
    }
    .scene-overlay-msg {
      font-family: 'Montserrat', sans-serif;
      color: #a8dadc;
      font-size: 1rem;
      opacity: 0.9;
      font-style: italic;
    }

    .testimonials-section {
      display: none;
    }

    .testimonial-iframe {
      width: 100%;
      height: auto;          /* we’ll set height via JS */
      border: none;
      display: block;
    }


    /* --- Hen Footer (Zelda Scene) --- */
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    footer.hen-footer{
      width:100%;
      display:grid;
      place-items:center;
      gap:1rem;
      padding:1.25rem 1rem 1.75rem;
      border-top:1px solid rgba(168,218,220,0.18);
      background:linear-gradient(180deg, rgba(168,218,220,0.06), rgba(15,20,25,0));
    }

    .dangerous-scene{
      position:relative;
      width:min(980px,96%);
      min-height:220px;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      gap:clamp(12px,4vw,40px);
      padding:clamp(10px,3vw,20px);
      isolation:isolate;
    }

    .hen-sprite,
    .sword-btn img,
    .bubble-img{ image-rendering:pixelated; image-rendering:crisp-edges; }

    .hen-sprite{
      width:clamp(72px,16vw,130px);
      height:auto;
      filter:drop-shadow(0 2px 0 rgba(0,0,0,0.2));
      flex:0 0 auto;
    }

    .bubble{
      position:absolute;
      inset:clamp(-8px,-2.5vw,-18px) 0 auto 0; /* top only */
      display:grid;
      place-items:center;
      pointer-events:none; /* clicks pass through */
    }
    .bubble-inner{ position:relative; width:min(780px,92%); }
    .bubble-img{ width:100%; height:auto; display:block; opacity:.95; }

    .bubble-text{
      position:absolute; inset:0; display:grid; place-items:center;
      padding:clamp(8px,2.2vw,18px);
      text-align:center;
      font-family:'Press Start 2P', monospace;
      font-size:clamp(10px,2.4vw,16px);
      line-height:1.35;
      color:#102027;
      text-shadow:0 1px 0 rgba(255,255,255,0.5);
    }

    .sword-wrap{ display:flex; flex-direction:column; align-items:center; }
    .sword-btn{
      background:transparent; border:0; padding:0; margin:0; cursor:pointer; outline:none;
      flex:0 0 auto; translate:0 6px;
    }
    .sword-btn img{
      width:clamp(72px,12vw,120px);
      height:auto; display:block;
      filter:drop-shadow(0 4px 12px rgba(69,123,157,0.45));
      transition:transform 160ms ease, filter 160ms ease;
    }
    .sword-btn:hover img, .sword-btn:focus-visible img{
      transform:translateY(-4px) scale(1.05);
      filter:drop-shadow(0 6px 16px rgba(42,157,143,0.55));
    }
    .sword-caption{ text-align:center; font-size:.9rem; opacity:.75; margin-top:.25rem; }

    .credit{
      text-align:center; opacity:.8; font-size:.95rem; margin:.25rem 0 0; color:#f1faee;
    }

    @media (max-width:640px){
      .dangerous-scene{ min-height:190px; }
      .bubble-text{ font-size:clamp(10px,3.2vw,14px); }
    }



/* Mobile: make About (bento) comfortably tall and concrete */
@media (max-width: 768px){
  .bento-section{
    height: auto;             /* allow it to grow */
    min-height: 200vh;        /* give it real height so the iframe isn't tiny */
    width: 100vw;             /* full width on mobile */
    overflow: visible;
  }
  .bento-iframe{
    height: 170vh;            /* percentage won't work when parent is auto; use vh */
  }
}

/* Very small phones: a bit more room */
@media (max-width: 480px){
  .bento-section{ min-height: 200vh; }
  .bento-iframe{  height: 200vh; }
}

/* === Work Intro Overlay === */
.work-intro-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(ellipse at 50% 45%, rgba(8,12,18,0.58) 0%, transparent 66%);
  transition: opacity 0.12s;
}
.work-intro-inner {
  text-align: center;
  padding: 0 2rem;
}
.work-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(3.5rem, 7vw, 6.5rem);
  font-weight: 500;
  color: #f1faee;
  letter-spacing: 0.03em;
  line-height: 1.05;
  margin-bottom: 0.6rem;
  white-space: nowrap;
  font-style: normal;
}
.work-sub {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(0.88rem, 1.2vw, 1.05rem);
  color: rgba(168, 218, 220, 0.65);
  letter-spacing: 0.02em;
}
/* CA pulses during scramble */
@keyframes workCaScramble {
  0%   { text-shadow: 3px 0 rgba(255,30,60,0.55), -3px 0 rgba(102,252,241,0.55); }
  18%  { text-shadow: 5px 0 rgba(255,30,60,0.8), -5px 0 rgba(102,252,241,0.8); clip-path: inset(0 0 88% 0); }
  19%  { clip-path: inset(0 0 0 0); }
  40%  { text-shadow: 1px 0 rgba(255,30,60,0.3), -1px 0 rgba(102,252,241,0.3); }
  57%  { text-shadow: 6px 0 rgba(255,30,60,0.85), -6px 0 rgba(102,252,241,0.85); clip-path: inset(72% 0 0 0); }
  58%  { clip-path: inset(0 0 0 0); }
  80%  { text-shadow: 2px 0 rgba(255,30,60,0.4), -2px 0 rgba(102,252,241,0.4); }
  100% { text-shadow: 3px 0 rgba(255,30,60,0.55), -3px 0 rgba(102,252,241,0.55); }
}
/* Gentle residual CA after text settles */
@keyframes workCaSettle {
  0%, 100% { text-shadow: 1.5px 0 rgba(255,30,60,0.22), -1.5px 0 rgba(102,252,241,0.22); }
  50%       { text-shadow: 2.5px 0 rgba(255,30,60,0.32), -2.5px 0 rgba(102,252,241,0.32); }
}
/* Glitch-out escalates then collapses */
@keyframes workGlitchOut {
  0%   { opacity: 1; transform: none; clip-path: inset(0 0 0 0); text-shadow: 2px 0 rgba(255,30,60,0.3), -2px 0 rgba(102,252,241,0.3); }

    <!--
        Liquid glass SVG displacement filter.
        backdrop-filter: url(#navbar-lg) geometrically warps background pixels
        through feDisplacementMap — that's the actual refraction/lensing, not
        just a blur. The feTurbulence provides the organic noise surface. Chrome
        supports backdrop-filter + SVG; Safari falls back to the blur value.
    -->
    <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" focusable="false">
      <defs>
        <filter id="navbar-lg" x="-4%" y="-50%" width="108%" height="200%"
                color-interpolation-filters="sRGB">
          <!-- Organic noise as the lens-surface displacement source -->
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.011 0.007"
            numOctaves="2"
            seed="12"
            result="noise" />
          <!-- Smooth the noise — large gentle waves, not grainy static -->
          <feGaussianBlur in="noise" stdDeviation="6" result="lensMap" />
          <!-- This is the refraction: each pixel is re-mapped based on the
               lens surface normal encoded in R/G channels of lensMap.
               scale controls the strength of the distortion. -->
          <feDisplacementMap
            in="SourceGraphic"
            in2="lensMap"
            scale="18"
            xChannelSelector="R"
            yChannelSelector="G" />
        </filter>
      </defs>
    </svg>

    <script>
        // Detect if device supports hover (desktop)
        const isDesktop = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

        // Custom Cursor Logic - Only for desktop
        if (isDesktop) {
            const cursor = document.getElementById('cursor');
            let mouseX = 0;
            let mouseY = 0;
            let animationId;

            // Smooth cursor movement with requestAnimationFrame
            function updateCursor() {
                cursor.style.left = mouseX + 'px';
                cursor.style.top = mouseY + 'px';
            }

            // Track mouse movement with throttling
            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                cursor.style.opacity = '1';

                if (!animationId) {
                    animationId = requestAnimationFrame(() => {
                        updateCursor();
                        animationId = null;
                    });
                }
            });

            // Click animation
            document.addEventListener('mousedown', () => {
                cursor.classList.add('clicking');
            });

            document.addEventListener('mouseup', () => {
                cursor.classList.remove('clicking');
            });

            // Hover states for interactive elements
            const hoverElements = document.querySelectorAll('a, button, .hamburger, .logo, .contact-link, .skill-tag');

            hoverElements.forEach(element => {
                element.addEventListener('mouseenter', () => {
                    cursor.classList.add('hovering');
                });

                element.addEventListener('mouseleave', () => {
                    cursor.classList.remove('hovering');
                });
            });

            // Relay cursor position/state from iframes via postMessage
            window.addEventListener('message', (event) => {
                const d = event.data;
                const frame = event.source && event.source.frameElement;
                if (!frame) return;
                if (d.type === 'iframeMouse') {
                    const rect = frame.getBoundingClientRect();
                    mouseX = rect.left + d.x;
                    mouseY = rect.top + d.y;
                    cursor.style.left = mouseX + 'px';
                    cursor.style.top  = mouseY + 'px';
                    cursor.style.opacity = '1';
                }
                if (d.type === 'iframeDown')  cursor.classList.add('clicking');
                if (d.type === 'iframeUp')    cursor.classList.remove('clicking');
                if (d.type === 'iframeLeave') cursor.style.opacity = '0';
                if (d.type === 'iframeHover' && d.on)  cursor.classList.add('hovering');
                if (d.type === 'iframeHover' && !d.on) cursor.classList.remove('hovering');
            });

            // Hide cursor when leaving window
            document.addEventListener('mouseleave', () => {
                cursor.style.opacity = '0';
            });

            document.addEventListener('mouseenter', () => {
                cursor.style.opacity = '1';
            });
        }

        function scrollToTop() {
            window.muteSnap?.(2000);
            if (window.lenis) window.lenis.scrollTo(0, { duration: 1 });
            else window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleMobileMenu() {
            const hamburger = document.querySelector('.hamburger');
            const mobileMenu = document.querySelector('.mobile-menu');
            const overlay = document.querySelector('.overlay');

            hamburger.classList.toggle('active');
            mobileMenu.classList.toggle('active');
            overlay.classList.toggle('active');

            // Prevent body scroll when menu is open
            if (mobileMenu.classList.contains('active')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = 'auto';
            }
        }

        function closeMobileMenu() {
            const hamburger = document.querySelector('.hamburger');
            const mobileMenu = document.querySelector('.mobile-menu');
            const overlay = document.querySelector('.overlay');

            hamburger.classList.remove('active');
            mobileMenu.classList.remove('active');
            overlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Simple smooth scrolling
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });

        // Close mobile menu when clicking outside
        document.addEventListener('click', function(e) {
            const mobileMenu = document.querySelector('.mobile-menu');
            const hamburger = document.querySelector('.hamburger');

            if (mobileMenu.classList.contains('active') &&
                !mobileMenu.contains(e.target) &&
                !hamburger.contains(e.target)) {
                closeMobileMenu();
            }
        });
        function openResumePopup() {
            document.getElementById('resume-popup').style.display = 'block';
        }

        function closeResumePopup() {
            document.getElementById('resume-popup').style.display = 'none';
        }

    </script>

   <script>
/* Snap fully onto .models-section when it's *meaningfully* partial,
   with hysteresis so it triggers a little later (needs more overlap).
   Still allows clean exit via top/bottom escape zones. */
(function () {
  const section = document.querySelector('.models-section');
  const navbar  = document.querySelector('.navbar');
  if (!section) return;

  /* Tunables */
  const DURATION_MS        = 1200;   // eased scroll duration
  const SNAP_COOLDOWN_MS   = 900;    // min time between snaps
  const EDGE_ESCAPE_PX     = 96;     // no snap when trying to leave inside this band
  const MIN_OVERLAP_PX     = 140;    // NEW: require at least this many px visible to snap
  const DOWN_OVERLAP_RATIO = 0.18;   // NEW: if scrolling DOWN, need ≥ 18% of viewport visible
  const UP_OVERLAP_RATIO   = 0.22;   // NEW: if scrolling UP, need ≥ 22% of viewport visible
  // (bump these up or down to taste)

  let lastSnapAt = 0;
  let animId = 0;
  let snapMutedUntil = 0;

  // Expose globally so navbar / footer / scrollToTop can silence the snap
  window.muteSnap = (ms = 2000) => { snapMutedUntil = Date.now() + ms; };

  // track scroll direction (+1 down, -1 up) — still used for edge-escape zone
  let lastY = window.scrollY;
  let lastDir = 0;

  const clamp = (n,a,b)=>Math.min(b,Math.max(a,n));
  const easeInOutQuad = t => (t<.5) ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;

  function cancelAnim(){ if (animId) { cancelAnimationFrame(animId); animId = 0; } }
  function animatedScrollTo(targetTop, duration=DURATION_MS){
    cancelAnim();
    // Use Lenis when available so the snap plays through the butter-scroll pipeline
    if (window.lenis) {
      window.lenis.scrollTo(Math.round(targetTop), {
        duration: duration / 1000,
        easing: easeInOutQuad,
      });
      return;
    }
    // Fallback: plain RAF animation
    const start = window.scrollY;
    const dist  = targetTop - start;
    const t0    = performance.now();
    function step(t){
      const p = clamp((t - t0)/duration, 0, 1);
      const eased = easeInOutQuad(p);
      window.scrollTo(0, start + dist*eased);
      if (p < 1) animId = requestAnimationFrame(step);
    }
    animId = requestAnimationFrame(step);
  }

  const navH = () => (navbar?.offsetHeight || 0);
  const topTarget    = () => section.offsetTop - navH();
  const bottomTarget = () => section.offsetTop + section.offsetHeight - innerHeight;

  const alignedTop    = (y) => Math.abs(y - topTarget())    < 2;
  const alignedBottom = (y) => Math.abs(y - bottomTarget()) < 2;

  function inEdgeEscape(y, dir){
    if (dir < 0) { // going UP
      if (y <= topTarget() + EDGE_ESCAPE_PX) return true;
    } else if (dir > 0) { // going DOWN
      if (y >= bottomTarget() - EDGE_ESCAPE_PX) return true;
    }
    return false;
  }

  function shouldThrottle(){ return (Date.now() - lastSnapAt) < SNAP_COOLDOWN_MS; }

  function trySnapWithHysteresis(){
    if (Date.now() < snapMutedUntil) return; // muted by nav/footer/scrollToTop
    if (shouldThrottle()) return;

    const y  = window.scrollY;
    const r  = section.getBoundingClientRect();
    const vh = innerHeight;

    // visible pixels overlapping viewport
    const overlap = Math.max(0, Math.min(r.bottom, vh) - Math.max(r.top, 0));
    if (overlap <= 0) return;                          // not visible → ignore
    if (alignedTop(y) || alignedBottom(y)) return;    // already aligned
    if (inEdgeEscape(y, lastDir)) return;              // let user leave at edges

    // Use r.top to know which side we're entering from (not lastDir, which can
    // be stale during smooth-scroll animations)
    const fromBelow = r.top < 0; // section top is above viewport → we came from below
    const need = (fromBelow ? UP_OVERLAP_RATIO : DOWN_OVERLAP_RATIO);
    if (overlap < MIN_OVERLAP_PX || overlap / vh < need) return;

    // Passed thresholds ⇒ snap to the correct edge
    lastSnapAt = Date.now();
    animatedScrollTo(fromBelow ? bottomTarget() : topTarget());
  }

  // Track direction robustly
  window.addEventListener('scroll', () => {
    const y = window.scrollY;
    const dy = y - lastY;
    if (Math.abs(dy) > 0) lastDir = (dy > 0 ? 1 : -1);
    lastY = y;

    // Use scroll as the canonical trigger (works even if an iframe ate wheel/touch)
    trySnapWithHysteresis();
  }, { passive: true });

  // Also react to resize (viewport height changes alter ratios)
  window.addEventListener('resize', () => {
    requestAnimationFrame(trySnapWithHysteresis);
  }, { passive: true });
})();
</script>

<script>
// Intercept all navbar / mobile-menu hash links so they mute the snap helper
// and use Lenis for smooth navigation instead of the browser's default jump.
(function () {
  const navH = () => document.querySelector('.navbar')?.offsetHeight || 0;

  function navScrollTo(targetEl) {
    window.muteSnap?.(2200);
    if (window.lenis) {
      window.lenis.scrollTo(targetEl, { duration: 1.1, offset: -navH() });
    } else {
      window.scrollTo({ top: targetEl.offsetTop - navH(), behavior: 'smooth' });
    }
  }

  document.querySelectorAll(
    '.nav-links a[href^="#"], .mobile-menu a[href^="#"]'
  ).forEach(a => {
    a.addEventListener('click', e => {
      const id = a.getAttribute('href');
      if (!id || id === '#') return; // resume / # links — let onclick handle them
      const target = document.querySelector(id);
      if (!target) return;
      e.preventDefault();
      navScrollTo(target);
      // mobile menu closes via its existing inline onclick — no need to repeat
    });
  });
})();
</script>

    <script>
    /* === Work intro: scramble + glitch-in/out === */
    (function () {
      const CHARSET   = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#@$!?%&*/<>';
      const TITLE_PLAIN = 'My Work';
      const TITLE_HTML  = 'My <span class="px">Wo</span>rk';
      const SUB_PLAIN   = 'interactive experiences & creative digital projects';

      const overlay = document.getElementById('work-intro');
      const inner   = overlay.querySelector('.work-intro-inner');
      const titleEl = document.getElementById('workTitleEl');
      const subEl   = document.getElementById('workSubEl');
      let triggered = false;

      function randChar() { return CHARSET[Math.floor(Math.random() * CHARSET.length)]; }

      function scramble(el, finalText, duration, onDone) {
        const len      = finalText.length;
        const revealed = new Array(len).fill(false);
        const t0       = performance.now();
        function frame(now) {
          const progress  = Math.min(1, (now - t0) / duration);
          const revealUpto = Math.floor(progress * len * 1.15);
          for (let i = 0; i < revealUpto; i++) {
            if (!revealed[i] && Math.random() < 0.4) revealed[i] = true;
          }
          let out = '';
          for (let i = 0; i < len; i++) {
            const ch = finalText[i];
            if (ch === ' ') { out += '\u00a0'; continue; }
            out += revealed[i] ? ch : randChar();
          }
          el.textContent = out;
          if (progress < 1 || revealed.some(r => !r)) {
            requestAnimationFrame(frame);
          } else {
            onDone();
          }
        }
        requestAnimationFrame(frame);
      }

      function triggerIntro() {
        if (triggered) return;
        triggered = true;
        overlay.style.opacity = '1';

        // Scramble title with CA animation
        titleEl.classList.add('scrambling');
        scramble(titleEl, TITLE_PLAIN, 950, () => {
          titleEl.innerHTML = TITLE_HTML;
          titleEl.classList.remove('scrambling');
          titleEl.classList.add('settled');
        });

        // Scramble subline 300ms later
        setTimeout(() => {
          scramble(subEl, SUB_PLAIN, 1100, () => {
            subEl.textContent = SUB_PLAIN;
          });
        }, 300);

        // Glitch out after ~4.2s
        setTimeout(() => {
          titleEl.classList.remove('settled');
          inner.classList.add('glitch-out');
          setTimeout(() => { overlay.style.display = 'none'; }, 700);
        }, 4200);
      }

      const obs = new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting && e.intersectionRatio >= 0.3) triggerIntro(); });
      }, { threshold: 0.3 });

      const modelsSection = document.querySelector('.models-section');
      if (modelsSection) obs.observe(modelsSection);
    })();
    </script>

    <script>
    /* ============================================================
       Lenis — butter smooth scroll
       ============================================================ */
    window.lenis = new Lenis({
      duration: 1.2,
      easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      smoothWheel: true,
      smoothTouch: false,
      wheelMultiplier: 0.85,
      touchMultiplier: 1.5,
    });

    (function tick(time) {
      window.lenis.raf(time);
      requestAnimationFrame(tick);
    })(0);

    /* ============================================================
       Navbar — liquid glass pill + parallax float
       ============================================================ */
    (function () {
      const navbar = document.querySelector('.navbar');
      if (!navbar) return;

      const THRESHOLD         = 80;   // px scrolled before pill kicks in
      const PARALLAX_STRENGTH = 0.5;  // velocity → px shift
      const PARALLAX_MAX      = 9;    // clamp (px)

      let lastY    = window.scrollY;
      let parallax = 0;
      let isPill   = false;

      /* Decay loop — springs parallax back to 0 every frame */
      (function decay() {
        requestAnimationFrame(decay);
        if (Math.abs(parallax) > 0.04) {
          parallax *= 0.80;
          navbar.style.setProperty('--pill-parallax', parallax.toFixed(2) + 'px');
        }
      })();

      function onScroll() {
        const y   = window.scrollY;
        const vel = y - lastY;
        lastY = y;

        const wantsPill = y > THRESHOLD;
        if (wantsPill !== isPill) {
          isPill = wantsPill;
          navbar.classList.toggle('pill', isPill);
        }

        if (isPill) {
          parallax = -Math.max(-PARALLAX_MAX, Math.min(PARALLAX_MAX, vel * PARALLAX_STRENGTH));
        }
      }

      window.lenis.on('scroll', onScroll);
      onScroll();
    })();
    </script>

        const msgTimer = setInterval(() => {
          msgIdx = (msgIdx + 1) % messages.length;
          msgEl.textContent = messages[msgIdx];
        }, 1800);

        function dismiss() {
          if (dismissed) return;
          dismissed = true;
          clearInterval(msgTimer);
          msgEl.textContent = 'Ready! 🎉';
          // Brief "ready" flash before fading
          setTimeout(() => overlay.classList.add('hidden'), 300);
        }

        window.addEventListener('message', function (e) {
          if (e.data && e.data.type === 'heroReady')   heroReady   = true;
          if (e.data && e.data.type === 'modelsReady') modelsReady = true;
          if (heroReady && modelsReady) dismiss();
        });

        // Hard timeout: if signals never arrive, show the page anyway
        // Shorter when coming from loading.html (models already cached)
        const fromLoader = new URLSearchParams(location.search).get('loaded') === 'true';
        setTimeout(dismiss, fromLoader ? 5000 : 12000);
      })();
    </script>

</body>
</html>
