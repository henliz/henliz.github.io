<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <title>Henrietta's Portfolio</title>
    <link rel="icon" type="image/png" href="HenLogo.png">
    <link rel="shortcut icon" type="image/png" href="HenLogo.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@300;400;500;600;700;800&family=Montserrat:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #0f1419;
            color: white;
            overflow-x: hidden;
        }

        /* Only hide cursor on desktop */
        @media (hover: hover) and (pointer: fine) {
            body {
                cursor: none !important;
            }

            *, *::before, *::after {
                cursor: none !important;
            }
        }

        /* Custom Glassmorphism Cursor - Only show on desktop */
        .custom-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            background: rgba(168, 218, 220, 0.1);
            border: 1px solid rgba(168, 218, 220, 0.3);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            backdrop-filter: blur(10px);
            transition: all 0.08s ease-out;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(168, 218, 220, 0.2);
            display: none; /* Hidden by default */
        }

        /* Only show custom cursor on desktop */
        @media (hover: hover) and (pointer: fine) {
            .custom-cursor {
                display: block;
            }
        }

        .custom-cursor.clicking {
            background: rgba(168, 218, 220, 0.8);
            border-color: rgba(168, 218, 220, 0.9);
            transform: translate(-50%, -50%) scale(0.8);
            box-shadow: 0 0 30px rgba(168, 218, 220, 0.6);
        }

        .custom-cursor.hovering {
            width: 30px;
            height: 30px;
            background: rgba(168, 218, 220, 0.15);
            border-color: rgba(168, 218, 220, 0.5);
            box-shadow: 0 0 25px rgba(168, 218, 220, 0.4);
        }

        #app {
            width: 100%;
            min-height: 100vh;
        }

        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(15, 20, 25, 0.95);
            backdrop-filter: blur(15px);
            z-index: 1000;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(168, 218, 220, 0.1);
        }

        .navbar .logo {
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }

        .navbar .logo img {
            height: 40px;
            width: auto;
            transition: all 0.3s ease;
        }

        .navbar .logo:hover img {
            transform: scale(1.05);
            filter: brightness(1.2);
        }

        .navbar .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .navbar .nav-links a {
            color: #f1faee;
            text-decoration: none;
            transition: all 0.3s;
            font-weight: 500;
            position: relative;
        }

        .navbar .nav-links a:hover {
            color: #a8dadc;
        }

        .navbar .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(45deg, #a8dadc, #2a9d8f);
            transition: width 0.3s;
        }

        .navbar .nav-links a:hover::after {
            width: 100%;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            background: rgba(168, 218, 220, 0.1);
        }

        .hamburger:hover {
            background: rgba(168, 218, 220, 0.2);
        }

        .hamburger span {
            width: 25px;
            height: 3px;
            background: #a8dadc;
            margin: 3px 0;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(-45deg) translate(-5px, 6px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(45deg) translate(-5px, -6px);
        }

        .mobile-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 80%;
            max-width: 300px;
            height: 100vh;
            background: rgba(15, 20, 25, 0.98);
            backdrop-filter: blur(20px);
            transition: right 0.3s ease;
            padding: 5rem 2rem 2rem;
            z-index: 999;
            border-left: 1px solid rgba(168, 218, 220, 0.2);
        }

        .mobile-menu.active {
            right: 0;
        }

        .mobile-menu ul {
            list-style: none;
            padding: 0;
        }

        .mobile-menu ul li {
            margin: 2rem 0;
        }

        .mobile-menu ul li a {
            color: #f1faee;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 500;
            display: block;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(168, 218, 220, 0.1);
            transition: all 0.3s ease;
        }

        .mobile-menu ul li a:hover {
            color: #a8dadc;
            padding-left: 1rem;
            background: rgba(168, 218, 220, 0.05);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 998;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .hero-section {
            height: 100vh;
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .hero-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .section {
            padding: 5rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .section h2 {
            font-family: 'Montserrat Alternates', sans-serif;
            font-size: 3rem;
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(45deg, #a8dadc, #457b9d, #2a9d8f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        /* Unify behavior: viewport-sized, no internal scroll */
        .bento-section {
          height: 140svh;   /* or 100dvh for iOS chrome handling */
          width: 100svw
          overflow: show;   /* or hidden */
        }

        .bento-iframe {
          height: 100%;
          width: 100%;
        }


        .models-section {
            height: 100vh;
            position: relative;
            overflow: hidden;
            margin: 0;
            border: none;
            width: 100%;
            box-sizing: border-box;
        }

        .models-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .about-content {
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .about-content p {
            font-size: 1.2rem;
            line-height: 1.6;
            opacity: 0.9;
            margin-bottom: 2rem;
            color: #f1faee;
        }

        .skills {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .skill-tag {
            padding: 0.8rem 1.5rem;
            background: rgba(42, 157, 143, 0.2);
            border-radius: 25px;
            font-size: 0.9rem;
            border: 1px solid rgba(42, 157, 143, 0.3);
            color: #a8dadc;
            font-weight: 500;
            transition: all 0.3s;
        }

        .skill-tag:hover {
            background: rgba(42, 157, 143, 0.3);
            transform: translateY(-2px);
        }

        .contact {
            background: rgba(168, 218, 220, 0.02);
            text-align: center;
        }

        .contact-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .contact-link {
            padding: 1rem 2rem;
            background: rgba(168, 218, 220, 0.1);
            border-radius: 15px;
            color: #f1faee;
            text-decoration: none;
            transition: all 0.3s;
            font-weight: 500;
            border: 1px solid rgba(168, 218, 220, 0.2);
        }

        .contact-link:hover {
            background: rgba(42, 157, 143, 0.2);
            transform: translateY(-3px);
            color: #a8dadc;
            border-color: rgba(42, 157, 143, 0.4);
        }

        @media (max-width: 768px) {
            body {
                overflow-x: hidden;
            }

            .navbar {
                padding: 1rem;
            }

            .navbar .nav-links {
                display: none;
            }

            .hamburger {
                display: flex;
            }

            .hero-section {
                height: 110vh; /* Increased for mobile */
                width: 100vw;
                position: relative;
                left: 50%;
                right: 50%;
                margin-left: -50vw;
                margin-right: -50vw;
            }

            .section {
                padding: 3rem 1rem;
                width: 100%;
                max-width: 100%;
            }

            .section h2 {
                font-size: 2rem;
            }

            .bento-section {
                height: 250vh; /* Auto height on mobile */
                margin: 0;
                width: 100%;
            }


            .models-section {
                height: 100vh; /* Keep full height for mobile */
                margin: 0;
                width: 100%;
            }

            .contact-links {
                flex-direction: column;
                align-items: center;
                gap: 1rem;
            }

            .contact-link {
                width: 100%;
                max-width: 250px;
                text-align: center;
            }

            .skills {
                gap: 0.5rem;
            }

            .skill-tag {
                padding: 0.6rem 1rem;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 0.8rem;
            }

            .section {
                padding: 2rem 0.8rem;
            }

            .hero-section {
                height: 120vh; /* Even more height for very small screens */
            }

            .bento-section {
                height: auto; /* Auto height for small mobile */
                margin: 0;
                width: 100%;
            }

            .models-section {
                height: 100vh; /* Keep full height for small mobile */
                margin: 0;
                width: 100%;
            }
        }

        @media screen and (max-width: 600px) {
          #resume-popup {
            width: 95% !important;
            height: 85vh !important;
            padding: 0.8rem !important;
            border-radius: 10px !important;
          }

          #resume-popup embed {
            height: 75vh !important;
          }

          #resume-popup button {
            padding: 0.3rem 0.7rem !important;
            font-size: 0.9rem !important;
          }

          #resume-popup p {
            font-size: 1rem !important;
          }

          #resume-popup .contact-link {
            display: block;
            margin: 0.5rem 0;
          }
        }
    .testimonials-section {
      height: auto;          /* grow with content */
      min-height: 60svh;     /* optional: show a nice first fold */
      margin-top: 4rem;
      width: 100%;
      overflow: visible;     /* no clipping */
      position: relative;
    }

    .testimonial-iframe {
      width: 100%;
      height: auto;          /* we’ll set height via JS */
      border: none;
      display: block;
    }


    /* --- Hen Footer (Zelda Scene) --- */
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    footer.hen-footer{
      width:100%;
      display:grid;
      place-items:center;
      gap:1rem;
      padding:1.25rem 1rem 1.75rem;
      border-top:1px solid rgba(168,218,220,0.18);
      background:linear-gradient(180deg, rgba(168,218,220,0.06), rgba(15,20,25,0));
    }

    .dangerous-scene{
      position:relative;
      width:min(980px,96%);
      min-height:220px;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      gap:clamp(12px,4vw,40px);
      padding:clamp(10px,3vw,20px);
      isolation:isolate;
    }

    .hen-sprite,
    .sword-btn img,
    .bubble-img{ image-rendering:pixelated; image-rendering:crisp-edges; }

    .hen-sprite{
      width:clamp(72px,16vw,130px);
      height:auto;
      filter:drop-shadow(0 2px 0 rgba(0,0,0,0.2));
      flex:0 0 auto;
    }

    .bubble{
      position:absolute;
      inset:clamp(-8px,-2.5vw,-18px) 0 auto 0; /* top only */
      display:grid;
      place-items:center;
      pointer-events:none; /* clicks pass through */
    }
    .bubble-inner{ position:relative; width:min(780px,92%); }
    .bubble-img{ width:100%; height:auto; display:block; opacity:.95; }

    .bubble-text{
      position:absolute; inset:0; display:grid; place-items:center;
      padding:clamp(8px,2.2vw,18px);
      text-align:center;
      font-family:'Press Start 2P', monospace;
      font-size:clamp(10px,2.4vw,16px);
      line-height:1.35;
      color:#102027;
      text-shadow:0 1px 0 rgba(255,255,255,0.5);
    }

    .sword-wrap{ display:flex; flex-direction:column; align-items:center; }
    .sword-btn{
      background:transparent; border:0; padding:0; margin:0; cursor:pointer; outline:none;
      flex:0 0 auto; translate:0 6px;
    }
    .sword-btn img{
      width:clamp(72px,12vw,120px);
      height:auto; display:block;
      filter:drop-shadow(0 4px 12px rgba(69,123,157,0.45));
      transition:transform 160ms ease, filter 160ms ease;
    }
    .sword-btn:hover img, .sword-btn:focus-visible img{
      transform:translateY(-4px) scale(1.05);
      filter:drop-shadow(0 6px 16px rgba(42,157,143,0.55));
    }
    .sword-caption{ text-align:center; font-size:.9rem; opacity:.75; margin-top:.25rem; }

    .credit{
      text-align:center; opacity:.8; font-size:.95rem; margin:.25rem 0 0; color:#f1faee;
    }

    @media (max-width:640px){
      .dangerous-scene{ min-height:190px; }
      .bubble-text{ font-size:clamp(10px,3.2vw,14px); }
    }






    </style>
</head>
<body>
    <div id="app">
        <!-- Custom Glassmorphism Cursor -->
        <div class="custom-cursor" id="cursor"></div>

        <nav class="navbar">

                <span></span>
                <span></span>
            </div>
        </nav>

        <div class="overlay" onclick="closeMobileMenu()"></div>
        <div class="mobile-menu">
            <ul>
                <li><a href="#" onclick="openResumePopup(); closeMobileMenu()">Resume</a></li>
                <li><a href="#projects" onclick="closeMobileMenu()">Projects</a></li>
                <li><a href="#about" onclick="closeMobileMenu()">About</a></li>
                <li><a href="#contact" onclick="closeMobileMenu()">Contact</a></li>
            </ul>
        </div>

        <section class="hero-section" id="home">
            <iframe src="hero.html" class="hero-iframe"></iframe>

            <h2>Featured Projects</h2>

                A collection of interactive experiences and creative digital projects

        <!-- Full-width models section -->

            <iframe id="modelsFrame" src="models.html" class="models-iframe"></iframe>

        <!-- Full-width bento resume section -->

            <iframe src="bentoresume.html" class="bento-iframe"></iframe>

            <iframe id="testimonialsFrame" src="testimonials.html" class="testimonial-iframe"></iframe>

    <div id="contact"></div>
    <script>
        (async () => {
          const res = await fetch('footer.html');
          const html = await res.text();
          const doc = new DOMParser().parseFromString(html, 'text/html');

          // bring over styles defined in footer.html
          doc.querySelectorAll('style, link[rel="stylesheet"]').forEach(node => {
            document.head.appendChild(node.cloneNode(true));
          });

          // insert the actual footer and give it the #contact anchor
          const footer = doc.querySelector('footer');
          const mount = document.getElementById('contact');
          if (footer && mount) {
            footer.id = 'contact';
            mount.replaceWith(footer);
            // after: mount.replaceWith(footer);
            if (window.lucide) window.lucide.createIcons(footer);  // hydrate only inside the footer

          }
        })();
        </script>



    <script>
        // Detect if device supports hover (desktop)
        const isDesktop = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

        // Custom Cursor Logic - Only for desktop
        if (isDesktop) {
            const cursor = document.getElementById('cursor');
            let mouseX = 0;
            let mouseY = 0;
            let animationId;

            // Smooth cursor movement with requestAnimationFrame
            function updateCursor() {
                cursor.style.left = mouseX + 'px';
                cursor.style.top = mouseY + 'px';
            }

            // Track mouse movement with throttling
            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;

                if (!animationId) {
                    animationId = requestAnimationFrame(() => {
                        updateCursor();
                        animationId = null;
                    });
                }
            });

            // Click animation
            document.addEventListener('mousedown', () => {
                cursor.classList.add('clicking');
            });

            document.addEventListener('mouseup', () => {
                cursor.classList.remove('clicking');
            });

            // Hover states for interactive elements
            const hoverElements = document.querySelectorAll('a, button, .hamburger, .logo, .contact-link, .skill-tag');

            hoverElements.forEach(element => {
                element.addEventListener('mouseenter', () => {
                    cursor.classList.add('hovering');
                });

                element.addEventListener('mouseleave', () => {
                    cursor.classList.remove('hovering');
                });
            });

            // Hide cursor when entering iframes
            const iframes = document.querySelectorAll('iframe');
            iframes.forEach(iframe => {
                iframe.addEventListener('mouseenter', () => {
                    cursor.style.opacity = '0';
                });

                iframe.addEventListener('mouseleave', () => {
                    cursor.style.opacity = '1';
                });
            });

            // Listen for messages from iframes to hide/show cursor
            window.addEventListener('message', (event) => {
                if (event.data.type === 'hideCursor') {
                    cursor.style.opacity = '0';
                }
                if (event.data.type === 'showCursor') {
                    cursor.style.opacity = '1';
                }
            });

            // Hide cursor when leaving window
            document.addEventListener('mouseleave', () => {
                cursor.style.opacity = '0';
            });

            document.addEventListener('mouseenter', () => {
                cursor.style.opacity = '1';
            });
        }

        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        function toggleMobileMenu() {
            const hamburger = document.querySelector('.hamburger');
            const mobileMenu = document.querySelector('.mobile-menu');
            const overlay = document.querySelector('.overlay');

            hamburger.classList.toggle('active');
            mobileMenu.classList.toggle('active');
            overlay.classList.toggle('active');

            // Prevent body scroll when menu is open
            if (mobileMenu.classList.contains('active')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = 'auto';
            }
        }

        function closeMobileMenu() {
            const hamburger = document.querySelector('.hamburger');
            const mobileMenu = document.querySelector('.mobile-menu');
            const overlay = document.querySelector('.overlay');

            hamburger.classList.remove('active');
            mobileMenu.classList.remove('active');
            overlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Simple smooth scrolling
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });

        // Close mobile menu when clicking outside
        document.addEventListener('click', function(e) {
            const mobileMenu = document.querySelector('.mobile-menu');
            const hamburger = document.querySelector('.hamburger');

            if (mobileMenu.classList.contains('active') &&
                !mobileMenu.contains(e.target) &&
                !hamburger.contains(e.target)) {
                closeMobileMenu();
            }
        });
        function openResumePopup() {
            document.getElementById('resume-popup').style.display = 'block';
        }

        function closeResumePopup() {
            document.getElementById('resume-popup').style.display = 'none';
        }

    </script>


    <script>
      (function () {
        const frame = document.getElementById('testimonialsFrame');

        function resizeFromDOM() {
          try {
            const doc = frame.contentDocument || frame.contentWindow.document;
            const h = Math.max(
              doc.body?.scrollHeight || 0,
              doc.documentElement?.scrollHeight || 0
            );
            if (h) frame.style.height = h + 'px';
          } catch (e) {
            // Cross-origin guard; if different origin, rely on postMessage only
          }
        }

        frame.addEventListener('load', () => {
          resizeFromDOM();               // initial fit
          // Refit again shortly after in case fonts/images shift layout
          setTimeout(resizeFromDOM, 50);
          setTimeout(resizeFromDOM, 250);
        });

        // Listen for inner page height pings
        window.addEventListener('message', (e) => {
          if (e?.data?.type === 'testimonialsHeight' && Number.isFinite(e.data.height)) {
            frame.style.height = e.data.height + 'px';
          }
        });
      })();
    </script>

   <script>
/* Snap fully onto .models-section when it's *meaningfully* partial,
   with hysteresis so it triggers a little later (needs more overlap).
   Still allows clean exit via top/bottom escape zones. */
(function () {
  const section = document.querySelector('.models-section');
  const navbar  = document.querySelector('.navbar');
  if (!section) return;

  /* Tunables */
  const DURATION_MS        = 1200;   // eased scroll duration
  const SNAP_COOLDOWN_MS   = 900;    // min time between snaps
  const EDGE_ESCAPE_PX     = 96;     // no snap when trying to leave inside this band
  const MIN_OVERLAP_PX     = 140;    // NEW: require at least this many px visible to snap
  const DOWN_OVERLAP_RATIO = 0.18;   // NEW: if scrolling DOWN, need ≥ 18% of viewport visible
  const UP_OVERLAP_RATIO   = 0.22;   // NEW: if scrolling UP, need ≥ 22% of viewport visible
  // (bump these up or down to taste)

  let lastSnapAt = 0;
  let animId = 0;

  // track scroll direction (+1 down, -1 up)
  let lastY = window.scrollY;
  let lastDir = 0;

  const clamp = (n,a,b)=>Math.min(b,Math.max(a,n));
  const easeInOutQuad = t => (t<.5) ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;

  function cancelAnim(){ if (animId) { cancelAnimationFrame(animId); animId = 0; } }
  function animatedScrollTo(targetTop, duration=DURATION_MS){
    cancelAnim();
    const start = window.scrollY;
    const dist  = targetTop - start;
    const t0    = performance.now();
    function step(t){
      const p = clamp((t - t0)/duration, 0, 1);
      const eased = easeInOutQuad(p);
      window.scrollTo(0, start + dist*eased);
      if (p < 1) animId = requestAnimationFrame(step);
    }
    animId = requestAnimationFrame(step);
  }

  const navH = () => (navbar?.offsetHeight || 0);
  const topTarget    = () => section.offsetTop - navH();
  const bottomTarget = () => section.offsetTop + section.offsetHeight - innerHeight;

  const alignedTop    = (y) => Math.abs(y - topTarget())    < 2;
  const alignedBottom = (y) => Math.abs(y - bottomTarget()) < 2;

  function inEdgeEscape(y, dir){
    if (dir < 0) { // going UP
      if (y <= topTarget() + EDGE_ESCAPE_PX) return true;
    } else if (dir > 0) { // going DOWN
      if (y >= bottomTarget() - EDGE_ESCAPE_PX) return true;
    }
    return false;
  }

  function shouldThrottle(){ return (Date.now() - lastSnapAt) < SNAP_COOLDOWN_MS; }

  function trySnapWithHysteresis(){
    if (shouldThrottle()) return;

    const y  = window.scrollY;
    const r  = section.getBoundingClientRect();
    const vh = innerHeight;

    // visible pixels overlapping viewport
    const overlap = Math.max(0, Math.min(r.bottom, vh) - Math.max(r.top, 0));
    if (overlap <= 0) return;                 // not visible → ignore
    if (alignedTop(y) || alignedBottom(y)) return;   // already aligned
    if (inEdgeEscape(y, lastDir)) return;     // let user leave at edges

    // Direction-based hysteresis (need "a liiiiittle more" before snapping)
    const ratio = overlap / vh;
    const need  = (lastDir < 0 ? UP_OVERLAP_RATIO : DOWN_OVERLAP_RATIO);
    if (overlap < MIN_OVERLAP_PX || ratio < need) return; // <— delay the snap

    // Passed thresholds ⇒ snap
    lastSnapAt = Date.now();
    if (lastDir < 0) animatedScrollTo(bottomTarget());
    else             animatedScrollTo(topTarget());
  }

  // Track direction robustly
  window.addEventListener('scroll', () => {
    const y = window.scrollY;
    const dy = y - lastY;
    if (Math.abs(dy) > 0) lastDir = (dy > 0 ? 1 : -1);
    lastY = y;

    // Use scroll as the canonical trigger (works even if an iframe ate wheel/touch)
    trySnapWithHysteresis();
  }, { passive: true });

  // Also react to resize (viewport height changes alter ratios)
  window.addEventListener('resize', () => {
    // small debounce via rAF
    requestAnimationFrame(trySnapWithHysteresis);
  }, { passive: true });
})();
</script>
