<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Henriëtta van Niekerk</title>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Inter:opsz,wght@14..32,200;14..32,300;14..32,400;14..32,500;14..32,600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&display=swap');

        @font-face {
            font-family: 'DotempDemo';
            src: url('fonts/DotempDemo.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* Mixed-font editorial classes */
        .px {
            font-family: 'DotempDemo', monospace;
            font-style: normal;
            font-weight: 400;
            font-size: 0.88em;
        }
        .di {
            font-family: 'Didot', serif;
            font-style: italic;
            font-weight: 700;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none !important;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #080c12;
            color: #f0f2f0;
            overflow: hidden;
            height: 100vh;
        }

        /* ─── Custom Cursor ─────────────────────────────── */
        .custom-cursor {
            position: fixed;
            width: 18px; height: 18px;
            background: rgba(102, 252, 241, 0.15);
            border: 1.5px solid rgba(102, 252, 241, 0.65);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            backdrop-filter: blur(6px);
            transition: width 0.15s ease, height 0.15s ease, background 0.15s ease, transform 0.08s ease-out;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.25);
        }
        .custom-cursor.hovering {
            width: 30px; height: 30px;
            background: rgba(102, 252, 241, 0.1);
            border-color: rgba(102, 252, 241, 0.8);
        }
        .custom-cursor.clicking {
            transform: translate(-50%, -50%) scale(0.72);
            background: rgba(102, 252, 241, 0.5);
        }

        /* ─── Hero Layout ───────────────────────────────── */
        .hero {
            position: relative;
            width: 100vw; height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        /* 3JS canvas — fills viewport, sits at z-index 1 */
        .sky-canvas {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.85;
        }

        /* Directional dark veil — heavy left (text), fading right (photo + sky) */
        .hero-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            background:
                linear-gradient(
                    108deg,
                    rgba(5, 9, 15, 0.88) 0%,
                    rgba(5, 9, 15, 0.70) 38%,
                    rgba(5, 9, 15, 0.32) 68%,
                    rgba(5, 9, 15, 0.10) 100%
                );
        }

        /* Grid — 2-col, text | photo */
        .hero-grid {
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr auto;
            row-gap: 0;
            column-gap: 5rem;
            max-width: 1300px;
            width: 100%;
            margin: 0 auto;
            padding: 0 2.5rem;
        }
        .eyebrow-wrapper {
            align-self: end;
            padding-bottom: 0.45rem;
        }

        /* ─── Left: Text Column ─────────────────────────── */
        .hero-text {
            display: flex;
            flex-direction: column;
        }

        /* Eyebrow */
        .eyebrow {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-family: 'Didot', serif;
            font-style: italic;
            font-weight: 700;
            font-size: 0.92rem;
            letter-spacing: 0.01em;
            color: rgba(168, 218, 220, 0.55);
            margin-bottom: 1.1rem;
            flex-wrap: wrap;
        }
        .eyebrow-line {
            display: block;
            width: 28px; height: 1px;
            background: rgba(168, 218, 220, 0.35);
            flex-shrink: 0;
        }
        .eyebrow-link {
            color: rgba(240, 242, 240, 0.5);
            text-decoration: none;
            white-space: nowrap;
            transition: color 0.2s ease;
        }
        .eyebrow-link:hover { color: rgba(168, 218, 220, 0.95); }
        .link-arrow {
            display: inline-block;
            transition: transform 0.22s ease, opacity 0.22s ease;
            opacity: 0.35;
        }
        .eyebrow-link:hover .link-arrow {
            transform: translate(3px, -3px);
            opacity: 1;
        }
        .eyebrow-dot { opacity: 0.3; font-style: normal; }
        .eyebrow-prev { color: rgba(240, 242, 240, 0.28); white-space: nowrap; }

        .display-name {
            line-height: 0.90;
            margin-bottom: 1.8rem;
        }
        .name-first {
            display: block;
            font-family: 'Didot', serif;
            font-size: clamp(3.8rem, 7.2vw, 8.8rem);
            font-weight: 700;
            font-style: italic;
            color: #f0f2f0;
            letter-spacing: -0.025em;
        }
        .name-last {
            display: block;
            font-family: 'Didot', serif;
            font-size: clamp(2.2rem, 4.2vw, 5.4rem);
            font-weight: 700;
            font-style: italic;
            color: rgba(240, 242, 240, 0.42);
            letter-spacing: 0.06em;
        }

        /* Gilmore Girls easter egg tagline — editorial italic pull quote */
        .tagline {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: clamp(0.88rem, 1.15vw, 1.05rem);
            font-weight: 400;
            color: rgba(168, 218, 220, 0.65);
            line-height: 1.45;
            margin-bottom: 1.4rem;
            cursor: pointer;
            position: relative;
            width: fit-content;
            max-width: 480px;
            padding: 0.3rem 0;
            transition: color 0.25s ease;
            user-select: none;
        }
        .tagline { cursor: pointer; }
        /* quotes only visible during GG phrase; star always shows */
        .quote-mark { display: none; font-style: normal; }
        .tagline.gg-active .quote-mark { display: inline; }
        .tagline:hover {
            color: rgba(168, 218, 220, 0.90);
        }
        /* Subtle underline */
        .tagline::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 1px;
            background: rgba(168, 218, 220, 0.22);
            transform: scaleX(0.35);
            transform-origin: left;
            transition: transform 0.3s ease, background 0.25s ease;
        }
        .tagline:hover::after {
            transform: scaleX(1);
            background: rgba(168, 218, 220, 0.45);
        }
        /* Easter egg star glyph */
        .tagline-star {
            display: inline-block;
            font-size: 0.62rem;
            font-style: normal;
            color: rgba(102, 252, 241, 0.4);
            vertical-align: super;
            margin-left: 0.35rem;
            transition: color 0.2s ease, transform 0.2s ease;
        }
        .tagline:hover .tagline-star {
            color: rgba(102, 252, 241, 0.85);
            transform: rotate(30deg);
        }
        /* Tooltip on hover */
        .tagline-tooltip {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 0;
            background: rgba(5, 9, 15, 0.96);
            color: rgba(240, 242, 240, 0.75);
            padding: 0.45rem 0.85rem;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-style: normal;
            font-size: 0.7rem;
            font-weight: 400;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            border: 1px solid rgba(168, 218, 220, 0.18);
            z-index: 50;
            transform: translateY(4px);
        }
        .tagline:hover .tagline-tooltip {
            opacity: 1;
            transform: translateY(0);
        }

        .typing-text {
            color: rgba(168, 218, 220, 0.85);
            border-right: 1.5px solid rgba(168, 218, 220, 0.7);
            animation: blink 1.1s infinite;
            font-weight: 400;
        }
        @keyframes blink {
            0%, 49% { border-color: rgba(168, 218, 220, 0.7); }
            50%, 100% { border-color: transparent; }
        }

        /* CTA + social row */
        .hero-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 1.1rem;
        }

        .cta-group {
            display: flex;
            gap: 0.65rem;
            align-items: center;
        }

        /* Primary CTA — pill, white fill */
        .btn-cta-primary {
            font-family: 'Inter', sans-serif;
            font-size: 0.70rem;
            font-weight: 500;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            color: #080c12;
            background: #f0f2f0;
            border: none;
            border-radius: 999px;
            padding: 0.72rem 1.75rem;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
        }
        .btn-cta-primary:hover {
            background: #a8dadc;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 218, 220, 0.22);
        }

        /* Secondary CTA — liquid glass pill */
        .btn-cta-secondary {
            font-family: 'Inter', sans-serif;
            font-size: 0.70rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(240, 242, 240, 0.60);
            background: rgba(12, 18, 28, 0.40);
            backdrop-filter: url(#hero-glass-sm) blur(3px);
            -webkit-backdrop-filter: blur(10px) saturate(150%);
            border: 1px solid rgba(240, 242, 240, 0.16);
            border-radius: 999px;
            padding: 0.72rem 1.75rem;
            cursor: pointer;
            box-shadow:
                inset 1px 1.5px 2px rgba(255,255,255,0.16),
                inset -0.5px -0.5px 1px rgba(255,255,255,0.04);
            transition: border-color 0.2s ease, color 0.2s ease, transform 0.15s ease, background 0.2s ease;
        }
        .btn-cta-secondary:hover {
            border-color: rgba(168, 218, 220, 0.45);
            color: #a8dadc;
            background: rgba(42, 157, 143, 0.12);
            transform: translateY(-2px);
        }

        /* Social icons — minimal, quiet */
        .social-row {
            display: flex;
            gap: 0.55rem;
            align-items: center;
        }
        .social-btn {
            width: 34px; height: 34px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.09);
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
            position: relative;
        }
        .social-btn:hover {
            background: rgba(168, 218, 220, 0.10);
            border-color: rgba(168, 218, 220, 0.30);
            transform: translateY(-2px);
        }
        .social-btn i { display: flex; align-items: center; justify-content: center; }
        .social-btn svg[data-lucide] {
            width: 15px; height: 15px;
            stroke: rgba(255,255,255,0.42);
            transition: stroke 0.2s ease;
        }
        .social-btn:hover svg[data-lucide] { stroke: #a8dadc; }
        .social-btn svg.bi-discord {
            width: 15px; height: 15px;
            fill: rgba(255,255,255,0.42);
            stroke: none;
            transition: fill 0.2s ease;
        }
        .social-btn:hover svg.bi-discord { fill: #a8dadc; }
        .social-tooltip {
            position: absolute;
            bottom: calc(100% + 7px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            background: rgba(5, 9, 15, 0.97);
            color: rgba(240, 242, 240, 0.7);
            padding: 0.35rem 0.7rem;
            border-radius: 5px;
            font-family: 'Inter', sans-serif;
            font-size: 0.65rem;
            font-weight: 400;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
            border: 1px solid rgba(168, 218, 220, 0.15);
            z-index: 50;
        }
        .social-btn:hover .social-tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ─── Right: Photo Column ───────────────────────── */
        .hero-photo {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-frame {
            position: relative;
            width: 360px; height: 480px;
        }

        /* Orbit dots outside the frame */
        .orbit-container {
            position: absolute;
            inset: -28px;
            pointer-events: none;
            z-index: 0;
        }
        .orbit-dot {
            position: absolute;
            width: 7px; height: 7px;
            border-radius: 50%;
            opacity: 0.55;
        }
        .orbit-dot:nth-child(1) { top: 10%; left: 8%; background: #a8dadc; animation: orbitDot 14s linear infinite 0s; }
        .orbit-dot:nth-child(2) { top: 18%; right: 10%; background: #2a9d8f; animation: orbitDot 14s linear infinite 3.5s; }
        .orbit-dot:nth-child(3) { bottom: 14%; left: 14%; background: #457b9d; animation: orbitDot 14s linear infinite 7s; }
        .orbit-dot:nth-child(4) { bottom: 22%; right: 7%; background: #66fcf1; animation: orbitDot 14s linear infinite 10.5s; }
        @keyframes orbitDot {
            0%   { transform: rotate(0deg) translateX(45px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(45px) rotate(-360deg); }
        }

        /* The actual photo card — liquid glass container */
        .photo-inner {
            position: relative;
            width: 100%; height: 100%;
            border-radius: 18px;
            overflow: hidden;
            /* Liquid glass */
            background: rgba(12, 18, 28, 0.10);
            backdrop-filter: url(#hero-glass-lg) blur(2px);
            -webkit-backdrop-filter: blur(6px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.11);
            box-shadow:
                0 44px 88px rgba(0,0,0,0.58),
                0 10px 28px rgba(0,0,0,0.35),
                inset 1.5px 2px 4px rgba(255,255,255,0.30),
                inset -1px -1px 3px rgba(255,255,255,0.05);
            animation: floatPhoto 9s ease-in-out infinite;
            cursor: pointer;
            transition: box-shadow 0.35s ease;
            z-index: 1;
        }
        .photo-inner:hover {
            box-shadow:
                0 56px 110px rgba(0,0,0,0.64),
                0 14px 36px rgba(0,0,0,0.42),
                0 0 36px rgba(42, 157, 143, 0.14),
                inset 1.5px 2px 4px rgba(255,255,255,0.38),
                inset -1px -1px 3px rgba(255,255,255,0.07);
        }
        /* Specular crescent highlight */
        .photo-inner::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 18px;
            background: linear-gradient(138deg, rgba(255,255,255,0.13) 0%, rgba(255,255,255,0.05) 18%, transparent 40%);
            pointer-events: none;
            z-index: 3;
        }
        /* Bottom caption on hover */
        .photo-caption {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 2rem 1.2rem 1.1rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.66rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            color: rgba(240, 242, 240, 0.6);
            background: linear-gradient(to top, rgba(5,9,15,0.72) 0%, rgba(5,9,15,0.35) 55%, transparent 100%);
            z-index: 4;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-align: center;
        }
        .photo-inner:hover .photo-caption { opacity: 1; }
        .photo-inner img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            position: relative;
            z-index: 1;
        }
        .photo-fallback {
            display: none;
            width: 100%; height: 100%;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            background: rgba(42, 157, 143, 0.15);
        }
        @keyframes floatPhoto {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            35%      { transform: translateY(-11px) rotate(0.4deg); }
            68%      { transform: translateY(-5px) rotate(-0.25deg); }
        }

        /* ─── Modal (Paris / Gilmore Girls) ─────────────── */
        .modal {
            position: fixed;
            inset: 0; height: 100dvh;
            display: none;
            place-items: center;
            padding: clamp(12px, 2vw, 24px);
            background: rgba(0,0,0,0.72);
            backdrop-filter: blur(22px);
            z-index: 2147483000;
        }
        .modal.open { display: grid; }

        .modal-content {
            position: relative;
            width: min(880px, 90vw);
            max-height: min(86dvh, 880px);
            background: rgba(6, 10, 16, 0.97);
            border-radius: 18px;
            padding: clamp(14px, 2vw, 22px);
            box-shadow:
                0 28px 90px rgba(0,0,0,0.65),
                inset 1px 1.5px 3px rgba(255,255,255,0.08);
            overflow: hidden;
            border: 1px solid rgba(168, 218, 220, 0.13);
        }
        .modal-close {
            position: absolute;
            top: 14px; right: 18px;
            font-family: 'Inter', sans-serif;
            font-size: 22px; line-height: 1;
            color: rgba(240, 242, 240, 0.35);
            cursor: pointer;
            transition: color 0.2s;
            background: none; border: none;
            z-index: 5;
        }
        .modal-close:hover { color: rgba(240, 242, 240, 0.8); }
        .embed-16x9 {
            position: relative;
            width: 100%; aspect-ratio: 16/9;
            border-radius: 10px;
            overflow: hidden;
            background: #0a0a0a;
        }
        .embed-16x9 iframe {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            border: 0;
        }
        .modal-caption {
            margin-top: 1rem;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 0.92rem;
            font-weight: 400;
            color: rgba(240, 242, 240, 0.35);
            text-align: center;
            letter-spacing: 0.02em;
        }

        /* ─── Desktop: photo spans both grid rows ───────── */
        .hero-photo {
            grid-column: 2;
            grid-row: 1 / span 2;
            align-self: center;
        }

        /* ─── Mobile ────────────────────────────────────── */
        @media (max-width: 920px) {
            /*
             * padding-top on .hero (not the grid) shifts the flex centering
             * zone downward by ~navbar height, so content appears centred in
             * the visible area below the navbar — no empty padding inflating
             * the grid and creating lopsided blank space.
             */
            .hero {
                align-items: center;
                height: 100dvh;
                padding-top: 3rem;
            }
            .hero-grid {
                grid-template-columns: 1fr;
                grid-template-rows: none;
                gap: 2.5rem;
                padding: 0 1.5rem 0;
                justify-items: center;
                text-align: center;
            }
            /* order: eyebrow → photo → name+content */
            .eyebrow-wrapper { order: 1; }
            .hero-photo      { order: 2; grid-column: auto; grid-row: auto; align-self: auto; }
            .hero-text       { order: 3; align-items: center; padding-bottom: 2rem; }
            /* reset eyebrow spacing — grid gap handles it */
            .eyebrow-wrapper { padding-bottom: 0; }
            .eyebrow { margin-bottom: 0; justify-content: center; }
            /* internal spacing for mobile */
            .display-name   { margin-bottom: 1.5rem; }
            .tagline        { margin-bottom: 1.25rem; margin-left: auto; margin-right: auto; text-align: center; }
            .tagline::after { transform-origin: center; }
            .tagline-tooltip { left: 50%; transform: translateX(-50%) translateY(4px); }
            .tagline:hover .tagline-tooltip { transform: translateX(-50%) translateY(0); }
            .role-line      { margin-bottom: 1.5rem; }
            .eyebrow        { justify-content: center; }
            .hero-actions   { flex-wrap: wrap; justify-content: center; gap: 1rem; }
            .social-row     { justify-content: center; }
            .photo-frame    { width: 220px; height: 285px; }
        }

        @media (max-width: 480px) {
            .name-first  { font-size: 2.8rem; }
            .name-last   { font-size: 2.0rem; }
            .hero-overlay { background: rgba(5,9,15,0.78); }
            .photo-frame { width: 175px; height: 228px; }
        }

        /* ─── Reveal Canvas ─────────────────────────────── */
        .reveal-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        /* Respect reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .photo-inner { animation: none; }
            .orbit-dot   { animation: none; }
            .typing-text { animation: none; border-right-color: #a8dadc; }
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.module.js"
        }
    }
    </script>

    <script>
        function openParisModal() {
            document.getElementById('parisModal').classList.add('open');
        }
        function closeParisModal() {
            const modal  = document.getElementById('parisModal');
            const iframe = document.getElementById('parisVideo');
            modal.classList.remove('open');
            iframe.src = iframe.src; // reset video
        }
        function handleTaglineClick() {
            openParisModal();
        }
        window.onclick = function(e) {
            if (e.target === document.getElementById('parisModal')) closeParisModal();
        };
    </script>
</head>
<body>

    <!-- ── SVG Liquid Glass Filters ──────────────────────── -->
    <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
        <defs>
            <!-- For larger elements (photo frame) -->
            <filter id="hero-glass-lg" x="-5%" y="-5%" width="110%" height="110%"
                    color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency="0.007 0.005"
                              numOctaves="3" seed="42" result="noise"/>
                <feGaussianBlur in="noise" stdDeviation="9" result="lensMap"/>
                <feDisplacementMap in="SourceGraphic" in2="lensMap"
                                   scale="26" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
            <!-- For small chips / pills -->
            <filter id="hero-glass-sm" x="-10%" y="-40%" width="120%" height="180%"
                    color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency="0.013 0.009"
                              numOctaves="2" seed="17" result="noise"/>
                <feGaussianBlur in="noise" stdDeviation="6" result="lensMap"/>
                <feDisplacementMap in="SourceGraphic" in2="lensMap"
                                   scale="14" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
            <!-- Fractal glass reveal — displacement scale animated by JS -->
            <filter id="reveal-fractal" x="-8%" y="-8%" width="116%" height="116%"

    <!-- ── Three.js + Interactions ───────────────────────── -->
    <script type="module">
        import * as THREE from "three";
        import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/loaders/GLTFLoader.js";

        // ── Cursor ───────────────────────────────────────────
        const cursor = document.getElementById('cursor');
        let mouseX = 0, mouseY = 0, raf;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX; mouseY = e.clientY;
            if (!raf) raf = requestAnimationFrame(() => {
                cursor.style.left = mouseX + 'px';
                cursor.style.top  = mouseY + 'px';
                raf = null;
            });
        });
        document.addEventListener('mousedown',  () => cursor.classList.add('clicking'));
        document.addEventListener('mouseup',    () => cursor.classList.remove('clicking'));
        document.addEventListener('mouseleave', () => { cursor.style.opacity = '0'; });
        document.addEventListener('mouseenter', () => { cursor.style.opacity = '1'; });

        document.querySelectorAll(
            '.eyebrow-link, .social-btn, .photo-inner, #taglineMerged, .btn-cta-primary, .btn-cta-secondary, .modal-close'
        ).forEach(el => {
            el.addEventListener('mouseenter', () => cursor.classList.add('hovering'));
            el.addEventListener('mouseleave', () => cursor.classList.remove('hovering'));
        });

        // ── Three.js Sky Scene ───────────────────────────────
        let scene, camera, renderer, skyMesh;
        const clock = new THREE.Clock();

        function initSkyScene() {
            scene    = new THREE.Scene();
            camera   = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 12);

            const canvas = document.getElementById('skyCanvas');
            renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            scene.add(new THREE.AmbientLight(0xffffff, 3));

            const loader = new GLTFLoader();
            loader.load('./models/skyblue.glb', (gltf) => {
                skyMesh = gltf.scene;
                skyMesh.scale.set(5, 5, 5);

                skyMesh.traverse((child) => {
                    if (child.isMesh) {
                        if (gltf.parser?.json?.textures) {
                            gltf.parser.loadTexture(0).then(tex => {
                                child.material.map = tex;
                                child.material.color.setHex(0xffffff);
                                child.material.transparent = false;
                                child.material.opacity = 1;
                                child.material.needsUpdate = true;
                            });
                        } else {
                            child.material = new THREE.MeshBasicMaterial({ color: 0x87CEEB });
                        }
                    }
                });

                scene.add(skyMesh);
                signalHeroReady();
            }, undefined, () => {
                // Fallback sphere
                const geo = new THREE.SphereGeometry(1, 32, 32);
                const cols = [];
                for (let i = 0; i < geo.attributes.position.count; i++) cols.push(0.3, 0.6, 1);
                geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
                skyMesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true }));
                scene.add(skyMesh);
                signalHeroReady();
            });
        }

        function signalHeroReady() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'heroReady' }, '*');
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            if (skyMesh) {
                skyMesh.rotation.y = t * 0.02;
                skyMesh.rotation.x = Math.sin(t * 0.03) * 0.1;
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ── Typewriter ───────────────────────────────────────
        function startTypewriter() {
            const phrases = [
                { text: 'turns caffeine into shipped products',                    gg: false },
                { text: 'has won hackathons and game jams',                         gg: false },
                { text: 'speaks design AND engineering fluently',                   gg: false },

                { text: 'was featured on CTV x3 in 2025 for skrimp',              gg: false },
                { text: 'gets more done before 9am than other people do all day',  gg: true  },
            ];
            let current = 0;
            const el      = document.getElementById('typingText');
            const tagline = document.getElementById('taglineMerged');
            if (!el) { setTimeout(startTypewriter, 500); return; }

            function setGGMode(isGG) {
                if (!tagline) return;
                if (isGG) tagline.classList.add('gg-active');
                else      tagline.classList.remove('gg-active');
            }

            function type(phrase, cb) {
                let i = 0; el.textContent = '';
                setGGMode(phrase.gg);
                (function tick() {
                    if (i < phrase.text.length) { el.textContent += phrase.text[i++]; setTimeout(tick, 58 + Math.random() * 42); }
                    else setTimeout(cb, 2400);
                })();
            }
            function del(cb) {
                (function tick() {
                    if (el.textContent.length > 0) { el.textContent = el.textContent.slice(0,-1); setTimeout(tick, 28 + Math.random() * 22); }
                    else { setGGMode(false); setTimeout(cb, 480); }
                })();
            }
            function cycle() {
                type(phrases[current], () => del(() => {
                    current = (current + 1) % phrases.length;
                    setTimeout(cycle, 180);
                }));
            }
            cycle();
        }

        // ── Glass Shard Reveal ────────────────────────────────
        //
        // The photo is made of triangular glass panes (Delaunay triangulation).
        // Hovering the mouse pushes nearby shards outward — fairchild.png shows
        // through the cracks/gaps. Glowing cyan lines trace the fracture network.
        // Mobile: tap once to explode all shards apart; tap again to reassemble.
        //
        function initReveal() {
            const photoInner = document.getElementById('photoInner');
            const revealCanvas = document.getElementById('revealCanvas');
            const photoCaption = document.getElementById('photoCaption');
            if (!revealCanvas) return;
            const rCtx = revealCanvas.getContext('2d');

            const heroImg    = photoInner.querySelector('img');
            const fairchildImg = new Image();
            fairchildImg.src = './fairchild.png';

            const isMobile = () => window.matchMedia('(hover: none) and (pointer: coarse)').matches;

            let cw = 0, ch = 0;
            function sizeCanvas() {
                cw = photoInner.offsetWidth;
                ch = photoInner.offsetHeight;
                revealCanvas.width  = cw;
                revealCanvas.height = ch;
            }

            // ── Bowyer-Watson Delaunay triangulation ──────────
            function circumcircle(a, b, c) {
                const ax = a.x - c.x, ay = a.y - c.y;
                const bx = b.x - c.x, by = b.y - c.y;
                const D  = 2 * (ax * by - ay * bx);
                if (Math.abs(D) < 1e-8) return null;
                const ux = (by*(ax*ax+ay*ay) - ay*(bx*bx+by*by)) / D;
                const uy = (ax*(bx*bx+by*by) - bx*(ax*ax+ay*ay)) / D;
                return { x: ux+c.x, y: uy+c.y, r2: ux*ux+uy*uy };
            }

            function triangulate(pts) {
                const M  = 1e6;
                const st = [{x:-M,y:-M},{x:0,y:M*3},{x:M*3,y:-M}];
                let T = [st.slice()];
                for (const p of pts) {
                    let edges = [];
                    T = T.filter(t => {
                        const cc = circumcircle(t[0],t[1],t[2]);
                        if (!cc) return true;
                        const dx = p.x-cc.x, dy = p.y-cc.y;
                        if (dx*dx+dy*dy < cc.r2) {
                            edges.push([t[0],t[1]],[t[1],t[2]],[t[2],t[0]]);
                            return false;
                        }
                        return true;
                    });
                    edges = edges.filter((e,i) =>
                        !edges.some((f,j) => i!==j &&
                            ((e[0]===f[0]&&e[1]===f[1])||(e[0]===f[1]&&e[1]===f[0])))
                    );
                    for (const e of edges) T.push([e[0],e[1],p]);
                }
                return T.filter(t => !t.some(v => st.includes(v)));
            }

            let mx = -999, my = -999, hovering = false;

            // ── Reeded (ribbed) glass texture ─────────────────
            let reedTex = null;
            function buildReededTexture() {
                if (!heroImg.complete || !heroImg.naturalWidth || !cw || !ch) return;
                const osc = document.createElement('canvas');
                osc.width = cw; osc.height = ch;
                const oc = osc.getContext('2d');
                const W = 5, D = 3; // stripe width (px), lateral shift (px)
                for (let x = 0; x < cw; x += W) {
                    const shift = (Math.floor(x / W) % 2 === 0) ? -D : D;
                    const srcX  = Math.max(0, Math.min(cw - W, x + shift));
                    oc.drawImage(heroImg, srcX, 0, W, ch, x, 0, W, ch);
                }
                // Subtle cool-water tint
                oc.fillStyle = 'rgba(168,218,220,0.06)';
                oc.fillRect(0, 0, cw, ch);
                // Hairline ridge highlights between each stripe
                oc.strokeStyle = 'rgba(255,255,255,0.18)';
                oc.lineWidth = 0.5;
                for (let x = 0; x <= cw; x += W) {
                    oc.beginPath(); oc.moveTo(x, 0); oc.lineTo(x, ch); oc.stroke();
                }
                reedTex = osc;
            }

            // ── Build shards once per session ─────────────────
            let shards = [];
            function buildShards() {
                sizeCanvas();
                if (!cw || !ch) return;
                // Jittered grid → natural-looking glass crack distribution
                const COLS = 6, ROWS = 8;
                const pts  = [];
                for (let r = 0; r <= ROWS; r++) {
                    for (let c = 0; c <= COLS; c++) {
                        pts.push({
                            x: Math.max(1, Math.min(cw-1, c/COLS*cw + (Math.random()-0.5)*cw/COLS*0.5)),
                            y: Math.max(1, Math.min(ch-1, r/ROWS*ch + (Math.random()-0.5)*ch/ROWS*0.5))
                        });
                    }
                }
                const tris = triangulate(pts);
                shards = tris.map(v => ({
                    v,
                    cx: (v[0].x+v[1].x+v[2].x)/3,
                    cy: (v[0].y+v[1].y+v[2].y)/3,
                    dx:0, dy:0, rot:0,
                    tdx:0, tdy:0, trot:0
                }));
                buildReededTexture();
            }

            // ── Render loop ───────────────────────────────────
            let rafPending = false;
            function scheduleFrame() {
                if (!rafPending) { rafPending = true; requestAnimationFrame(renderFrame); }
            }

            function renderFrame() {
                rafPending = false;
                if (!cw || !heroImg.complete || !heroImg.naturalWidth
                        || !fairchildImg.complete || !fairchildImg.naturalWidth) return;

                // Lerp shards toward targets
                let moving = false;
                shards.forEach(s => {
                    s.dx  += (s.tdx  - s.dx)  * 0.11;
                    s.dy  += (s.tdy  - s.dy)  * 0.11;
                    s.rot += (s.trot - s.rot) * 0.11;
                    if (Math.abs(s.tdx-s.dx)>0.25 || Math.abs(s.tdy-s.dy)>0.25) moving = true;
                });

                rCtx.clearRect(0, 0, cw, ch);

                // 1 ── fairchild underneath (shows through the gaps)
                const fw = fairchildImg.naturalWidth, fh = fairchildImg.naturalHeight;
                const fsc = Math.max(cw/fw, ch/fh);
                rCtx.drawImage(fairchildImg, (cw-fw*fsc)/2, (ch-fh*fsc)/2, fw*fsc, fh*fsc);

                // 2 ── each glass shard: clipped to its triangle, displaced
                shards.forEach(s => {
                    rCtx.save();
                    // Translate shard by (dx,dy), rotate around its centroid
                    rCtx.translate(s.cx + s.dx, s.cy + s.dy);
                    rCtx.rotate(s.rot);
                    rCtx.translate(-s.cx, -s.cy);
                    // Clip to the original triangle vertices (in the rotated space)
                    rCtx.beginPath();
                    s.v.forEach((p,i) => i ? rCtx.lineTo(p.x,p.y) : rCtx.moveTo(p.x,p.y));
                    rCtx.closePath();
                    rCtx.clip();
                    // Draw herogirl (reeded glass texture) — it moves WITH the shard
                    rCtx.drawImage(reedTex || heroImg, 0, 0, cw, ch);
                    // Faint glass-surface specular
                    rCtx.fillStyle = 'rgba(255,255,255,0.04)';
                    rCtx.fill();
                    rCtx.restore();
                });

                // 3 ── crack lines at original positions (the fracture network)
                rCtx.save();
                rCtx.strokeStyle = 'rgba(168,218,220,0.60)';
                rCtx.lineWidth   = 0.8;
                rCtx.shadowBlur  = 5;
                rCtx.shadowColor = 'rgba(102,252,241,0.35)';
                const seen = new Set();
                shards.forEach(s => {
                    for (let i = 0; i < 3; i++) {
                        const a = s.v[i], b = s.v[(i+1)%3];
                        const k = [a.x,a.y,b.x,b.y].map(n=>Math.round(n)).join(',');
                        const r = [b.x,b.y,a.x,a.y].map(n=>Math.round(n)).join(',');
                        if (seen.has(k)||seen.has(r)) continue;
                        seen.add(k);
                        rCtx.beginPath();
                        rCtx.moveTo(a.x, a.y);
                        rCtx.lineTo(b.x, b.y);
                        rCtx.stroke();
                    }
                });
                rCtx.restore();

                // 4 ── spotlight vignette: darken outside cursor circle
                if (hovering && mx > -900) {
                    const R_VIG = 90;
                    rCtx.save();
                    rCtx.fillStyle = 'rgba(0,0,0,0.52)';
                    rCtx.beginPath();
                    rCtx.rect(0, 0, cw, ch);
                    rCtx.arc(mx, my, R_VIG, 0, Math.PI * 2);
                    rCtx.fill('evenodd');
                    rCtx.restore();
                }

                if (moving || hovering) scheduleFrame();
            }

            function fadeOutAndClear() {
                // CSS transition handles the opacity fade
                revealCanvas.style.opacity = '0';
                setTimeout(() => {
                    rCtx.clearRect(0, 0, cw, ch);
                    revealCanvas.style.opacity = '1';
                }, 380);
            }

            // ── Desktop: mouse disturbs nearby shards ─────────
            if (!isMobile()) {
                photoInner.addEventListener('mouseenter', () => {
                    hovering = true;
                    scheduleFrame();
                });

                photoInner.addEventListener('mousemove', (e) => {
                    if (!shards.length) return;
                    const rect = photoInner.getBoundingClientRect();
                    mx = e.clientX - rect.left;
                    my = e.clientY - rect.top;
                    const R = 90, BUFFER = 50;
                    shards.forEach(s => {
                        const dx = s.cx - mx, dy = s.cy - my;
                        const d  = Math.hypot(dx, dy);
                        if (d < R && d > 0.1) {
                            // Push centroid fully OUTSIDE the spotlight radius
                            const pushDist = R + BUFFER - d;
                            s.tdx  = (dx / d) * pushDist;
                            s.tdy  = (dy / d) * pushDist;
                            s.trot = (1 - d / R) * 0.09;
                        } else if (d < R * 1.7) {
                            // Soft rim push for shards just outside the radius
                            const f = (1 - (d - R) / (R * 0.7)) * 8;
                            s.tdx  = (dx / d) * f;
                            s.tdy  = (dy / d) * f;
                            s.trot = 0;
                        } else {
                            s.tdx = s.tdy = s.trot = 0;
                        }
                    });
                    scheduleFrame();
                });

                photoInner.addEventListener('mouseleave', () => {
                    hovering = false;
                    mx = -999; my = -999;
                    shards.forEach(s => { s.tdx = s.tdy = s.trot = 0; });
                    scheduleFrame();
                    setTimeout(() => { if (!hovering) fadeOutAndClear(); }, 800);
                });

                photoInner.addEventListener('click', () => {
                    window.open('https://www.linkedin.com/in/henriettavanniekerk', '_blank');
                });
            }

            // ── Mobile: tap to explode shards / reassemble ────
            if (isMobile()) {
                let revealed = false;

                photoInner.addEventListener('click', e => {
                    e.preventDefault();
                    revealed = !revealed;

                    if (revealed) {
                        // Shards fly outward from centre
                        shards.forEach(s => {
                            const dx = s.cx - cw/2, dy = s.cy - ch/2;
                            const d  = Math.hypot(dx, dy) || 1;
                            const dist_frac = d / Math.hypot(cw/2, ch/2);
                            const f = (0.5 + dist_frac * 0.7) * 85;
                            s.tdx  = dx/d * f;
                            s.tdy  = dy/d * f;
                            s.trot = (Math.random() - 0.5) * 0.30;
                        });
                        scheduleFrame();
                        photoCaption.textContent = '✨ tap to reassemble';
                    } else {
                        // Shards return home
                        shards.forEach(s => { s.tdx = s.tdy = s.trot = 0; });
                        scheduleFrame();
                        setTimeout(() => { if (!revealed) fadeOutAndClear(); }, 900);
                        photoCaption.textContent = '✨ chaotic mastermind behind the magic';
                    }
                });
            }

            window.addEventListener('resize', buildShards);

            // Initialise — build shards once fairchild is ready
            if (fairchildImg.complete && fairchildImg.naturalWidth) {
                buildShards();
            } else {
                fairchildImg.onload = buildShards;
            }
        }

        // ── Init ─────────────────────────────────────────────
        window.addEventListener('load', () => {
            initSkyScene();
            animate();
            startTypewriter();
            lucide.createIcons();
            initReveal();
        });
    </script>

</body>
</html>
