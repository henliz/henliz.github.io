<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Henriëtta van Niekerk</title>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Inter:opsz,wght@14..32,200;14..32,300;14..32,400;14..32,500;14..32,600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&display=swap');

        @font-face {
            font-family: 'DotempDemo';
            src: url('fonts/DotempDemo.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* Mixed-font editorial classes */
        .px {
            font-family: 'DotempDemo', monospace;
            font-style: normal;
            font-weight: 400;
            font-size: 0.88em;
        }
        .di {
            font-family: 'Didot', serif;
            font-style: italic;
            font-weight: 700;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none !important;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #080c12;
            color: #f0f2f0;
            overflow: hidden;
            height: 100vh;
        }

        /* cursor:none is set on * — parent page handles the cursor */

        /* ─── Hero Layout ───────────────────────────────── */
        .hero {
            position: relative;
            width: 100vw; height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        /* 3JS canvas — fills viewport, sits at z-index 1 */
        .sky-canvas {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.85;
        }

        /* Directional dark veil — heavy left (text), fading right (photo + sky) */
        .hero-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            background:
                linear-gradient(
                    108deg,
                    rgba(5, 9, 15, 0.88) 0%,
                    rgba(5, 9, 15, 0.70) 38%,
                    rgba(5, 9, 15, 0.32) 68%,
                    rgba(5, 9, 15, 0.10) 100%
                );
        }

        /* Grid — 2-col, text | photo */
        .hero-grid {
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr auto;
            row-gap: 0;
            column-gap: 5rem;
            max-width: 1300px;
            width: 100%;
            margin: 0 auto;
            padding: 0 2.5rem;
        }
        .eyebrow-wrapper {
            align-self: end;
            padding-bottom: 0.45rem;
        }

        /* ─── Left: Text Column ─────────────────────────── */
        .hero-text {
            display: flex;
            flex-direction: column;
        }

        /* Eyebrow */
        .eyebrow {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-family: 'Didot', serif;
            font-style: italic;
            font-weight: 700;
            font-size: 0.92rem;
            letter-spacing: 0.01em;
            color: rgba(168, 218, 220, 0.55);
            margin-bottom: 1.1rem;
            flex-wrap: wrap;
        }
        .eyebrow-line {
            display: block;
            width: 28px; height: 1px;
            background: rgba(168, 218, 220, 0.35);
            flex-shrink: 0;
        }
        .eyebrow-link {
            color: rgba(240, 242, 240, 0.5);
            text-decoration: none;
            white-space: nowrap;
            transition: color 0.2s ease;
        }
        .eyebrow-link:hover { color: rgba(168, 218, 220, 0.95); }
        .link-arrow {
            display: inline-block;
            transition: transform 0.22s ease, opacity 0.22s ease;
            opacity: 0.35;
        }
        .eyebrow-link:hover .link-arrow {
            transform: translate(3px, -3px);
            opacity: 1;
        }
        .eyebrow-dot { opacity: 0.3; font-style: normal; }
        .eyebrow-prev { color: rgba(240, 242, 240, 0.28); white-space: nowrap; }

        .display-name {
            line-height: 0.90;
            margin-bottom: 1.8rem;
        }
        .name-first {
            display: block;
            font-family: 'Didot', serif;
            font-size: clamp(3.8rem, 7.2vw, 8.8rem);
            font-weight: 700;
            font-style: italic;
            color: #f0f2f0;
            letter-spacing: -0.025em;
        }
        /* extra breathing room for specific Didot chars in the name */
        .name-ls { letter-spacing: 0.03em; margin-left: 0.06em; }
        .name-last {
            display: block;
            font-family: 'Didot', serif;
            font-size: clamp(2.2rem, 4.2vw, 5.4rem);
            font-weight: 700;
            font-style: italic;
            color: rgba(240, 242, 240, 0.42);
            letter-spacing: 0.06em;
        }

        /* Gilmore Girls easter egg tagline — editorial italic pull quote */
        .tagline {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: clamp(0.88rem, 1.15vw, 1.05rem);
            font-weight: 400;
            color: rgba(168, 218, 220, 0.65);
            line-height: 1.45;
            margin-bottom: 1.4rem;
            cursor: pointer;
            position: relative;
            width: fit-content;
            max-width: 480px;
            padding: 0.3rem 0;
            transition: color 0.25s ease;
            user-select: none;
        }
        .tagline { cursor: pointer; }
        /* quotes only visible during GG phrase; star always shows */
        .quote-mark { display: none; font-style: normal; }
        .tagline.gg-active .quote-mark { display: inline; }
        .tagline:hover {
            color: rgba(168, 218, 220, 0.90);
        }
        /* Subtle underline */
        .tagline::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 1px;
            background: rgba(168, 218, 220, 0.22);
            transform: scaleX(0.35);
            transform-origin: left;
            transition: transform 0.3s ease, background 0.25s ease;
        }
        .tagline:hover::after {
            transform: scaleX(1);
            background: rgba(168, 218, 220, 0.45);
        }
        /* Easter egg star glyph */
        .tagline-star {
            display: inline-block;
            font-size: 0.62rem;
            font-style: normal;
            color: rgba(102, 252, 241, 0.4);
            vertical-align: super;
            margin-left: 0.35rem;
            transition: color 0.2s ease, transform 0.2s ease;
        }
        .tagline:hover .tagline-star {
            color: rgba(102, 252, 241, 0.85);
            transform: rotate(30deg);
        }
        /* Tooltip on hover */
        .tagline-tooltip {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 0;
            background: rgba(5, 9, 15, 0.96);
            color: rgba(240, 242, 240, 0.75);
            padding: 0.45rem 0.85rem;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-style: normal;
            font-size: 0.7rem;
            font-weight: 400;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            border: 1px solid rgba(168, 218, 220, 0.18);
            z-index: 50;
            transform: translateY(4px);
        }
        .tagline:hover .tagline-tooltip {
            opacity: 1;
            transform: translateY(0);
        }

        .typing-text {
            color: rgba(168, 218, 220, 0.85);
            border-right: 1.5px solid rgba(168, 218, 220, 0.7);
            animation: blink 1.1s infinite;
            font-weight: 400;
        }
        @keyframes blink {
            0%, 49% { border-color: rgba(168, 218, 220, 0.7); }
            50%, 100% { border-color: transparent; }
        }

        /* CTA + social row */
        .hero-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 1.1rem;
        }

        .cta-group {
            display: flex;
            gap: 0.65rem;
            align-items: center;
        }

        /* Primary CTA — pill, white fill */
        .btn-cta-primary {
            font-family: 'Inter', sans-serif;
            font-size: 0.70rem;
            font-weight: 500;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            color: #080c12;
            background: #f0f2f0;
            border: none;
            border-radius: 999px;
            padding: 0.72rem 1.75rem;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
        }
        .btn-cta-primary:hover {
            background: #a8dadc;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 218, 220, 0.22);
        }

        /* Secondary CTA — liquid glass pill */
        .btn-cta-secondary {
            font-family: 'Inter', sans-serif;
            font-size: 0.70rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(240, 242, 240, 0.60);
            background: rgba(12, 18, 28, 0.40);
            backdrop-filter: url(#hero-glass-sm) blur(3px);
            -webkit-backdrop-filter: blur(10px) saturate(150%);
            border: 1px solid rgba(240, 242, 240, 0.16);
            border-radius: 999px;
            padding: 0.72rem 1.75rem;
            cursor: pointer;
            box-shadow:
                inset 1px 1.5px 2px rgba(255,255,255,0.16),
                inset -0.5px -0.5px 1px rgba(255,255,255,0.04);
            transition: border-color 0.2s ease, color 0.2s ease, transform 0.15s ease, background 0.2s ease;
        }
        .btn-cta-secondary:hover {
            border-color: rgba(168, 218, 220, 0.45);
            color: #a8dadc;
            background: rgba(42, 157, 143, 0.12);
            transform: translateY(-2px);
        }

        /* North star CTA — same liquid glass, light-blue tint */
        .btn-cta-northstar {
            font-family: 'Inter', sans-serif;
            font-size: 0.70rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(168, 218, 220, 0.85);
            background: rgba(168, 218, 220, 0.06);
            backdrop-filter: url(#hero-glass-sm) blur(3px);
            -webkit-backdrop-filter: blur(10px) saturate(150%);
            border: 1px solid rgba(168, 218, 220, 0.28);
            border-radius: 999px;
            padding: 0.72rem 1.75rem;
            cursor: pointer;
            box-shadow:
                inset 1px 1.5px 2px rgba(168,218,220,0.1),
                inset -0.5px -0.5px 1px rgba(255,255,255,0.04);
            transition: border-color 0.2s ease, color 0.2s ease, transform 0.15s ease, background 0.2s ease;
        }
        .btn-cta-northstar:hover {
            border-color: rgba(168, 218, 220, 0.6);
            color: rgba(168, 218, 220, 1);
            background: rgba(168, 218, 220, 0.12);
            transform: translateY(-2px);
        }

        /* Social icons — minimal, quiet */
        .social-row {
            display: flex;
            gap: 0.55rem;
            align-items: center;
        }
        .social-btn {
            width: 34px; height: 34px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.09);
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
            position: relative;
        }
        .social-btn:hover {
            background: rgba(168, 218, 220, 0.10);
            border-color: rgba(168, 218, 220, 0.30);
            transform: translateY(-2px);
        }
        .social-btn i { display: flex; align-items: center; justify-content: center; }
        .social-btn svg[data-lucide] {
            width: 15px; height: 15px;
            stroke: rgba(255,255,255,0.42);
            transition: stroke 0.2s ease;
        }
        .social-btn:hover svg[data-lucide] { stroke: #a8dadc; }
        .social-btn svg.bi-discord {
            width: 15px; height: 15px;
            fill: rgba(255,255,255,0.42);
            stroke: none;
            transition: fill 0.2s ease;
        }
        .social-btn:hover svg.bi-discord { fill: #a8dadc; }
        .social-tooltip {
            position: absolute;
            bottom: calc(100% + 7px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            background: rgba(5, 9, 15, 0.97);
            color: rgba(240, 242, 240, 0.7);
            padding: 0.35rem 0.7rem;
            border-radius: 5px;
            font-family: 'Inter', sans-serif;
            font-size: 0.65rem;
            font-weight: 400;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
            border: 1px solid rgba(168, 218, 220, 0.15);
            z-index: 50;
        }
        .social-btn:hover .social-tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ─── Right: Photo Column ───────────────────────── */
        .hero-photo {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-frame {
            position: relative;
            width: 360px; height: 480px;
        }

        /* Orbit dots outside the frame */
        .orbit-container {
            position: absolute;
            inset: -28px;
            pointer-events: none;
            z-index: 0;
        }
        .orbit-dot {
            position: absolute;
            width: 7px; height: 7px;
            border-radius: 50%;
            opacity: 0.55;
        }
        .orbit-dot:nth-child(1) { top: 10%; left: 8%; background: #a8dadc; animation: orbitDot 14s linear infinite 0s; }
        .orbit-dot:nth-child(2) { top: 18%; right: 10%; background: #2a9d8f; animation: orbitDot 14s linear infinite 3.5s; }
        .orbit-dot:nth-child(3) { bottom: 14%; left: 14%; background: #457b9d; animation: orbitDot 14s linear infinite 7s; }
        .orbit-dot:nth-child(4) { bottom: 22%; right: 7%; background: #66fcf1; animation: orbitDot 14s linear infinite 10.5s; }
        @keyframes orbitDot {
            0%   { transform: rotate(0deg) translateX(45px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(45px) rotate(-360deg); }
        }

        /* The actual photo card — liquid glass container */
        .photo-inner {
            position: relative;
            width: 100%; height: 100%;
            border-radius: 18px;
            overflow: hidden;
            /* Liquid glass */
            background: rgba(12, 18, 28, 0.10);
            backdrop-filter: url(#hero-glass-lg) blur(2px);
            -webkit-backdrop-filter: blur(6px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.11);
            box-shadow:
                0 44px 88px rgba(0,0,0,0.58),
                0 10px 28px rgba(0,0,0,0.35),
                inset 1.5px 2px 4px rgba(255,255,255,0.30),
                inset -1px -1px 3px rgba(255,255,255,0.05);
            animation: floatPhoto 9s ease-in-out infinite;
            cursor: pointer;
            transition: box-shadow 0.35s ease;
            z-index: 1;
        }
        .photo-inner:hover {
            box-shadow:
                0 56px 110px rgba(0,0,0,0.64),
                0 14px 36px rgba(0,0,0,0.42),
                0 0 36px rgba(42, 157, 143, 0.14),
                inset 1.5px 2px 4px rgba(255,255,255,0.38),
                inset -1px -1px 3px rgba(255,255,255,0.07);
        }
        /* Specular crescent highlight */
        .photo-inner::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 18px;
            background: linear-gradient(138deg, rgba(255,255,255,0.13) 0%, rgba(255,255,255,0.05) 18%, transparent 40%);
            pointer-events: none;
            z-index: 3;
        }
        /* Bottom caption on hover */
        .photo-caption {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 2rem 1.2rem 1.1rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.66rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            color: rgba(240, 242, 240, 0.6);
            background: linear-gradient(to top, rgba(5,9,15,0.72) 0%, rgba(5,9,15,0.35) 55%, transparent 100%);
            z-index: 4;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-align: center;
        }
        .photo-inner:hover .photo-caption { opacity: 1; }
        .photo-inner img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            position: relative;
            z-index: 1;
        }
        .photo-fallback {
            display: none;
            width: 100%; height: 100%;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            background: rgba(42, 157, 143, 0.15);
        }
        @keyframes floatPhoto {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            35%      { transform: translateY(-11px) rotate(0.4deg); }
            68%      { transform: translateY(-5px) rotate(-0.25deg); }
        }

        /* ─── Modal (Paris / Gilmore Girls) ─────────────── */
        .modal {
            position: fixed;
            inset: 0; height: 100dvh;
            display: none;
            place-items: center;
            padding: clamp(12px, 2vw, 24px);
            background: rgba(0,0,0,0.72);
            backdrop-filter: blur(22px);
            z-index: 2147483000;
        }
        .modal.open { display: grid; }

        .modal-content {
            position: relative;
            width: min(880px, 90vw);
            max-height: min(86dvh, 880px);
            background: rgba(6, 10, 16, 0.97);
            border-radius: 18px;
            padding: clamp(14px, 2vw, 22px);
            box-shadow:
                0 28px 90px rgba(0,0,0,0.65),
                inset 1px 1.5px 3px rgba(255,255,255,0.08);
            overflow: hidden;
            border: 1px solid rgba(168, 218, 220, 0.13);
        }
        .modal-close {
            position: absolute;
            top: 14px; right: 18px;
            font-family: 'Inter', sans-serif;
            font-size: 22px; line-height: 1;
            color: rgba(240, 242, 240, 0.35);
            cursor: pointer;
            transition: color 0.2s;
            background: none; border: none;
            z-index: 5;
        }
        .modal-close:hover { color: rgba(240, 242, 240, 0.8); }
        .embed-16x9 {
            position: relative;
            width: 100%; aspect-ratio: 16/9;
            border-radius: 10px;
            overflow: hidden;
            background: #0a0a0a;
        }
        .embed-16x9 iframe {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            border: 0;
        }
        .modal-caption {
            margin-top: 1rem;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 0.92rem;
            font-weight: 400;
            color: rgba(240, 242, 240, 0.35);
            text-align: center;
            letter-spacing: 0.02em;
        }

        /* ─── Desktop: photo spans both grid rows ───────── */
        .hero-photo {
            grid-column: 2;
            grid-row: 1 / span 2;
            align-self: center;
        }

        /* ─── Mobile ────────────────────────────────────── */
        @media (max-width: 920px) {
            /*
             * padding-top on .hero (not the grid) shifts the flex centering
             * zone downward by ~navbar height, so content appears centred in
             * the visible area below the navbar — no empty padding inflating
             * the grid and creating lopsided blank space.
             */
            .hero {
                align-items: center;
                height: 100dvh;
                padding-top: 3rem;
            }
            .hero-grid {
                grid-template-columns: 1fr;
                grid-template-rows: none;
                gap: 2.5rem;
                padding: 0 1.5rem 0;
                justify-items: center;
                text-align: center;
            }
            /* order: eyebrow → photo → name+content */
            .eyebrow-wrapper { order: 1; }
            .hero-photo      { order: 2; grid-column: auto; grid-row: auto; align-self: auto; }
            .hero-text       { order: 3; align-items: center; padding-bottom: 2rem; }
            /* reset eyebrow spacing — grid gap handles it */
            .eyebrow-wrapper { padding-bottom: 0; }
            .eyebrow { margin-bottom: 0; justify-content: center; }
            /* internal spacing for mobile */
            .display-name   { margin-bottom: 1.5rem; }
            .tagline        { margin-bottom: 1.25rem; margin-left: auto; margin-right: auto; text-align: center; }
            .tagline::after { transform-origin: center; }
            .tagline-tooltip { left: 50%; transform: translateX(-50%) translateY(4px); }
            .tagline:hover .tagline-tooltip { transform: translateX(-50%) translateY(0); }
            .role-line      { margin-bottom: 1.5rem; }
            .eyebrow        { justify-content: center; }
            .hero-actions   { align-items: center; gap: 1rem; }
            .cta-group      { flex-wrap: wrap; justify-content: center; gap: 0.65rem; }
            .social-row     { justify-content: center; }
            .photo-frame    { width: 220px; height: 285px; }
        }

        @media (max-width: 480px) {
            .name-first  { font-size: 2.8rem; }
            .name-last   { font-size: 2.0rem; }
            .hero-overlay { background: rgba(5,9,15,0.78); }
            .photo-frame { width: 175px; height: 228px; }
        }

        /* ─── Reveal Canvas ─────────────────────────────── */
        .reveal-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        /* Respect reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .photo-inner { animation: none; }
            .orbit-dot   { animation: none; }
            .typing-text { animation: none; border-right-color: #a8dadc; }
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.module.js"
        }
    }
    </script>

    <script>
        function openParisModal() {
            document.getElementById('parisModal').classList.add('open');
        }
        function closeParisModal() {
            const modal  = document.getElementById('parisModal');
            const iframe = document.getElementById('parisVideo');
            modal.classList.remove('open');
            iframe.src = iframe.src; // reset video
        }
        function handleTaglineClick() {
            openParisModal();
        }
        window.onclick = function(e) {
            if (e.target === document.getElementById('parisModal')) closeParisModal();
        };
    </script>
</head>
<body>

    <!-- ── SVG Liquid Glass Filters ──────────────────────── -->
    <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
        <defs>
            <!-- For larger elements (photo frame) -->
            <filter id="hero-glass-lg" x="-5%" y="-5%" width="110%" height="110%"
                    color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency="0.007 0.005"
                              numOctaves="3" seed="42" result="noise"/>
                <feGaussianBlur in="noise" stdDeviation="9" result="lensMap"/>
                <feDisplacementMap in="SourceGraphic" in2="lensMap"
                                   scale="26" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
            <!-- For small chips / pills -->
            <filter id="hero-glass-sm" x="-10%" y="-40%" width="120%" height="180%"

    <script type="module">
        import * as THREE from "three";
        import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/loaders/GLTFLoader.js";

        // ── Wheel relay → parent (Lenis) ─────────────────────
        window.addEventListener('wheel', e => {
          window.parent.dispatchEvent(new WheelEvent('wheel',{
            deltaY:e.deltaY, deltaX:e.deltaX, deltaMode:e.deltaMode,
            bubbles:true, cancelable:true
          }));
        }, {passive:true});

        // ── Cursor relay → parent ────────────────────────────
        document.addEventListener('mousemove', (e) => {
            window.parent.postMessage({ type: 'iframeMouse', x: e.clientX, y: e.clientY }, '*');
        });
        document.addEventListener('mousedown',  () => window.parent.postMessage({ type: 'iframeDown' }, '*'));
        document.addEventListener('mouseup',    () => window.parent.postMessage({ type: 'iframeUp' }, '*'));
        document.addEventListener('mouseleave', () => window.parent.postMessage({ type: 'iframeLeave' }, '*'));

        document.querySelectorAll(
            '.eyebrow-link, .social-btn, .photo-inner, #taglineMerged, .btn-cta-primary, .btn-cta-secondary, .btn-cta-northstar, .modal-close'
        ).forEach(el => {
            el.addEventListener('mouseenter', () => window.parent.postMessage({ type: 'iframeHover', on: true }, '*'));
            el.addEventListener('mouseleave', () => window.parent.postMessage({ type: 'iframeHover', on: false }, '*'));
        });

        // ── Three.js Sky Scene ───────────────────────────────
        let scene, camera, renderer, skyMesh;
        const clock = new THREE.Clock();

        function initSkyScene() {
            scene    = new THREE.Scene();
            camera   = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 12);

            const canvas = document.getElementById('skyCanvas');
            renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            scene.add(new THREE.AmbientLight(0xffffff, 3));

            const loader = new GLTFLoader();
            loader.load('./models/skyblue.glb', (gltf) => {
                skyMesh = gltf.scene;
                skyMesh.scale.set(5, 5, 5);

                skyMesh.traverse((child) => {
                    if (child.isMesh) {
                        if (gltf.parser?.json?.textures) {
                            gltf.parser.loadTexture(0).then(tex => {
                                child.material.map = tex;
                                child.material.color.setHex(0xffffff);
                                child.material.transparent = false;
                                child.material.opacity = 1;
                                child.material.needsUpdate = true;
                            });
                        } else {
                            child.material = new THREE.MeshBasicMaterial({ color: 0x87CEEB });
                        }
                    }
                });

                scene.add(skyMesh);
                signalHeroReady();
            }, undefined, () => {
                // Fallback sphere
                const geo = new THREE.SphereGeometry(1, 32, 32);
                const cols = [];
                for (let i = 0; i < geo.attributes.position.count; i++) cols.push(0.3, 0.6, 1);
                geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
                skyMesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true }));
                scene.add(skyMesh);
                signalHeroReady();
            });
        }

        function signalHeroReady() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'heroReady' }, '*');
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            if (skyMesh) {
                skyMesh.rotation.y = t * 0.02;
                skyMesh.rotation.x = Math.sin(t * 0.03) * 0.1;
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);

        // ── Typewriter ───────────────────────────────────────
        function startTypewriter() {
            const phrases = [
                { text: 'turns caffeine into shipped products',                    gg: false },
                { text: 'has won hackathons and game jams',                         gg: false },
                { text: 'speaks design AND engineering fluently',                   gg: false },
                { text: 'makes mischief, then deploys it',                         gg: false },
                { text: 'probably has 47 browser tabs open',                       gg: false },
                { text: 'was featured on CTV x3 in 2025 for skrimp',              gg: false },
                { text: 'gets more done before 9am than other people do all day',  gg: true  },
            ];
            let current = 0;
            const el      = document.getElementById('typingText');
            const tagline = document.getElementById('taglineMerged');
            if (!el) { setTimeout(startTypewriter, 500); return; }

            function setGGMode(isGG) {
                if (!tagline) return;
                if (isGG) tagline.classList.add('gg-active');
                else      tagline.classList.remove('gg-active');
            }

            function type(phrase, cb) {
                let i = 0; el.textContent = '';
                setGGMode(phrase.gg);
                (function tick() {
                    if (i < phrase.text.length) { el.textContent += phrase.text[i++]; setTimeout(tick, 58 + Math.random() * 42); }
                    else setTimeout(cb, 2400);
                })();
            }
            function del(cb) {
                (function tick() {
                    if (el.textContent.length > 0) { el.textContent = el.textContent.slice(0,-1); setTimeout(tick, 28 + Math.random() * 22); }
                    else { setGGMode(false); setTimeout(cb, 480); }
                })();
            }
            function cycle() {
                type(phrases[current], () => del(() => {
                    current = (current + 1) % phrases.length;
                    setTimeout(cycle, 180);
                }));
            }
            cycle();
        }

        // ── Reeded Glass + Interactive Shard Break ────────────
        function initReveal() {
            const photoInner   = document.getElementById('photoInner');
            const revealCanvas = document.getElementById('revealCanvas');
            const photoCaption = document.getElementById('photoCaption');
            if (!revealCanvas) return;

            const rCtx    = revealCanvas.getContext('2d');
            const heroImg = photoInner.querySelector('img');
            const isMobile = () => window.matchMedia('(hover: none) and (pointer: coarse)').matches;

            const fairchildImg = new Image();
            fairchildImg.src   = './fairchild.png';

            let cw = 0, ch = 0;
            let coverCanvas = null, revealCover = null, reedCanvas = null;

            const REED_W   = 18;
            const AMP      = 6;
            const ZONE_R   = 118;   // crack hole radius
            const N_SHARDS = 8;     // accent shard count

            function sizeCanvas() {
                cw = photoInner.offsetWidth;
                ch = photoInner.offsetHeight;
                revealCanvas.width  = cw;
                revealCanvas.height = ch;
                coverCanvas = null; revealCover = null; reedCanvas = null;
            }

            function buildCoverFit(img) {
                if (!img.complete || !img.naturalWidth || !cw || !ch) return null;
                const c = document.createElement('canvas');
                c.width = cw; c.height = ch;
                const oc = c.getContext('2d');
                const sc = Math.max(cw / img.naturalWidth, ch / img.naturalHeight);
                const ox = (cw - img.naturalWidth  * sc) / 2;
                const oy = (ch - img.naturalHeight * sc) / 2;
                oc.drawImage(img, ox, oy, img.naturalWidth * sc, img.naturalHeight * sc);
                return c;
            }

            function buildReedCanvas() {
                if (!coverCanvas || !cw || !ch) return null;
                const c = document.createElement('canvas');
                c.width = cw; c.height = ch;
                const rc = c.getContext('2d');
                // Frosted blurred substrate
                rc.filter = 'blur(3.5px)';
                rc.drawImage(coverCanvas, 0, 0);
                rc.filter = 'none';
                // Reed displacement at partial opacity
                rc.globalAlpha = 0.52;
                const STRIP = 2;
                for (let x = 0; x < cw; x += STRIP) {
                    const w    = Math.min(STRIP, cw - x);
                    const t    = (x % REED_W) / REED_W;
                    const disp = Math.sin(t * Math.PI * 2) * AMP;
                    const sx   = Math.max(0, Math.min(cw - w, x + disp));
                    rc.drawImage(coverCanvas, sx, 0, w, ch, x, 0, w, ch);
                }
                rc.globalAlpha = 1.0;
                // Frost veil
                rc.fillStyle = 'rgba(210,235,248,0.32)';
                rc.fillRect(0, 0, cw, ch);
                // Subtle reed lines
                rc.strokeStyle = 'rgba(255,255,255,0.18)'; rc.lineWidth = 0.6;
                for (let x = 0; x < cw; x += REED_W) {
                    rc.beginPath(); rc.moveTo(x, 0); rc.lineTo(x, ch); rc.stroke();
                }
                rc.strokeStyle = 'rgba(0,0,0,0.09)'; rc.lineWidth = 0.8;
                for (let x = REED_W * 0.55; x < cw; x += REED_W) {
                    rc.beginPath(); rc.moveTo(x, 0); rc.lineTo(x, ch); rc.stroke();
                }
                return c;
            }

            // Jagged burst shape for the crack hole — generated once per hover
            function buildCrackPts() {
                const SPIKES = 9;
                const pts = [];
                for (let i = 0; i < SPIKES * 2; i++) {
                    const baseAngle = (i / (SPIKES * 2)) * Math.PI * 2;
                    const isOuter   = (i % 2 === 0);
                    pts.push({
                        angle:  baseAngle + (Math.random() - 0.5) * (Math.PI / SPIKES) * 0.6,
                        rScale: isOuter
                            ? 0.78 + Math.random() * 0.18   // subtle spike tip
                            : 0.50 + Math.random() * 0.18   // shallow notch
                    });
                }
                return pts;
            }

            // Hairline crack lines radiating from the hole
            function buildCrackLines() {
                const N = 9;
                const lines = [];
                for (let i = 0; i < N; i++) {
                    const angle = (i / N) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
                    lines.push({
                        angle,
                        startScale: 0.42 + Math.random() * 0.28,
                        len:        ZONE_R * (0.38 + Math.random() * 0.60),
                        kinkT:      0.25 + Math.random() * 0.50,
                        kinkAngle:  angle + (Math.random() - 0.5) * 0.45,
                    });
                }
                return lines;
            }

            // Irregular triangle/quad accent shards — NOT a grid
            function buildAccentShardPoly() {
                const size = 16 + Math.random() * 26;
                const nPts = Math.random() < 0.55 ? 3 : (Math.random() < 0.65 ? 4 : 5);
                const pts  = [];
                for (let i = 0; i < nPts; i++) {
                    const base   = (i / nPts) * Math.PI * 2;
                    const jitter = (Math.random() - 0.5) * (Math.PI / nPts) * 1.1;
                    const r      = size * (0.40 + Math.random() * 0.60);
                    pts.push([Math.cos(base + jitter) * r, Math.sin(base + jitter) * r]);
                }
                return { pts, size };
            }

            function buildAccentShards() {
                const shards = [];
                for (let i = 0; i < N_SHARDS; i++) {
                    const { pts, size } = buildAccentShardPoly();
                    shards.push({
                        poly:       pts,
                        size,
                        orbitAngle: (i / N_SHARDS) * Math.PI * 2 + (Math.random() - 0.5) * 0.5,
                        orbitDist:  ZONE_R * (0.72 + Math.random() * 0.52),
                        px: -9999, py: -9999,
                        rot:        Math.random() * Math.PI * 2,
                        rotSpeed:   (Math.random() - 0.5) * 0.006,
                        phase:      Math.random() * Math.PI * 2,
                        freq:       0.32 + Math.random() * 0.28,
                        wobAmp:     3 + Math.random() * 6,
                    });
                }
                return shards;
            }

            // Append jagged hole path — wobbles over time, slowly rotates
            function appendHolePath(cx, cy, r) {
                crackPts.forEach((pt, i) => {
                    const wob   = 0.055 * Math.sin(renderNow * 0.65 + i * 0.8);
                    const angle = pt.angle + rotOffset;
                    const scale = pt.rScale + wob;
                    const x = cx + Math.cos(angle) * scale * r;
                    const y = cy + Math.sin(angle) * scale * r;
                    if (i === 0) rCtx.moveTo(x, y); else rCtx.lineTo(x, y);
                });
                rCtx.closePath();
            }

            let crackPts    = [];
            let crackLines  = [];
            let accentShards = [];
            let holeR       = 0;
            let holeTarget  = 0;
            let rotOffset   = 0;   // slow rotation of hole shape
            let renderNow   = 0;   // current time passed to render each frame
            let mx = -999, my = -999, hovering = false, animating = false;

            function render() {
                if (!reedCanvas) return;
                rCtx.clearRect(0, 0, cw, ch);

                const fb = revealCover || coverCanvas;

                // 1. Draw frosted glass first (full canvas)
                rCtx.drawImage(reedCanvas, 0, 0);

                // 2. Punch soft melty hole — destination-out erases glass pixels
                rCtx.save();
                rCtx.globalCompositeOperation = 'destination-out';
                rCtx.filter = 'blur(14px)';
                rCtx.beginPath();
                appendHolePath(mx, my, holeR * 0.82);
                rCtx.fillStyle = `rgba(0,0,0,${Math.min(1, holeR / ZONE_R * 1.3).toFixed(3)})`;
                rCtx.fill();
                rCtx.filter = 'none';
                rCtx.restore();

                // 3. Draw fairchild BEHIND — destination-over only fills the transparent hole
                rCtx.save();
                rCtx.globalCompositeOperation = 'destination-over';
                rCtx.drawImage(fb, 0, 0);
                rCtx.restore();

                if (holeR < 2) return;

                const t = holeR / ZONE_R;

                // 4. Chromatic aberration on the reveal — screen blend with offset copies
                //    screen on the light glass = near-invisible; on dark fairchild pixels = vivid fringe
                const caX = 2.8 * t;
                rCtx.save();
                rCtx.globalCompositeOperation = 'screen';
                rCtx.globalAlpha = 0.18 * t;
                rCtx.filter = 'saturate(8) hue-rotate(-38deg)';   // red fringe right
                rCtx.drawImage(fb, caX, 0);
                rCtx.filter = 'saturate(8) hue-rotate(188deg)';   // cyan fringe left
                rCtx.drawImage(fb, -caX, 0);
                rCtx.filter = 'none';
                rCtx.restore();

                // 5. Soft glow at hole edge (blurred stroke, not sharp)
                rCtx.save();
                rCtx.filter = 'blur(3px)';
                rCtx.beginPath();
                appendHolePath(mx, my, holeR * 0.85);
                rCtx.strokeStyle = `rgba(255,255,255,${(0.35 * t).toFixed(3)})`;
                rCtx.lineWidth = 4;
                rCtx.stroke();
                rCtx.filter = 'none';
                rCtx.restore();

                // 4. Hairline crack lines
                crackLines.forEach(cl => {
                    const startR = cl.startScale * holeR;
                    const endR   = startR + cl.len * t;
                    const midR   = startR + (endR - startR) * cl.kinkT;
                    rCtx.beginPath();
                    rCtx.moveTo(mx + Math.cos(cl.angle)     * startR,
                                my + Math.sin(cl.angle)     * startR);
                    rCtx.lineTo(mx + Math.cos(cl.kinkAngle) * midR,
                                my + Math.sin(cl.kinkAngle) * midR);
                    rCtx.lineTo(mx + Math.cos(cl.angle)     * endR,
                                my + Math.sin(cl.angle)     * endR);
                    rCtx.strokeStyle = `rgba(255,255,255,${(0.38 * t).toFixed(3)})`;
                    rCtx.lineWidth   = 0.65;
                    rCtx.stroke();
                });

                // 6. Floating accent shards
                accentShards.forEach(s => {
                    if (s.px < -900) return;
                    const wobX = Math.sin(renderNow * s.freq + s.phase)              * s.wobAmp;
                    const wobY = Math.cos(renderNow * s.freq * 0.72 + s.phase + 1.1) * s.wobAmp * 0.65;
                    const px   = s.px + wobX;
                    const py   = s.py + wobY;
                    const sz   = s.size;
                    const alpha = Math.min(0.90, t * 1.1);
                    const srcX  = Math.max(0, Math.min(cw - sz, px - sz * 0.5));
                    const srcY  = Math.max(0, Math.min(ch - sz, py - sz * 0.5));

                    // Clipped glass content
                    rCtx.save();
                    rCtx.globalAlpha = alpha;
                    rCtx.translate(px, py);
                    rCtx.rotate(s.rot);
                    rCtx.beginPath();
                    rCtx.moveTo(s.poly[0][0], s.poly[0][1]);
                    for (let k = 1; k < s.poly.length; k++) rCtx.lineTo(s.poly[k][0], s.poly[k][1]);
                    rCtx.closePath();
                    rCtx.clip();
                    rCtx.drawImage(reedCanvas, srcX, srcY, sz, sz, -sz * 0.5, -sz * 0.5, sz, sz);
                    // Frost
                    rCtx.fillStyle = 'rgba(225,240,252,0.24)';
                    rCtx.fillRect(-sz, -sz, sz * 2, sz * 2);
                    // Sheen
                    const g = rCtx.createLinearGradient(-sz * 0.5, -sz * 0.5, sz * 0.5, sz * 0.5);
                    g.addColorStop(0,   'rgba(255,255,255,0.38)');
                    g.addColorStop(0.4, 'rgba(255,255,255,0.04)');
                    g.addColorStop(1,   'rgba(0,0,0,0.14)');
                    rCtx.fillStyle = g;
                    rCtx.fillRect(-sz, -sz, sz * 2, sz * 2);
                    rCtx.restore();

                    // Edge glint
                    rCtx.save();
                    rCtx.globalAlpha = alpha;
                    rCtx.translate(px, py);
                    rCtx.rotate(s.rot);
                    rCtx.beginPath();
                    rCtx.moveTo(s.poly[0][0], s.poly[0][1]);
                    for (let k = 1; k < s.poly.length; k++) rCtx.lineTo(s.poly[k][0], s.poly[k][1]);
                    rCtx.closePath();
                    rCtx.strokeStyle = 'rgba(255,255,255,0.82)';
                    rCtx.lineWidth   = 0.9;
                    rCtx.stroke();
                    rCtx.restore();
                });
            }

            function tick() {
                let moving = false;
                renderNow = performance.now() * 0.001;

                // Slowly rotate the hole shape
                rotOffset += 0.003;

                // Animate hole open/close
                const dHole = holeTarget - holeR;
                if (Math.abs(dHole) > 0.4) {
                    holeR += dHole * 0.10;
                    moving = true;
                } else {
                    holeR = holeTarget;
                    if (holeTarget > 0) moving = true;
                }

                // Update accent shard positions
                if (holeR > 1 && mx > -900) {
                    const t = Math.min(1, holeR / ZONE_R);
                    accentShards.forEach(s => {
                        const tx = mx + Math.cos(s.orbitAngle) * s.orbitDist * t;
                        const ty = my + Math.sin(s.orbitAngle) * s.orbitDist * t;
                        if (s.px < -900) { s.px = tx; s.py = ty; }
                        s.px += (tx - s.px) * 0.07;
                        s.py += (ty - s.py) * 0.07;
                        s.rot += s.rotSpeed;
                    });
                }

                render();
                if (moving || hovering) requestAnimationFrame(tick);
                else animating = false;
            }

            function startAnim() {
                if (!animating) { animating = true; requestAnimationFrame(tick); }
            }

            function show() {
                sizeCanvas();
                coverCanvas = buildCoverFit(heroImg);
                if (!coverCanvas) { heroImg.addEventListener('load', show, { once: true }); return; }
                reedCanvas  = buildReedCanvas();
                revealCover = buildCoverFit(fairchildImg);
                if (!revealCover) {
                    fairchildImg.addEventListener('load', () => {
                        revealCover = buildCoverFit(fairchildImg);
                    }, { once: true });
                }
                crackPts     = buildCrackPts();
                crackLines   = buildCrackLines();
                accentShards = buildAccentShards();
                hovering    = true;
                holeTarget  = ZONE_R;
                revealCanvas.style.opacity = '1';
                startAnim();
            }

            function hide() {
                hovering   = false;
                holeTarget = 0;
                mx = -999; my = -999;
                startAnim();
                setTimeout(() => { if (!hovering) revealCanvas.style.opacity = '0'; }, 700);
            }

            if (!isMobile()) {
                photoInner.addEventListener('mouseenter', show);
                photoInner.addEventListener('mousemove', e => {
                    const rect = photoInner.getBoundingClientRect();
                    mx = e.clientX - rect.left;
                    my = e.clientY - rect.top;
                    startAnim();
                });
                photoInner.addEventListener('mouseleave', hide);
                photoInner.addEventListener('click', () => {
                    window.open('https://www.linkedin.com/in/henriettavanniekerk', '_blank');
                });
            }

            if (isMobile()) {
                let revealed = false;
                photoInner.addEventListener('click', e => {
                    e.preventDefault();
                    revealed = !revealed;
                    if (revealed) {
                        mx = cw * 0.5; my = ch * 0.4;
                        show();
                        photoCaption.textContent = '\u2728 tap to clear';
                    } else {
                        hide();
                        photoCaption.textContent = '\u2728 chaotic mastermind behind the magic';
                    }
                });
            }

            window.addEventListener('resize', () => {
                sizeCanvas();
                if (hovering) {
                    reedCanvas   = buildReedCanvas();
                    crackPts     = buildCrackPts();
                    crackLines   = buildCrackLines();
                    accentShards = buildAccentShards();
                    render();
                }
            });
        }

        // ── Init ─────────────────────────────────────────────
        window.addEventListener('load', () => {
            initSkyScene();
            animate();
            startTypewriter();
            lucide.createIcons();
            initReveal();
        });
    </script>

</body>
</html>
