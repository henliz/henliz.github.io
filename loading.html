<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading... ✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap');

        @font-face {
            font-family: 'DotempDemo';
            src: url('fonts/DotempDemo.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        .px {
            font-family: 'DotempDemo', monospace;
            font-style: normal;
            font-weight: 400;
            font-size: 0.88em;
        }
        .di {
            font-family: 'Didot', serif;
            font-style: italic;
            font-weight: 700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            background: #080c12;
            color: #f1faee;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        @media (hover: hover) and (pointer: fine) {
            body { cursor: none !important; }
            *, *::before, *::after { cursor: none !important; }
        }

        /* Custom Cursor */
        .custom-cursor {
            position: fixed;
            width: 18px;
            height: 18px;
            background: rgba(102, 252, 241, 0.15);
            border: 1.5px solid rgba(102, 252, 241, 0.65);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            backdrop-filter: blur(6px);
            transition: width 0.15s ease, height 0.15s ease, background 0.15s ease, transform 0.08s ease-out;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.25);
            display: none;
        }
        @media (hover: hover) and (pointer: fine) {
            .custom-cursor { display: block; }
        }

        /* Matrix canvas — full viewport, behind everything */
        #matrix-canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0.75;
        }

        .loading-container {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(8, 12, 18, 0.18);
            backdrop-filter: blur(38px);
            -webkit-backdrop-filter: blur(38px);
            border-radius: 32px;
            padding: 3rem 2.5rem;
            border: 1px solid rgba(168, 218, 220, 0.22);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                inset 0 0 30px rgba(168, 218, 220, 0.04);
            max-width: 500px;
            width: 90%;
            animation: floatContainer 6s ease-in-out infinite;
            opacity: 1;
            transition: all 0.8s ease-out;
        }

        @keyframes floatContainer {
            0%, 100% { transform: translateY(0px); }
            50%       { transform: translateY(-10px); }
        }

        .vaporeon-container {
            position: relative;
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .vaporeon-gif {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid rgba(168, 218, 220, 0.4);
            box-shadow:
                0 0 30px rgba(42, 157, 143, 0.3),
                inset 0 2px 4px rgba(255, 255, 255, 0.1);
            animation: vaporeonFloat 4s ease-in-out infinite;
            background: rgba(168, 218, 220, 0.1);
            object-fit: cover;
        }

        @keyframes vaporeonFloat {
            0%, 100% {
                transform: translateY(0px) scale(1);
                box-shadow: 0 0 30px rgba(42, 157, 143, 0.3), inset 0 2px 4px rgba(255,255,255,0.1);
            }
            50% {
                transform: translateY(-8px) scale(1.02);
                box-shadow: 0 0 40px rgba(42, 157, 143, 0.5), inset 0 2px 4px rgba(255,255,255,0.15);
            }
        }

        .sparkles {
            position: absolute;
            width: 200px;
            height: 200px;
            pointer-events: none;
        }

        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: linear-gradient(45deg, #66fcf1, #a8dadc);
            border-radius: 50%;
            animation: sparkleFloat 3s ease-in-out infinite;
            opacity: 0.7;
            box-shadow: 0 0 8px rgba(102, 252, 241, 0.5);
        }
        .sparkle:nth-child(1) { top: 20%; left: 15%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 30%; right: 20%; animation-delay: 0.5s; }
        .sparkle:nth-child(3) { bottom: 25%; left: 25%; animation-delay: 1s; }
        .sparkle:nth-child(4) { bottom: 35%; right: 15%; animation-delay: 1.5s; }
        .sparkle:nth-child(5) { top: 50%; left: 5%; animation-delay: 2s; }
        .sparkle:nth-child(6) { top: 15%; right: 5%; animation-delay: 2.5s; }

        @keyframes sparkleFloat {
            0%, 100% { transform: translateY(0px) scale(1); opacity: 0.35; }
            50%       { transform: translateY(-14px) scale(1.2); opacity: 0.9; }
        }

        .loading-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.6rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            background: linear-gradient(45deg, #f1faee, #a8dadc, #66fcf1, #2a9d8f);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 8s ease infinite;
            margin-bottom: 0.9rem;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .loading-message {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.25rem;
            font-weight: 400;
            color: #a8dadc;
            margin-bottom: 1.5rem;
            opacity: 0.9;
            letter-spacing: 0.01em;
        }

        .easter-egg-hint {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            font-weight: 300;
            color: #66fcf1;
            opacity: 0.75;
            font-style: italic;
            margin-bottom: 2rem;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(168, 218, 220, 0.08);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(168, 218, 220, 0.18);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #2a9d8f, #66fcf1, #a8dadc);
            background-size: 200% 100%;
            border-radius: 10px;
            width: 0%;
            animation: progressShimmer 2s ease-in-out infinite;
            box-shadow: 0 0 12px rgba(42, 157, 143, 0.4);
            transition: width 0.3s ease;
        }

        @keyframes progressShimmer {
            0%   { background-position: -200% 0; }
            100% { background-position:  200% 0; }
        }

        .loading-percentage {
            font-family: 'DotempDemo', monospace;
            font-size: 1rem;
            color: #66fcf1;
            margin-top: 0.9rem;
            letter-spacing: 0.12em;
            opacity: 0.85;
        }

        @media (max-width: 768px) {
            .loading-container { padding: 2.5rem 2rem; }
            .loading-title { font-size: 2.1rem; }
            .loading-message { font-size: 1.1rem; }
            .vaporeon-gif { width: 100px; height: 100px; }
        }

        .loaded {
            opacity: 0;
            visibility: hidden;
            transition: all 0.8s ease-out;
        }
    </style>
</head>
<body>
    <div class="custom-cursor" id="cursor"></div>

    <canvas id="matrix-canvas"></canvas>

    <div class="loading-container" id="loadingContainer">
        <div class="vaporeon-container">
            <div class="sparkles">
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
            </div>
            <img
                src="./loading.gif"
                alt="Loading Animation"
                class="vaporeon-gif"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
            >
            <div style="display:none; width:120px; height:120px; border-radius:50%; background:linear-gradient(45deg,#4FC3F7,#29B6F6,#0288D1); align-items:center; justify-content:center; font-size:3rem; border:3px solid rgba(168,218,220,0.4); animation:vaporeonFloat 4s ease-in-out infinite;">
                🌊
            </div>
        </div>

        <h1 class="loading-title"><span class="px">Loa</span>ding <span class="di">Magic</span>...</h1>
        <p class="loading-message" id="loadingMessage">Preparing your <span class="di">chaotic</span> experience ✨</p>
        <p class="easter-egg-hint" id="easterEggHint">
            💫 Hover around my site to discover nostalgic easter eggs!
        </p>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="loading-percentage" id="loadingPercentage">0%</div>
    </div>

    <script>
        // ── Cursor ────────────────────────────────────────────
        const cursor = document.getElementById('cursor');
        let mouseX = 0, mouseY = 0, animationId;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX; mouseY = e.clientY;
            if (!animationId) animationId = requestAnimationFrame(() => {
                cursor.style.left = mouseX + 'px';
                cursor.style.top  = mouseY + 'px';
                animationId = null;
            });
        });
        document.addEventListener('mousedown',  () => cursor.classList.add('clicking'));
        document.addEventListener('mouseup',    () => cursor.classList.remove('clicking'));
        document.addEventListener('mouseleave', () => cursor.style.opacity = '0');
        document.addEventListener('mouseenter', () => cursor.style.opacity = '1');

        // ── Matrix Rain ───────────────────────────────────────
        const matCanvas = document.getElementById('matrix-canvas');
        const mCtx = matCanvas.getContext('2d');

        const FONT_SIZE = 16;
        const COL_W     = 18;
        const TRAIL_LEN = 22;

        // Charset: code-feel ASCII — DotempDemo pixel font renders these great
        const CHARSET = 'abcdefghijklmnopqrstuvwxyz0123456789{}[]<>/|\\#$@!;:=+-*%^&~';
        const randChar = () => CHARSET[Math.floor(Math.random() * CHARSET.length)];

        // Per-column state: head position + per-row character cache
        let cols = [];

        function initMatrix() {
            matCanvas.width  = window.innerWidth;
            matCanvas.height = window.innerHeight;
            mCtx.fillStyle = '#080c12';
            mCtx.fillRect(0, 0, matCanvas.width, matCanvas.height);

            const numCols = Math.floor(matCanvas.width / COL_W);
            const numRows = Math.ceil(matCanvas.height / FONT_SIZE) + 4;

            cols = Array.from({ length: numCols }, () => ({
                // 65% start already on-screen, 35% stagger in from above
                head: Math.random() < 0.65
                    ? Math.floor(Math.random() * numRows)
                    : -Math.floor(Math.random() * 18),
                chars: Array.from({ length: numRows }, randChar)
            }));
        }

        // Depth-to-colour: white head → bright cyan → teal → dark → invisible
        const DEPTH_COLOURS = [
            { color: '#f0ffff', alpha: 0.97 },  // 0  head
            { color: '#c8fef8', alpha: 0.88 },  // 1
            { color: '#66fcf1', alpha: 0.78 },  // 2
            { color: '#3dbdb7', alpha: 0.65 },  // 3
            { color: '#2a9d8f', alpha: 0.52 },  // 4
            { color: '#2a9d8f', alpha: 0.40 },  // 5
            { color: '#1e7a72', alpha: 0.30 },  // 6
            { color: '#1e7a72', alpha: 0.22 },  // 7
            { color: '#12504a', alpha: 0.15 },  // 8
            { color: '#0d3530', alpha: 0.10 },  // 9
            { color: '#0d3530', alpha: 0.07 },  // 10
            { color: '#0d3530', alpha: 0.04 },  // 11
        ];

        function depthStyle(d) {
            if (d < DEPTH_COLOURS.length) return DEPTH_COLOURS[d];
            // beyond lookup — exponential fade to nothing
            return { color: '#0d3530', alpha: Math.max(0, 0.03 - (d - DEPTH_COLOURS.length) * 0.003) };
        }

        function drawMatrix() {
            // Thin dark veil — fades previous frame gently
            mCtx.fillStyle = 'rgba(8, 12, 18, 0.08)';
            mCtx.fillRect(0, 0, matCanvas.width, matCanvas.height);

            mCtx.font      = `${FONT_SIZE}px DotempDemo, monospace`;
            mCtx.textAlign = 'left';

            const numRows = cols[0]?.chars.length ?? 0;

            for (let i = 0; i < cols.length; i++) {
                const col  = cols[i];
                const x    = i * COL_W;
                const head = Math.floor(col.head);

                // Head row: always a fresh random char
                if (head >= 0 && head < numRows) {
                    col.chars[head] = randChar();
                }

                // Glitch: ~3% chance per frame to scramble a random trail char
                if (Math.random() < 0.03) {
                    const gRow = head - 1 - Math.floor(Math.random() * (TRAIL_LEN - 1));
                    if (gRow >= 0 && gRow < numRows) col.chars[gRow] = randChar();
                }

                // Draw trail from head down to TRAIL_LEN behind
                for (let d = 0; d < TRAIL_LEN; d++) {
                    const row = head - d;
                    if (row < 0 || row >= numRows) continue;
                    const y = row * FONT_SIZE;
                    if (y > matCanvas.height) continue;

                    const { color, alpha } = depthStyle(d);
                    if (alpha < 0.005) continue;

                    mCtx.globalAlpha = alpha;
                    mCtx.fillStyle   = color;
                    mCtx.fillText(col.chars[row], x, y + FONT_SIZE);
                }

                mCtx.globalAlpha = 1;

                // Advance head one row per tick
                col.head++;

                // Reset after fully scrolled off + random delay
                if ((head - TRAIL_LEN) * FONT_SIZE > matCanvas.height && Math.random() > 0.975) {
                    col.head  = -Math.floor(Math.random() * 25);
                    // Randomise all chars in this column for variety
                    col.chars = col.chars.map(randChar);
                }
            }
        }

        // ── Progress & loading logic ──────────────────────────
        let totalProgress = 0;

        function updateProgress(progress) {
            totalProgress = Math.min(progress, 100);
            document.getElementById('progressBar').style.width      = totalProgress + '%';
            document.getElementById('loadingPercentage').textContent = Math.floor(totalProgress) + '%';
            if (totalProgress >= 100) finishLoading();
        }

        function finishLoading() {
            setTimeout(() => {
                document.getElementById('loadingContainer').classList.add('loaded');
                setTimeout(() => { window.location.href = './index.html?loaded=true'; }, 800);
            }, 1000);
        }

        async function preloadHeroAssets() {
            const models = [
                './models/skyblue.glb',
                './models/yummymeal.glb',
                './models/steamdeck.glb',
                './models/jaguar.glb',
                './models/laptop.glb',
            ];
            for (let i = 0; i < models.length; i++) {
                try { await fetch(models[i]); } catch (e) {}
                updateProgress(35 + ((i + 1) / models.length) * 60);
            }
            updateProgress(100);
        }

        const loadingMessages = [
            'Preparing your <span class="di">chaotic</span> experience ✨',
            'Summoning <span class="di">digital</span> nostalgia 🌈',
            '<span class="px">load</span>ing pixels with love 💖',
            'Brewing some <span class="di">coding</span> magic ⚡',
            'Organising <span class="di">beautiful</span> chaos 🎨',
            'Awakening the <span class="di">3D sky</span> ☁️',
            'Calibrating <span class="di">liquid glass</span> 🌊',
        ];

        function cycleLoadingMessages() {
            const el = document.getElementById('loadingMessage');
            let idx = 0;
            setInterval(() => {
                if (totalProgress >= 100) {
                    el.innerHTML = 'Ready to <span class="di">explore</span>! 🎉';
                    return;
                }
                idx = (idx + 1) % loadingMessages.length;
                el.innerHTML = loadingMessages[idx];
            }, 1500);
        }

        function startLoading() {
            updateProgress(10);
            if (document.fonts) {
                document.fonts.ready.then(() => { updateProgress(30); preloadHeroAssets(); });
            } else {
                setTimeout(() => { updateProgress(30); preloadHeroAssets(); }, 500);
            }
        }

        function updateEasterEggHint() {
            const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            document.getElementById('easterEggHint').textContent = isTouchDevice
                ? '💫 Tap around my site to discover nostalgic easter eggs!'
                : '💫 Hover around my site to discover nostalgic easter eggs!';
        }

        // ── Init ──────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            initMatrix();
            window.addEventListener('resize', initMatrix);
            // Start immediately — canvas re-reads ctx.font every frame,
            // so DotempDemo kicks in automatically once it loads
            setInterval(drawMatrix, 55); // ~18 fps — chunky pixel feel

            updateEasterEggHint();
            cycleLoadingMessages();
            startLoading();
        });
    </script>
</body>
</html>
