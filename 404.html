<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#dbe7ec;color:#12181f;
       font-family:'Montserrat',system-ui,-apple-system,sans-serif;text-align:center;padding:2rem}
  h1{font-size:clamp(1.4rem,4vw,2rem);margin:0 0 .5rem}
  p{color:rgba(18,24,31,.72);margin:0 0 1.4rem}
  ul{list-style:none;padding:0;margin:0;display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
  a{color:#135F5A}
</style>

<body>
  <script>
    /* Old capitalised URLs (/Skrimp/, /Trove/, /MyAuntie/, /Menzo/) are dead
       since the rename — bookmarks and browser autocomplete still offer them,
       which is why /skrimp kept turning into /Skrimp and erroring. Send them
       to the real page instead of showing this. */
    (function () {
      var p = location.pathname.replace(/\/+$/, '').split('/').pop().toLowerCase();
      var known = ['trove','skrimp','menzo','myauntie','equinox','about','playground','resume'];
      if (known.indexOf(p) !== -1) location.replace('/' + p + '/');
    })();
  </script>
  <main>
    <h1>That page isn't here</h1>
    <p>Every case study lives at its own address, so one of these should be what you wanted:</p>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/trove/">Trove</a></li>
      <li><a href="/skrimp/">Skrimp</a></li>
      <li><a href="/menzo/">Menzoberranzan</a></li>
      <li><a href="/myauntie/">MyAuntie</a></li>
      <li><a href="/equinox/">Equinox</a></li>
      <li><a href="/about/">About</a></li>
      <li><a href="/resume/">Résumé</a></li>
    </ul>
  </main>
</body>
