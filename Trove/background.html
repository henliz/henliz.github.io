<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trove – Background</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap');

    *{margin:0;padding:0;box-sizing:border-box}

    body{
      font-family:'Montserrat',sans-serif;
      background:linear-gradient(135deg,#FFF9F0 0%,#FFF1DE 25%,#FFE7C9 50%,#FFF3E3 75%,#FFF9F0 100%);
      background-size:400% 400%;
      animation:gradientShift 24s ease infinite;
      color:#1A1008;
      overflow-x:hidden;
      min-height:100vh;
      position:relative;
    }

    @keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

    .sky-background{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;opacity:.62;pointer-events:none}
    .sky-background::after{
      content:'';position:absolute;inset:0;
      background:linear-gradient(160deg,rgba(255,202,133,.55) 0%,rgba(253,213,84,.34) 45%,rgba(236,127,14,.30) 100%);
      mix-blend-mode:soft-light;pointer-events:none
    }
    .sky-canvas{
      width:100%;
      height:100%;
      filter:hue-rotate(152deg) saturate(1.9) brightness(1.26) contrast(.88);
    }
    /* cream veil so text always sits on paper, never on a busy sky */
    .veil{
      position:fixed;inset:0;z-index:2;pointer-events:none;
      background:
        radial-gradient(72vw 58vh at 50% 40%, rgba(255,250,240,.40), transparent 72%),
        linear-gradient(180deg, rgba(255,249,240,.30) 0%, rgba(255,244,228,.18) 55%, rgba(255,234,206,.32) 100%);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div class="sky-background">
    <canvas class="sky-canvas" id="skyCanvas"></canvas>
  </div>
  <div class="veil"></div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/loaders/GLTFLoader.js";

    let scene, camera, renderer, skyMesh;
    const clock = new THREE.Clock();

    function initSkyScene() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 12);

      const canvas = document.getElementById('skyCanvas');
      renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);

      scene.add(new THREE.AmbientLight(0xfff0d8, 3.4));

      const loader = new GLTFLoader();
      loader.load('../models/skyblue.glb', function (gltf) {
        skyMesh = gltf.scene;
        if (!skyMesh) return;
        skyMesh.scale.set(5, 5, 5);
        skyMesh.position.set(0, 0, 0);
        skyMesh.traverse((child) => {
          if (!child.isMesh) return;
          if (gltf.parser && gltf.parser.json && gltf.parser.json.textures && gltf.parser.json.textures[0]) {
            gltf.parser.loadTexture(0).then((texture) => {
              child.material.map = texture;
              child.material.color.setHex(0xffffff);
              child.material.transparent = false;
              child.material.opacity = 1;
              child.material.needsUpdate = true;
            });
          } else {
            child.material = new THREE.MeshBasicMaterial({ color: 0xFFCA85, side: THREE.FrontSide });
          }
        });
        scene.add(skyMesh);
      }, undefined, function () {
        const geometry = new THREE.SphereGeometry(1, 32, 32);
        const material = new THREE.MeshBasicMaterial({ color: 0xFFCA85 });
        skyMesh = new THREE.Mesh(geometry, material);
        scene.add(skyMesh);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      if (skyMesh) {
        skyMesh.rotation.y = t * 0.018;
        skyMesh.rotation.x = Math.sin(t * 0.026) * 0.1;
      }
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener('load', () => { initSkyScene(); animate(); });
    window.addEventListener('resize', onWindowResize);
  </script>
</body>
</html>
