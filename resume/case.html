    if (window.parent !== window) document.documentElement.setAttribute('data-embedded', '');

    // tell if the shell's rail is showing. ask the shell's breakpoint instead

<script>
(function () {
  const PDF = '/Henrietta_van_Niekerk_Resume_2026.pdf';
  const PDF_URL = new URL(PDF, location.href).href;
  const root = document.documentElement;
  const sheetsEl = document.getElementById('sheets');
  const toast = document.getElementById('toast');

  // the shell posts its theme in, the same as every case study
  addEventListener('message', e => {
    if (e.data && e.data.type === 'theme') root.setAttribute('data-theme', e.data.value);
  });

  let toastTimer = 0;
  function say(msg) {
    toast.textContent = msg;
    toast.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('on'), 1800);
  }

  // the PDF's own address is what gets shared: it opens anywhere, saves to
  // Drive from any phone's share sheet, and attaches to an email as-is
  document.getElementById('share').addEventListener('click', async () => {
    const data = { title: 'Résumé — Henriëtta van Niekerk', url: PDF_URL };
    if (navigator.share) {
      try { await navigator.share(data); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try { await navigator.clipboard.writeText(PDF_URL); say('Link copied'); }
    catch (e) { window.open(PDF_URL, '_blank', 'noopener'); }
  });

  if (!window.pdfjsLib) {
    // viewer didn't load: hand over the file itself rather than a blank page
    sheetsEl.innerHTML = '<p class="fallback"><a href="' + PDF + '">Open the résumé (PDF)</a></p>';
    return;
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const sheets = [...sheetsEl.querySelectorAll('.sheet')];
  let doc = null, drawnWidth = 0, drawing = false, again = false;

  async function drawPage(n, sheet) {
    const page = await doc.getPage(n);
    const base = page.getViewport({ scale: 1 });
    const cssW = sheet.clientWidth;
    const cssScale = cssW / base.width;
    // a little over the device ratio so a pinch-zoom on a phone stays sharp
    const ratio = Math.min(3, (window.devicePixelRatio || 1) * 1.5);
    const vp = page.getViewport({ scale: cssScale * ratio });

    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(vp.width); canvas.height = Math.ceil(vp.height);
    canvas.setAttribute('aria-hidden', 'true');
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;

    // text layer at CSS scale so selection lines up with the ink
    const cssVp = page.getViewport({ scale: cssScale });
    const text = document.createElement('div');
    text.className = 'textLayer';
    sheet.style.setProperty('--scale-factor', cssScale);
    await pdfjsLib.renderTextLayer({
      textContentSource: await page.getTextContent(), container: text, viewport: cssVp,
    }).promise;

    // hyperref links, positioned in percent so a resize can't misplace them
    const links = document.createElement('div');
    links.className = 'links';
    (await page.getAnnotations()).forEach(a => {
      if (a.subtype !== 'Link' || !a.url) return;
      const [x1, y1, x2, y2] = base.convertToViewportRectangle(a.rect);
      const el = document.createElement('a');
      el.href = a.url;
      if (!a.url.startsWith('mailto:')) { el.target = '_blank'; el.rel = 'noopener'; }
      el.setAttribute('aria-label', a.url.replace(/^mailto:|^https?:\/\//, ''));
      Object.assign(el.style, {
        left:   Math.min(x1, x2) / base.width  * 100 + '%',
        top:    Math.min(y1, y2) / base.height * 100 + '%',
        width:  Math.abs(x2 - x1) / base.width  * 100 + '%',
        height: Math.abs(y2 - y1) / base.height * 100 + '%',
      });
      links.appendChild(el);
    });

    sheet.replaceChildren(canvas, text, links);
    requestAnimationFrame(() => sheet.classList.add('ready'));
  }

  async function drawAll() {
    if (!doc) return;
    // one pass at a time; a resize mid-draw queues a fresh pass after it
    if (drawing) { again = true; return; }
    const w = sheets[0].clientWidth;
    if (Math.abs(w - drawnWidth) < 2) return;
    drawnWidth = w;
    drawing = true;
    try {
      // the sheets are sized for two pages; trim or add if the PDF disagrees
      while (sheets.length > doc.numPages) sheets.pop().remove();
      while (sheets.length < doc.numPages) {
        const s = document.createElement('div'); s.className = 'sheet';
        sheetsEl.appendChild(s); sheets.push(s);
      }
      for (let i = 0; i < sheets.length; i++) await drawPage(i + 1, sheets[i]);
    } finally {
      drawing = false;
      if (again) { again = false; drawAll(); }
    }
  }

  pdfjsLib.getDocument(PDF).promise.then(d => { doc = d; drawAll(); }).catch(() => {
    sheetsEl.innerHTML = '<p class="fallback"><a href="' + PDF + '">Open the résumé (PDF)</a></p>';
  });

  let rq = 0;
  addEventListener('resize', () => { clearTimeout(rq); rq = setTimeout(drawAll, 160); });
})();
</script>
